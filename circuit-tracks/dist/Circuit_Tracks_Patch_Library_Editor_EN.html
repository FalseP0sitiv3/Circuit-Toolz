  const stream = await getStream();
  if (!S.dev.ctx) { S.dev.ctx = new AudioContext({ latencyHint: 'interactive' }); await S.dev.ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: 'application/javascript' }))); }
  const ctx = S.dev.ctx; await ctx.resume();
  const src = ctx.createMediaStreamSource(stream), node = new AudioWorkletNode(ctx, 'ctpl-rec'), chunks = [];
  node.port.onmessage = (e) => { chunks.push(e.data); const lv = $('#lvl'); if (lv) { let m = 0; for (const v of e.data) m = Math.max(m, Math.abs(v)); lv.style.width = Math.min(100, m * 100) + '%'; } };
  src.connect(node); node.connect(ctx.destination);
  const t0 = performance.now(); during?.(t0);
  await new Promise((r) => setTimeout(r, ms));
  src.disconnect(); node.disconnect();
  const n = chunks.reduce((a, c) => a + c.length, 0), x = new Float32Array(n); let o = 0; for (const c of chunks) { x.set(c, o); o += c.length; }

}

  toast('Measuring… (3 s)', 3000);
  s.stopAll(); const note = S.dev.measureNote;
  try {
    const { x, sr } = await record(3400, (t0) => { const t = s.sendPatch(p.payload, S.dev.synth); s.note(S.dev.synth, note, 100, Math.max(t + (S.dev.patchDelay ?? 80), t0 + 250), 1500); });
    const desc = analyzeRecording(x, sr, { noteOn: 0.25, noteOff: 1.75, playedNote: note });

    rerender(); toast(desc.silent ? 'No signal arrived: check the audio input' : 'Measurement saved');

// ---------- importación ----------
async function readInputs(fileList) {
  const out = []; let ignored = 0, big = 0; const packed = [];
  for (const f of fileList) {
    const rel = f.webkitRelativePath || f._path || '', full = rel || f.name;
    if (/\.(rar|7z|tar|gz|tgz)$/i.test(f.name) && !/(^|\/)(__MACOSX|\._)/.test(full)) { packed.push(full); continue; }
    if (!/\.(syx|sysex|bin|zip|json|circuittrackspack|circuitpack)$/i.test(f.name) || /(^|\/)(__MACOSX|\._)/.test(full)) { ignored++; continue; }
    const path = rel ? rel.split('/').slice(0, -1).join('/') : '';
    // Archivos SysEx grandes (packs de samples, transferencias de Components): solo se leen 16 bytes para identificarlos.
    if (/\.(syx|sysex|bin|circuitpack)$/i.test(f.name) && f.size > 2 * 1024 * 1024) { big++; out.push({ name: f.name, path, bytes: new Uint8Array(await f.slice(0, 16).arrayBuffer()), size: f.size, headOnly: true }); continue; }
    if (f.size > 300 * 1024 * 1024) { toast('Too large: ' + f.name); continue; }
    out.push({ name: f.name, path, bytes: new Uint8Array(await f.arrayBuffer()), size: f.size });
  }
  if (ignored) toast(`${ignored} non-patch file(s) (audio, PDF, AppleDouble…) were ignored without reading them`);
  if (packed.length) toast(`${packed.length} compressed file(s) the tool doesn't open (.rar / .7z): ${packed.slice(0, 3).join(' · ')}${packed.length > 3 ? ' …' : ''}. Unpack them and import the folder.`, 12000);
  return out;
}
async function doImport(fileList) {
  const inputs = await readInputs(fileList), json = inputs.filter((x) => /\.json$/i.test(x.name)), rest = inputs.filter((x) => !/\.json$/i.test(x.name));
  for (const j of json) await restoreFrom(j.bytes, j.name);
  if (!rest.length) return;
  let rep;
  try { rep = await lib.importInputs(rest); } catch (e) { toast('Couldn\'t save the import: ' + (/quota/i.test(e.message) ? 'the browser has no more space. Free some space or export and empty the library.' : e.message), 9000); await lib.load(); rerender(); return; }
  S.rowsKey = ''; buildQueue(); rerender();
  if (!S.persisted && navigator.storage?.persist) navigator.storage.persist().then((ok) => { S.persisted = ok; });
  await importReport(rep);
}

// ---------- escucha en el equipo ----------
let sgTimer = 0, sgRaf = 0;
async function sgLoadPatches() {
  const s = sgState(), ss = S.dev.session; let wait = 0;
  for (const t of [0, 1]) { const p = s.patches[t] && lib.byId(s.patches[t]); if (p && ss) { const v = lib.replacementOf?.(p) || p; ss.sendPatch(v.payload, t); wait = (S.dev.patchDelay ?? 80) + 60; } }
  if (wait) await waitMs(wait);
}
function sgStopNow() {
  clearInterval(sgTimer); cancelAnimationFrame(sgRaf); S.sgPlaying = false;
  const ss = S.dev.session; if (ss) ss.stopChannels([...new Set([...sgChannels(), S.dev.chDrum ?? 9])]);
  const ln = $('#sgLine'); if (ln) ln.hidden = true;
}
async function sgPlay(fromSection = 0) {
  const ss = S.dev.session; if (!ss) return;
  sgStopNow();
  const s = sgState(), tl = sgTl(), sec = tl.sections.find((x) => x.index === +fromSection) || tl.sections[0], fromBar = sec.start;
  const ch = sgChannels(), dch = S.dev.chDrum ?? 9, step = 60000 / s.tempo / 4;
  await sgLoadPatches();
  const notes = songNotes(s.fam, tl, { fromBar }), t0 = ss.clock() + 150, base = fromBar * 16;
  const msgs = notes.map((e, i) => {
    const tr = SONG_TRACKS[e.track], c = tr.kind === 'drum' ? dch : ch[e.track], n = tr.kind === 'drum' ? DRUM_NOTES[tr.lane] : e.n;
    const on = t0 + (e.t - base) * step; let offT = on + Math.max(15, Math.min(e.d, 16) * step - 3);
    for (let j = i + 1; j < notes.length && notes[j].t < e.t + e.d; j++) if (notes[j].track === e.track && notes[j].n === e.n) { offT = Math.min(offT, t0 + (notes[j].t - base) * step - 1); break; }
    return { on, off: Math.max(on + 5, offT), c, n, v: Math.max(1, Math.min(127, e.v)) };
  });
  let k = 0; S.sgPlaying = true;
  const pump = () => { const until = ss.clock() + 1500; while (k < msgs.length && msgs[k].on < until) { const m = msgs[k++]; ss.raw([0x90 | m.c, m.n, m.v], m.on); ss.raw([0x80 | m.c, m.n, 0], m.off); } };
  pump(); sgTimer = setInterval(pump, 400);
  const total = tl.bars * 16;
  const tick = () => {
    if (!S.sgPlaying) return;
    const pos = base + (ss.clock() - t0) / step;
    if (pos >= total) { sgStopNow(); rerender(); return; }
    const ln = $('#sgLine'), lbl = $('#sgPos');
    if (ln) { ln.hidden = false; ln.style.left = `calc(132px + (100% - 132px) * ${Math.max(0, pos) / total})`; }
    if (lbl) lbl.textContent = `bar ${Math.max(1, Math.floor(pos / 16) + 1)} of ${tl.bars}`;
    sgRaf = requestAnimationFrame(tick);
  };
  rerender(); tick();
}

// ---------- grabación guiada ----------
async function sgRecord() {
  const ss = S.dev.session; if (!ss || S.recording) return;
  const s = sgState(), tl = sgTl(), off = sgOff(), slots = usedSlots(tl), on = SONG_TRACKS.filter((_, t) => !off.has(t)).map((x) => x.label);
  const ok = await modal('Record the song on the Circuit Tracks', html`<ol class="steps">
    <li>Open an <b>empty project</b> on the Circuit: recording adds to whatever is there.</li>
    <li>Set the project scale to <b>${songKeyName(s.root, s.scale)}</b> (Scale View) or to <b>Chromatic</b>, and the tempo to <b>${s.tempo} BPM</b>.</li>
    ${s.steps === 32 ? html`<li><b>32 steps:</b> on each pass the tool will remind you to lengthen the pattern to 32 steps on each track before recording. Otherwise the Circuit plays it as 16 and the second half is recorded over the first.</li>` : html`<li>Patterns of <b>16 steps</b>: nothing to prepare (it’s the empty project’s length).</li>`}
    <li>Leave the tracks without chains (a single pattern selected on each) while recording.</li>
    <li>Check that <b>Clock Rx</b> is on (Setup View; it's on from the factory).</li>
    <li>Then, for each pattern, the tool will ask you to select it on all tracks (${on.join(', ')}) in Patterns View and press <b>REC</b> (without Play).</li>
    ${s.patches.some(Boolean) ? html`<li>Before starting, the chosen patches are loaded into Synth 1 and 2 (RAM only: save the project with Save when done).</li>` : ''}</ol>`,
  [{ label: 'Cancel', value: false }, { label: 'Start', primary: true, value: true }]);
  if (!ok) return;
  sgStopNow(); patStopNow();
  await sgLoadPatches();
  const chans = sgChannels(), dch = S.dev.chDrum ?? 9;
  for (let i = 0; i < slots.length; i++) {
    const k = slots[i];
    const go = await modal(`Pattern ${k + 1} · ${SLOT_ROLES[k]}`, html`<p class="note">Pass ${i + 1} of ${slots.length}.</p><ol class="steps">
      <li>In Patterns View, select <b>pattern ${k + 1}</b> on each track: ${on.join(', ')}.</li>
      ${s.steps === 32 ? html`<li>On each of those tracks (with its pattern ${k + 1} in view), hold <b>Duplicate</b> and press <b>Step Page</b>: the pattern becomes 32 steps (it’s empty, nothing is copied). If Step Page already alternates blue and orange, it is already 32.</li>` : ''}
      <li>Press <b>REC</b> on the Circuit (without Play).</li>
      <li>Click “Record pattern ${k + 1}».</li></ol>
      ${k === 2 ? html`<p class="note">Pattern 3 is the same as 2 (so the groove repeats A). You can record it the same way or, faster, copy it on the Circuit: in Patterns View, hold <b>Duplicate</b>, press pattern 2 and then 3 on each track, and skip this pass.</p>` : ''}`,
    [{ label: 'Stop here', value: 'stop' }, { label: 'Skip', value: 'skip' }, { label: `● Record pattern ${k + 1}`, primary: true, value: 'rec' }]);
    if (!go || go === 'stop') break;
    if (go === 'skip') continue;
    const events = slotEvents(s.fam, k, { channels: chans, drumChannel: dch, off });
    const r = ss.recordPattern(events, { tempo: s.tempo, steps: s.steps, swing: 0, lead: 250 });
    S.recording = true; rerender();
    toast(`● Recording pattern ${k + 1} (${s.steps} steps)…`, Math.max(1500, r.end - performance.now()));
    await waitMs(Math.max(0, r.end - performance.now() + 150));
    S.recording = false; s.recorded[k] = true; sgSave(); rerender();
  }
  const done = slots.filter((k) => s.recorded[k]).length;
  if (done) await modal('Patterns recorded', html`<p>${done} of ${slots.length} patterns recorded. Now assemble the scenes with the road map (in the section and in “Download road map”) and save the project with <b>Save</b>.</p>`);
}

function sgSheet() {
  const s = sgState(), tl = sgTl(), L = SG_SEC(), off = sgOff(), st = SG_STRAT[s.strategy];
  const cols = SONG_TRACKS.map((tr, t) => (off.has(t) ? null : tr.label)), w = 9;
  const keep = (t) => !off.has(t) || t === tl.timer;
  const rows = songRoadmap(s.fam, tl, s.tempo).map((r) => [String(r.scene).padStart(3), ((L[r.id] || r.id) + (r.of > 1 ? ` ${r.copy + 1}/${r.of}` : '') + (r.end ? ' ' + '· turnaround' : '')).padEnd(18), String(r.bars).padStart(4), ...(r.same ? [`= scene ${r.same} (Duplicate)`] : r.chains.map((c, t) => (keep(t) ? (c || '8').padEnd(w) : null)))].filter((x) => x != null).join('  '));
  const head = ['Scene', 'Section'.padEnd(18), 'Bars', ...SONG_TRACKS.map((tr, t) => (keep(t) ? tr.label.padEnd(w) : null)).filter(Boolean)].join('  ');
  const slots = usedSlots(tl).map((k) => `  ${k + 1}  ${SLOT_ROLES[k]}`);
  const txt = [`${st.name} · ${DRUM_STYLES[s.style]?.label || s.style} · ${songKeyName(s.root, s.scale)} · ${s.tempo} BPM · ${tl.bars} bars · seed ${s.seed}`, '',
    'Patterns on each track (recorded by the tool):', ...slots, '  8  Silence (empty)', '',
    'Scenes (pattern chain per track; 8 = silence; ⏱ = empty patterns that set the length):', head, ...rows, '',
    `Chain scenes 1–${tl.scenes.length}: hold 1 and press ${tl.scenes.length}. Each scene plays once.`, '', 'Tips', ...st.tips.map((x) => '- ' + x), ...SG_TIPS.map((x) => '- ' + x)].join('\n');
  download(`Road map - ${safeFile(st.name + ' ' + s.seed)}.txt`, txt, 'text/plain');
}
function sgMidi() {
  const s = sgState(), tl = sgTl(), st = SG_STRAT[s.strategy];
  const bytes = songToMidi(s.fam, tl, { tempo: s.tempo, channels: sgChannels(), drumChannel: S.dev.chDrum ?? 9, drumMap: s.drumMap, name: st.name, off: sgOff() });
  download(`${safeFile(st.name + ' ' + (DRUM_STYLES[s.style]?.label || s.style) + ' ' + s.seed)}.mid`, bytes, 'audio/midi');

Object.assign(A, {
  sgStrat: (el) => { const s = sgState(); s.strategy = el.dataset.v; s.reshuffle = 0; sgRegen({ keepFam: true }); if (S.sgPlaying) sgStopNow(); rerender(); },
  sgNew: () => { const s = sgState(); s.seed++; s.reshuffle = 0; sgRegen(); rerender(); },
  sgPats: () => { const s = sgState(); s.seed++; sgRegen({ keepSections: true }); rerender(); },
  sgStruct: () => { const s = sgState(); s.reshuffle++; sgRegen({ keepFam: true }); rerender(); },
  sgLock: (el) => { const s = sgState(), i = +el.dataset.i; s.locked = s.locked.includes(i) ? s.locked.filter((x) => x !== i) : [...s.locked, i]; sgSave(); rerender(); },
  sgPlay: (el) => sgPlay(+(el.dataset.from || 0)),
  sgStop: () => { sgStopNow(); rerender(); },
  sgRec: () => sgRecord(),
  sgSheet: () => sgSheet(),
  sgMidi: () => sgMidi(),
  sgMore: () => { S.sgMore = !S.sgMore; rerender(); },
});
// Teclado en Canciones: Espacio escucha/para, N/P/E variantes, 1–5 estrategia
document.addEventListener('keydown', (e) => {
  if (S.view !== 'songs' || e.ctrlKey || e.metaKey || e.altKey || e.target.matches?.('input,textarea,select') || document.querySelector('.modal')) return;
  const k = e.key.toLowerCase();
  if (e.code === 'Space') { e.preventDefault(); if (S.sgPlaying) { sgStopNow(); rerender(); } else if (S.dev.session) sgPlay(0); return; }
  if (k === 'n') A.sgNew(); else if (k === 'p') A.sgPats(); else if (k === 'e') A.sgStruct();
  else if (/^[1-5]$/.test(k) && STRATEGY_IDS[+k - 1]) A.sgStrat({ dataset: { v: STRATEGY_IDS[+k - 1] } });
});
document.addEventListener('change', (e) => {
  const el = e.target; if (el.dataset.act !== 'sgSet') return;
  const s = sgState(), k = el.dataset.k, v = el.value;
  if (k === 'style') { s.style = v; s.styles = [...(SONG_SYNTH_STYLES[v] || s.styles)]; if (!s.tempoTouched) s.tempo = DRUM_STYLES[v]?.tempo || s.tempo; sgRegen(); }
  else if (k === 'tempo') { s.tempo = Math.max(40, Math.min(240, +v || 128)); s.tempoTouched = true; if (s.fam) s.fam.tempo = s.tempo; sgSave(); }
  else if (k === 'root' || k === 'scale') { s[k] = k === 'root' ? +v : v; sgRegen(); }
  else if (k === 'steps') { s.steps = +v; s.locked = []; sgRegen(); }
  else if (k === 'density') { s.density = +v; sgRegen(); }
  else if (/^st\d$/.test(k)) { s.styles = [...s.styles]; s.styles[+k[2]] = v; s.locked = s.locked.filter((x) => x !== +k[2]); sgRegen({ keepSections: true }); }
  else if (/^midi\d$/.test(k)) { s.midi = [...s.midi]; s.midi[+k[4]] = el.checked; s.recorded = {}; sgSave(); }
  else if (/^patch\d$/.test(k)) { s.patches = [...s.patches]; s.patches[+k[5]] = v; sgSave(); }
  else if (k === 'drumMap') { s.drumMap = v; sgSave(); return; }
  else return;
  if (S.sgPlaying) sgStopNow();
  rerender();
});

  else if (el.id === 'labT') { LB.t = +el.value; rerender(); }
});
document.addEventListener('input', (e) => {
  const el = e.target; if (el.id !== 'labT') return;
  const p = cur(), b = p && labB(p); if (!b) return;
  LB.t = +el.value; const m = labMorph(p.payload, b.payload, LB.t / 100);
  const v = document.getElementById('labTv'); if (v) v.textContent = LB.t + ' %';
  const ch = document.getElementById('labMorphCh'); if (ch) { const c = labChanges(p.payload, m, 4); ch.textContent = c.length ? c.map((x) => labChangeText(x)).join(' · ') : 'same as A'; }
  labLiveSend(m);
});
Object.assign(A, {
  labMode: (el) => { LB.mode = el.dataset.v; LB.cands = null; rerender(); },
  labAmt: (el) => { LB.amount = el.dataset.v; LB.cands = null; rerender(); },
  labGrp: (el) => { const g = el.dataset.v; LB.groups = LB.groups.includes(g) ? LB.groups.filter((x) => x !== g) : [...LB.groups, g]; if (!LB.groups.length) LB.groups = [g]; LB.cands = null; rerender(); },
  labGen: () => { const p = cur(); if (!p) return; if (LB.cands) LB.seed++; labGenerate(p); rerender(); },
  labPlay: (el) => { const p = cur(), c = LB.cands?.[+el.dataset.i]; if (p && c) labPlayPayload(p, c.payload); },
  labSave: async (el) => {
    const p = cur(), i = +el.dataset.i, c = LB.cands?.[i]; if (!p || !c) return;
    const lab = LB.mode === 'mutate'
      ? { op: 'mutate', from: [p.id], text: `variation ${LAB_AMOUNT_TEXT[LB.amount]} (${LB.groups.map((g) => LAB_GROUP_LABEL[g].toLowerCase()).join(', ')}) of “${p.name}»` }
      : { op: 'cross', from: c.parents, text: c.parents.length > 2 ? `cross of “${p.name}» with ${c.parents.length - 1} patches from its category` : `cross of “${p.name}» y «${lib.byId(c.parents[1])?.name || '?'}»` };
    const np = await labSavePayload(p, c.payload, labName(p, LB.mode === 'mutate' ? ` M${i + 1}` : ` X${i + 1}`), lab);
    if (np) { LB.saved[i] = np.id; rerender(); }
  },
  labPlayMorph: () => { const p = cur(), b = p && labB(p); if (b) labPlayPayload(p, labMorph(p.payload, b.payload, LB.t / 100)); },
  labSaveMorph: async () => {
    const p = cur(), b = p && labB(p); if (!b) return;
    await labSavePayload(p, labMorph(p.payload, b.payload, LB.t / 100), labName(p, ` ${LB.t}%`), { op: 'morph', from: [p.id, b.id], text: `morph of “${p.name}» y «${b.name}” at ${LB.t} %` });
    rerender();
  },
  labGo: (el) => { S.sel = el.dataset.id; S.view = 'library'; rerender(); },
});

// ---- ui/quick_ui.js ----
// ui/quick_ui.js — v3.9: lo que se hace mientras se escucha, sin ir a otra sección.
//  · Octava rápida: −8va / +8va (Alt ↓ / Alt ↑) en Escucha, en la ficha y en el patch acoplado. Crea una versión
//    aceptada (la que se exporta y la que suena en el equipo) y las pulsaciones siguientes se suman en esa misma
//    versión. Si vuelve a quedar como el original, la versión se quita. Suena otra vez al momento.
//  · Portapapeles de etiquetas: copiar las de un patch (Mayús V), pegarlas en el que escuchas (V) o en la
//    selección, y guardar conjuntos como grupos («Wobble + Dark») para cargarlos con un clic.

// ---------- octava rápida ----------
function quickOctOf(p) { const v = p && lib.currentVersion(p); return v && v.kind === 'variant' && v.meta.quickOct ? v.meta.quickOct : 0; }
function octBtnsHTML(p) {
  if (!p) return '';
  const n = quickOctOf(p), lbl = n ? `${n > 0 ? '+' : '−'}${Math.abs(n / 12)} oct` : 'Octave';
  return html`<span class="octq" title="Lower or raise this patch one octave (Alt ↓ / Alt ↑). It becomes the accepted version: it exports like this.">
    <button class="btn small" data-act="qOct" data-n="-12" data-id="${p.id}">−8va</button><b class="mono ${n ? 'on' : ''}">${lbl}</b><button class="btn small" data-act="qOct" data-n="12" data-id="${p.id}">+8va</button></span>`;
}
async function quickOctave(p0, n) {
  if (!p0) return;
  const base = p0.kind === 'variant' && p0.meta.quickOct ? lib.byId(p0.parentId) || p0 : p0;
  const cv = lib.currentVersion(base);
  const t = transposeSemitones(cv.payload, n, regMethod(), {});
  if (!t || !t.payload) { toast('This patch can\'t be transposed', 5000); return; }
  const quick = cv.kind === 'variant' && cv.meta.quickOct;
  const total = (quick ? cv.meta.quickOct : 0) + n;
  let now = cv;
  if (quick) {
    if (!total) {
      // vuelve a ser el original: la versión rápida sobra
      await lib.adoptVariants([cv.id], false); await lib.deletePatches([cv.id], true); now = lib.currentVersion(base);
    } else {
      const edits = []; for (let i = 0; i < 340; i++) if (t.payload[i] !== cv.payload[i]) edits.push([i, t.payload[i]]);
      await lib.editVariantBytes(cv.id, edits, `Pitch ${fmtSemis(n)} st (by hand)`);
      await lib.updateMeta([cv.id], { quickOct: total }, `Octave by hand: ${fmtSemis(total / 12)} oct`);
      cv.originText = `Octave ${fmtSemis(total / 12)} (by hand)`;
    }
  } else {
    const v = await lib.createVariant(cv.id, t.payload, 'register', `Octave ${fmtSemis(total / 12)} (by hand)`, '');
    await lib.updateMeta([v.id], { quickOct: total }, `Octave by hand: ${fmtSemis(total / 12)} oct`);
    await lib.adoptVariants([v.id], true); now = v;
  }
  if (S.sel && !lib.byId(S.sel)) S.sel = base.id;
  if (S.sel && lib.byId(S.sel)?.kind === 'variant' && lib.byId(S.sel).meta.quickOct) S.sel = now.id;
  S.rowsKey = ''; rerender();
  const s = S.dev.session;
  if (s) quickPlay(base, lib.currentVersion(base).payload);
  toast(total ? `«${base.name}»: ${fmtSemis(total / 12)} oct from the original${t.problems?.length ? ' · ' + t.problems[0] : ''}` : `«${base.name}” is back to its original octave`, 4000);
}
function quickPlay(p, payload) {
  const s = S.dev.session; if (!s) return;
  s.stopAll();
  const ph = S.phrase === 'auto' ? phraseKeyFor(p) : S.phrase, t = s.sendPatch(payload, S.dev.synth);
  s.playPhrase(phraseObj(ph), S.dev.synth, { tempo: tempoNow(), root: phraseObj(ph).custom ? 0 : S.dev.root, start: t + (S.dev.patchDelay ?? 80) });
}

// ---------- portapapeles de etiquetas ----------
const clipTags = () => lib.settings.tagClip || [];
const tagGroups = () => lib.settings.tagGroups || [];
async function setClip(tags) { await lib.setSetting('tagClip', [...new Set(tags.map((x) => String(x).trim()).filter(Boolean))].slice(0, 12)); }
function clipTargets() {
  if (S.view === 'library' && S.multi.size > 1) return [...S.multi];
  const p = cur(); return p ? [p.id] : [];
}
function tagClipHTML() {
  const c = clipTags(), g = tagGroups(), p = cur(), has = p ? (p.meta.tags || []) : [], multi = S.view === 'library' && S.multi.size > 1;
  const pending = c.filter((x) => !has.includes(x)).length;
  return html`<div class="tclip"><div class="mlabel"><span>Tag clipboard</span><span class="kbdh"><kbd>V</kbd> paste · <kbd>Shift</kbd><kbd>V</kbd> copy</span></div>
    <div class="tagbox">${c.map((t) => html`<span class="tagp clip">${t}<button data-act="clipDel" data-t="${t}" aria-label="Remove ${t}">×</button></span>`)}<input class="tagin" id="clipIn" list="tagList" placeholder="${c.length ? 'Add…' : 'Type a tag, or copy a patch\'s tags'}"></div>
    <div class="row2" style="gap:5px;flex-wrap:wrap;margin-top:5px">
      <button class="btn small" data-act="clipCopy" ${p && has.length ? '' : 'disabled'} title="This patch's tags to the clipboard (Shift V)">Copy from this</button>
      <button class="btn small ${c.length && (pending || multi) ? 'primary' : ''}" data-act="clipPaste" ${c.length && p ? '' : 'disabled'} title="Add the clipboard tags (V)">${multi ? `Paste on ${S.multi.size}` : pending || !c.length ? 'Paste on this' : '✓ Already has them'}</button>
      ${c.length ? html`<button class="btn small" data-act="clipGroup" title="Save this set to load it with one click">Save as group</button><button class="btn small" data-act="clipClear">Empty</button>` : ''}</div>
    ${g.length ? html`<div class="chips" style="margin-top:6px">${g.map((x, i) => html`<span class="tgrp"><button class="tq" data-act="clipLoad" data-i="${i}" title="Load into the clipboard: ${x.join(', ')}">${x.join(' + ')}</button><button class="lk" data-act="clipGroupDel" data-i="${i}" aria-label="Remove the group">×</button></span>`)}</div>` : ''}</div>`;
}
async function clipPaste() {
  const c = clipTags(), ids = clipTargets(); if (!c.length || !ids.length) return;
  await lib.addTags(ids, c);
  rerender(); toast(`${c.join(', ')} → ${ids.length === 1 ? '«' + lib.byId(ids[0]).name + '»' : ids.length + ' patches'}`, 2500);
}
async function clipCopy() {
  const p = cur(), t = p ? p.meta.tags || [] : []; if (!t.length) { toast('This patch has no tags'); return; }
  await setClip(t); rerender(); toast('Copied: ' + t.join(', '), 2500);
}

document.addEventListener('keydown', (e) => {
  if (e.target.matches('input,textarea,select') || document.querySelector('.modal') || e.ctrlKey || e.metaKey) return;
  if (!['audition', 'library'].includes(S.view)) return;
  if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) { e.preventDefault(); e.stopImmediatePropagation(); quickOctave(cur(), e.key === 'ArrowUp' ? 12 : -12); return; }
  if (!e.altKey && e.key.toLowerCase() === 'v') { e.preventDefault(); e.stopImmediatePropagation(); if (e.shiftKey) clipCopy(); else clipPaste(); }
}, true);
document.addEventListener('keydown', async (e) => {
  if (e.target.id !== 'clipIn' || e.key !== 'Enter') return;
  e.preventDefault(); const v = e.target.value.trim(); if (!v) return;
  await setClip([...clipTags(), ...v.split(',')]); rerender(); setTimeout(() => document.getElementById('clipIn')?.focus(), 0);
});
Object.assign(A, {
  qOct: (el) => quickOctave(lib.byId(el.dataset.id) || cur(), +el.dataset.n),
  clipCopy: () => clipCopy(),
  clipPaste: () => clipPaste(),
  clipDel: async (el) => { await setClip(clipTags().filter((x) => x !== el.dataset.t)); rerender(); },
  clipClear: async () => { await setClip([]); rerender(); },
  clipGroup: async () => { const c = clipTags(); if (!c.length) return; const g = tagGroups().filter((x) => x.join('|') !== c.join('|')); await lib.setSetting('tagGroups', [c, ...g].slice(0, 12)); rerender(); },
  clipLoad: async (el) => { const g = tagGroups()[+el.dataset.i]; if (g) { await setClip(g); rerender(); } },
  clipGroupDel: async (el) => { const g = tagGroups().slice(); g.splice(+el.dataset.i, 1); await lib.setSetting('tagGroups', g); rerender(); },
});

})();</script>
