  const macroVariants = core.filter((ids) => new Set(ids.map((id) => records.find((r) => r.id === id).fp.synth)).size > 1);
  return { payload, synth, macroVariants };
}

function nearest(target, records, k = 8) {
  return records.filter((r) => r.payload !== target).map((r) => ({ id: r.id, s: similarity(target, r.payload) })).sort((a, b) => b.s - a.s).slice(0, k);
}

// ---- core/families.js ----
// Familias de patches (duplicados y variantes agrupados) y mapa 2D de similitud técnica.



// items: [{id, payload, fp, name, fileName, importedAt}]
// Une: misma síntesis (32–339), mismo núcleo (32–203: variantes de macros), y mismo nombre base con
// similitud técnica ≥ simNamed (variantes de parámetros con nombre emparentado).
function buildFamilies(items, { simNamed = 0.9 } = {}) {
  const parent = new Map(items.map((x) => [x.id, x.id]));
  const find = (a) => { while (parent.get(a) !== a) { parent.set(a, parent.get(parent.get(a))); a = parent.get(a); } return a; };
  const union = (a, b) => { const ra = find(a), rb = find(b); if (ra !== rb) parent.set(rb, ra); };
  const byKey = (fn) => { const m = new Map(); for (const x of items) { const k = fn(x); if (!k) continue; if (m.has(k)) union(m.get(k), x.id); else m.set(k, x.id); } };
  byKey((x) => x.fp.synth); byKey((x) => x.fp.core);
  const byName = new Map();
  // Nombres genéricos («Bass 01», «Pad 2») no indican parentesco: solo se agrupan nombres con alguna palabra propia.
  for (const x of items) { const k = baseName(x.name) || baseName(x.fileName); if (!k || k.length < 3 || !matchText(k).unknown.length) continue; (byName.get(k) || byName.set(k, []).get(k)).push(x); }
  for (const group of byName.values()) {
    if (group.length < 2 || group.length > 60) continue;
    for (let i = 0; i < group.length; i++) for (let j = i + 1; j < group.length; j++) if (find(group[i].id) !== find(group[j].id) && similarity(group[i].payload, group[j].payload) >= simNamed) union(group[i].id, group[j].id);
  }
  const fams = new Map();
  for (const x of items) { const r = find(x.id); (fams.get(r) || fams.set(r, []).get(r)).push(x); }
  return [...fams.values()].filter((m) => m.length > 1).map((members) => {
    members.sort((a, b) => (a.kind === 'variant') - (b.kind === 'variant') || (a.importedAt < b.importedAt ? -1 : 1));
    const head = members[0];
    return { id: head.id, head: head.id, members: members.map((m) => ({ id: m.id, rel: m === head ? null : relation(head.payload, m.payload) })) };
  });
}

// PCA a 2 componentes sobre vectores de parámetros (one-hot para listas).
function vectorize(payload) {
  const out = [];
  for (const v of featureVector(payload)) {
    if ('cat' in v) {
      const isWave = v.k.startsWith('osc') && v.k.endsWith('.wave');
      const k = v.k === 'voice.poly' ? 3 : v.k === 'filter.type' ? 6 : isWave ? 4 : 2;
      const bucket = isWave ? (v.cat <= 1 ? 0 : v.cat <= 11 ? 1 : (v.cat <= 13 || v.cat === 15) ? 2 : 3) : v.cat % k;
      for (let i = 0; i < k; i++) out.push(i === bucket ? v.w * 0.7 : 0);

  }

}

  const X = rows.map((r) => r.map((v, j) => v - mean[j]));
  const cov = Array.from({ length: d }, () => new Float64Array(d));
  for (const r of X) for (let a = 0; a < d; a++) { const ra = r[a]; if (!ra) continue; for (let b = a; b < d; b++) cov[a][b] += ra * r[b]; }

  }

// Afinidad con «lo que sueles usar»: media de las 3 mayores similitudes con el conjunto de referencia.
function affinity(target, refs) {

  const s = refs.map((r) => similarity(target, r)).sort((a, b) => b - a).slice(0, 3);
  return s.reduce((a, b) => a + b, 0) / s.length;
}

// ---- core/macros.js ----
// Auditoría y edición de las 8 macros (8 × 17 bytes desde el offset 204).
// Estructura documentada oficialmente; el significado de los códigos de destino es comunitario.


function auditMacros(payload) {
  const d = decodePatch(payload);
  const integrity = [], observations = [];
  const destUse = new Map();
  for (const m of d.macros) {
    const seenInKnob = new Set();
    for (const s of m.slots) {
      if (s.dest > 70) integrity.push({ knob: m.index, slot: s.slot, text: `M${m.index + 1}${'ABCD'[s.slot]}: destino ${s.dest} fuera del rango documentado 0–70` });
      if (s.state !== 'active') continue;
      if (s.dest === 70) observations.push({ knob: m.index, text: `M${m.index + 1}${'ABCD'[s.slot]}: código 70 sin significado conocido` });
      if (seenInKnob.has(s.dest)) observations.push({ knob: m.index, text: `M${m.index + 1}: el mismo destino (${s.info.label}) aparece en dos rutas` });
      seenInKnob.add(s.dest);
      if (!destUse.has(s.dest)) destUse.set(s.dest, new Set());
      destUse.get(s.dest).add(m.index);
      if (s.info.group === 'matrix') {
        const mi = s.dest - 50, route = d.matrix[mi];
        if (route && route.s1 === 0 && route.s2 === 0) observations.push({ knob: m.index, text: `M${m.index + 1}: controla la profundidad de la matriz ${mi + 1}, cuya fuente es «Direct» (desplazamiento fijo)` });
      }
    }
    if (!m.active) observations.push({ knob: m.index, text: `M${m.index + 1}: sin rutas con efecto (profundidad 0 o recorrido nulo)`, inactive: true });
  }
  const shared = [...destUse.entries()].filter(([, ks]) => ks.size > 1).map(([dest, ks]) => ({ dest, label: macroDestInfo(dest).label, knobs: [...ks] }));
  for (const s of shared) observations.push({ text: `Destino compartido: ${s.label} en ${s.knobs.map((k) => 'M' + (k + 1)).join(', ')}`, shared: true });
  const knobs = d.macros.map((m) => {
    const act = m.slots.filter((s) => s.state === 'active');
    const groups = [...new Set(act.map((s) => s.info.group))];
    return { ...m, activeCount: act.length, groups, mainGroup: groups[0] || null, summary: act.length ? act.map((s) => s.info.label).join(' · ') : 'Sin efecto' };
  });
  return { knobs, integrity, observations, shared };
}

// Compatibilidad de un patch con un perfil (diferencia de preferencia, NO error de integridad).
function profileFit(payload, profileId) {
  const prof = PROFILES[profileId], a = auditMacros(payload);
  return prof.knobs.map((want, k) => {
    const knob = a.knobs[k];
    const exact = knob.slots.some((s) => s.state === 'active' && want.dests.includes(s.dest));
    const group = knob.groups.includes(want.group);
    return { knob: k, want, have: knob.summary, status: exact ? 'match' : group ? 'group' : knob.activeCount ? 'differs' : 'empty' };

// Reordena macros completas (con todas sus rutas) para acercarse al perfil. Conserva todas las rutas.

// Reconstrucción completa según perfil (descarta TODAS las rutas actuales). Solo sobre copias.

// Valor que alcanza un destino con la macro en `pos` (0–127).
// ESTIMACIÓN: Novation no publica la fórmula. Modelo: la ruta actúa solo entre inicio y fin del recorrido del knob;

// ---- core/zip.js ----
// Lector y escritor ZIP mínimos y defensivos (sin dependencias).

const ZIP_LIMITS = { maxEntries: 5000, maxEntrySize: 4 * 1024 * 1024, maxTotal: 256 * 1024 * 1024, maxRatio: 200 };

const CRC_TABLE = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

async function readZip(bytes, filter = () => true) {

}

// ---- core/midi.js ----
// Sesión con Circuit Tracks por Web MIDI.
// Protocolo según la Programmer's Reference Guide v3:
//  · Synth 1 canal 1, Synth 2 canal 2 · macros CC 80–87 · patch por Program Change 0–63.
//  · SysEx: ≥ 20 ms entre mensajes · respuestas solo por USB · PGM → esperar ~10 ms → Dump Request.
// Las salidas/entradas se inyectan (MIDIOutput/MIDIInput o simulacros) para poder probarlo sin hardware.


class CircuitSession {

  constructor(output, input, clock = () => performance.now(), channels = MIDI_MAP.synthChannels) {

    return t;
  }

  sendPatch(payload, synth = 0) { return this.sysex(buildReplaceCurrent(payload, synth, 0x64)); }

  }

  }

  // No hay forma documentada de enviar patrones por SysEx; lo que sí está documentado es que el equipo sigue
  // Start/Stop/Clock/Song Position externos (con Clock Rx activo) y graba las notas que recibe con REC activado.
  // Secuencia: Stop → posición 0 → Start + 6 pulsos de reloj por paso → notas en el canal de destino → Stop exacto.
  // events: [{ t (paso), n, d (pasos), v, ch (0-15) }] · ccs: [{ t, num, v, ch }]

    sorted.forEach((e, i) => {
      const on = at(e.t) + 2; // justo después del pulso: el equipo lo coloca en su paso
      let off = Math.min(on + Math.max(15, Math.min(e.d, 16) * step - noteGap), end - 4); // el Circuit guarda gates de hasta 16 pasos

      this.raw([0x80 | e.ch, e.n & 127, 0], Math.max(on + 5, off));

// Convierte eventos de nota en una frase cuantizada a semicorcheas.
function eventsToPhrase(events, tempo = 124, label = 'Frase capturada') {
  const step = 60000 / tempo / 4, open = new Map(), notes = [];

  for (const s of open.values()) notes.push({ t: Math.max(0, Math.round((s.at - t0) / step)), n: s.n, d: 1, v: s.v });

  sameSound(a, b) { for (let i = 0; i < 340; i++) if (a[i] !== b[i]) return false; return true; }
  // Volver al original: la versión va a la papelera (se puede recuperar o deshacer con Ctrl Z).
  async revertToOriginal(p) {
    const root = this.rootOf(p), chain = []; let q = root, i = 0;
    while (this.adoptedMap().has(q.id) && i++ < 16) { q = this.byId(this.adoptedMap().get(q.id)); if (!q) break; chain.push(q.id); }
    if (!chain.length) return root;
    await this.deletePatches(chain); return root;
  }
  // Duplicar: un sonido nuevo e independiente (otra fila, sus propias carpetas y su propio nombre).
  async duplicateSound(p, suffix = ' 2') {
    const src = this.currentVersion(this.rootOf(p)), pl = new Uint8Array(src.payload);
    const nm = (readName(pl).name || src.name || 'Patch').slice(0, 16 - suffix.length) + suffix; pl.set(encodeName(nm), 0);
    const c = await this.createVariant(src.id, pl, 'copy', `Copia de «${src.name}»`, '');
    c.parentId = null; c.copyOf = this.rootOf(p).id; c.rootId = c.id; c.meta.adopted = false; delete c.meta.quickOct;
    await this.store.putMany('patches', [c]); this.emit(); return c;
  }

  // ---------- Ordenar lo que dejó el modelo anterior (cadenas, ramas, borradores repetidos) ----------
  // Plan sin tocar nada: por sonido, qué versión queda, qué sobra y qué propuestas siguen pendientes.
  versionsPlan() {
    const out = { sounds: [], collapse: 0, drop: [], keep: [], meta: 0 };
    for (const [rid, ids] of this.groups()) {
      if (ids.length < 2) continue;
      const root = this.byId(rid), cv = this.currentVersion(root), chain = [];
      let q = root, i = 0; while (this.adoptedMap().has(q.id) && i++ < 16) { q = this.byId(this.adoptedMap().get(q.id)); if (!q) break; chain.push(q.id); }
      const s = { root: rid, keep: cv.id !== rid ? cv.id : null, dropChain: chain.slice(0, -1), drop: [], keep2: [], metaFix: false };
      for (const id of ids) {
        if (id === rid || chain.includes(id)) continue;
        const v = this.byId(id), d = this.proposalDiff(v), target = cv.payload;
        const nothing = !d.length || d.every(([o, x]) => target[o] === x) || this.sameSound(v.payload, root.payload) || this.sameSound(v.payload, cv.payload);
        if (nothing) s.drop.push(id); else s.keep2.push(id);
      }
      const metas = ids.map((id) => this.byId(id).meta), key = (m) => JSON.stringify([m.category, m.subtype, [...(m.tags || [])].sort(), m.rating || 0, !!m.fav, m.notes || '', m.patternId || null]);
      s.metaFix = new Set(metas.map(key)).size > 1;
      if (s.dropChain.length || s.drop.length || s.metaFix || (s.keep && this.byId(s.keep).parentId !== rid)) {
        out.sounds.push(s); out.collapse += s.dropChain.length ? 1 : 0; out.drop.push(...s.dropChain, ...s.drop); out.keep.push(...s.keep2); out.meta += s.metaFix ? 1 : 0;
      }

  }
  // Aplica el plan: una versión por sonido (con lo que sonaba), fuera lo repetido, metadatos unificados.
  // dropProposals: también descarta las propuestas que sí cambian algo. Se deshace entero (historial · op 'versions').
  async tidyVersions(plan = this.versionsPlan(), { dropProposals = false } = {}) {
    if (!plan.sounds.length) return { sounds: 0, dropped: 0 };
    const touchedIds = new Set(plan.sounds.flatMap((s) => this.groups().get(s.root) || []));
    const snap = { patches: [...touchedIds].map((id) => structuredClone(this.byId(id))), banks: structuredClone(this.banks), collections: structuredClone(this.collections) };
    const drop = new Set(), ups = new Map();
    for (const s of plan.sounds) {
      const root = this.byId(s.root), group = (this.groups().get(s.root) || []).map((id) => this.byId(id));
      // metadatos del sonido: la clasificación más reciente, todas las etiquetas, la mejor valoración
      const ms = group.map((p) => p.meta), cls = ms.filter((m) => m.category).sort((a, b) => String(b.classAt || '').localeCompare(String(a.classAt || '')))[0] || root.meta;
      const merged = { category: cls.category ?? null, subtype: cls.subtype ?? null, classStatus: cls.classStatus, classAt: cls.classAt, tags: [...new Set(ms.flatMap((m) => m.tags || []))], rating: Math.max(0, ...ms.map((m) => m.rating || 0)), fav: ms.some((m) => m.fav), notes: [...new Set(ms.map((m) => (m.notes || '').trim()).filter(Boolean))].join('\n'), patternId: root.meta.patternId || ms.find((m) => m.patternId)?.patternId || null };
      for (const p of group) { Object.assign(p.meta, structuredClone(merged)); ups.set(p.id, p); }
      if (s.keep) { const k = this.byId(s.keep); if (k.parentId !== root.id) { k.parentId = root.id; k.diff = null; } k.meta.adopted = true; const ops = s.dropChain.map((id) => this.byId(id)?.originText).filter(Boolean); if (ops.length) { k.ops = [...new Set([...ops, ...(k.ops || [k.originText].filter(Boolean))])].slice(-8); k.originText = k.ops.join(' · '); } ups.set(k.id, k); }
      for (const id of [...s.dropChain, ...s.drop, ...(dropProposals ? s.keep2 : [])]) drop.add(id);
      if (!dropProposals) for (const id of s.keep2) { const v = this.byId(id); if (!v.diff) v.diff = this.proposalDiff(v); v.meta.adopted = false; ups.set(v.id, v); }
      if (!dropProposals) for (const id of s.keep2) { const v = this.byId(id); v.parentId = root.id; }
    }
    // packs y colecciones que apuntaban a lo que sobra: pasan al sonido (al exportar va su versión vigente)
    const to = new Map(); for (const s of plan.sounds) for (const id of this.groups().get(s.root) || []) if (drop.has(id)) to.set(id, s.root);
    for (const b of this.banks) b.slots = b.slots.map((x) => (x && to.has(x) ? (b.slots.includes(to.get(x)) ? null : to.get(x)) : x));
    for (const c of this.collections) if (c.ids) c.ids = [...new Set(c.ids.map((x) => to.get(x) || x))];
    this.patches = this.patches.filter((p) => !drop.has(p.id));
    await this.store.delete('patches', [...drop]); await this.store.putMany('patches', [...ups.values()].filter((p) => !drop.has(p.id)));
    await this.store.putMany('banks', this.banks); await this.store.putMany('collections', this.collections);
    await this.log('versions', [...touchedIds], snap, null, `Versiones ordenadas: ${plan.sounds.length} sonido(s), ${drop.size} variante(s) sobrante(s) fuera`, true);
    this.emit();
    return { sounds: plan.sounds.length, dropped: drop.size };
  }
  fileOf(p) { return this.files.find((f) => f.id === p.fileId); }

  // ---------- Análisis con caché ----------
  info(p) {
    const key = p.id + ':' + p.fp.payload + ':' + (p.meta.classStatus || '') + ':' + this.rules.length + ':' + (this.rulesVersion || 0) + ':' + (p.acoustic?.at || '');
    let c = this._cache.get(p.id);
    if (c && c.key === key) return c;
    const an = analyze(p.payload);
    const cls = classify({ payload: p.payload, fileName: p.fileName, folderPath: p.folderPath, bankName: p.bankName, rules: this.rules, acoustic: p.acoustic });
    const ex = this.rules.find((r) => r.enabled && r.type === 'patch' && r.pattern === p.fp.payload);
    if (ex) { cls.category = ex.category; cls.subtype = ex.subtype || null; cls.certainty = 'manual'; cls.evidence.unshift({ cat: ex.category, pts: 0, source: 'Excepción', why: 'Excepción registrada para esta carga exacta' }); }
    c = { key, an, cls, integrity: integrityCheck(p.payload), macros: auditMacros(p.payload) };
    this._cache.set(p.id, c);
    return c;
  }
  effectiveCategory(p) { return p.meta.category || null; }

  // ---------- Importación ----------
  // inputs: [{name, path, bytes}] ; path = carpeta relativa (sin el nombre)
  async importInputs(inputs, onProgress) {
    const report = { files: 0, patches: 0, duplicatesFile: [], duplicatesPatch: [], unknown: [], errors: [], skipped: [], warnings: [], foreign: [], repaired: 0, packs: [] };
    const newFiles = [], newPatches = [], touched = [];
    const fileHashes = new Map(this.files.map((f) => [f.sha256, f]));
    const payloadIdx = new Map(this.patches.filter((p) => p.kind === 'original').map((p) => [p.fp.payload, p]));
    let processed = 0;
    const handleSyx = async (name, path, bytes, zipName, pack) => {
      if (bytes.length > MAX_SYX) { report.skipped.push({ name, why: sniffHead(bytes.subarray(0, 16)) || 'Mayor de 2 MB' }); return; }
      const hash = await sha256(bytes);
      if (fileHashes.has(hash)) { report.duplicatesFile.push({ name: (path ? path + '/' : '') + name, existing: fileHashes.get(hash).name }); return; }
      const { messages, anomalies } = splitMessages(bytes);
      const parsed = messages.map((m) => parseMessage(m.bytes, m.repairs));
      const foreign = parsed.filter((r) => r.kind === 'foreign' && r.foreign !== 'emptySlot');
      const where0 = (path ? path + '/' : '') + name;
      // Archivos que solo contienen material de otros equipos: se explican en bloque y no se guardan.
      if (messages.length && parsed.every((r) => r.kind === 'foreign')) {
        if (foreign.length) report.foreign.push({ name: where0, kind: foreign[0].foreign, why: FOREIGN[foreign[0].foreign], count: foreign.length, names: foreign.map((r) => r.name).filter(Boolean) });
        return;
      }
      const file = { id: uid(), sha256: hash, name, path: path || '', zipName: zipName || '', size: bytes.length, bytes, importedAt: now(), source: pack ? 'pack' : zipName ? 'zip' : 'file', anomalies: anomalies.map((a) => a.text), messageCount: messages.length, isBank: detectBank(parsed), patchIds: [] };
      fileHashes.set(hash, file); newFiles.push(file); report.files++;
      const repairedHere = anomalies.some((a) => a.code === 'bad-location' || a.code === 'missing-f7');
      const otherAnom = anomalies.filter((a) => a.code !== 'bad-location' && a.code !== 'missing-f7');
      if (otherAnom.length) report.warnings.push({ name: where0, items: otherAnom.map((a) => a.text) });
      if (foreign.length) report.foreign.push({ name: where0, kind: foreign[0].foreign, why: FOREIGN[foreign[0].foreign], count: foreign.length, names: foreign.map((r) => r.name).filter(Boolean) });
      if (!messages.length) { report.unknown.push({ name: where0, why: 'Sin mensajes SysEx' }); return; }
      parsed.forEach((r, i) => {
        if (r.kind === 'foreign') return;
        if (r.kind !== 'patch' || !r.payload) { report.unknown.push({ name: where0, why: (r.kind === 'dump-request' ? 'Petición de volcado (no contiene patch)' : r.problems.join('; ')) + (messages.length > 1 ? ` · mensaje ${i + 1}` : '') }); return; }
        if (r.problems.length) report.warnings.push({ name: where0, items: r.problems.map((x) => (messages.length > 1 ? `mensaje ${i + 1}: ` : '') + x) });
        const fp = fingerprints(r.payload);
        const dup = payloadIdx.get(fp.payload);
        const where = where0 + (messages.length > 1 ? ` #${i + 1}` : '');
        if (dup) { (dup.alsoFoundIn ||= []).push(where); if (!touched.includes(dup)) touched.push(dup); report.duplicatesPatch.push({ name: where, existing: dup.name }); return; }
        const p = {
          id: uid(), kind: 'original', fileId: file.id, msgIndex: i, msgOffset: messages[i].offset, payload: r.payload,
          header: { product: r.product, command: r.command, location: r.location, format: r.format }, fp,
          name: readName(r.payload).name || name.replace(/\.[^.]+$/, ''), fileName: name, folderPath: path || '', bankName: pack?.name || (zipName ? zipName.replace(/\.zip$/i, '') : ''),
          bankSlot: pack ? r.location : file.isBank ? r.location : null, importedAt: now(), modifiedAt: now(), parentId: null, alsoFoundIn: [], meta: newMeta()
        };
        if (r.product === 0x60) p.meta.tags.push('Circuit original');
        if (repairedHere) { p.repaired = messages[i].repairs.slice(); report.repaired++; }
        payloadIdx.set(fp.payload, p); newPatches.push(p); file.patchIds.push(p.id); report.patches++;
      });

      processed++; onProgress?.(processed, inputs.length, inp.name);
      try {
        if (/(^|\/)(__MACOSX|\._)/.test((inp.path ? inp.path + '/' : '') + inp.name)) continue;
        if (inp.headOnly) { const why = sniffHead(inp.bytes, inp.name); if (why) report.foreign.push({ name: (inp.path ? inp.path + '/' : '') + inp.name, kind: 'components', why, count: 1, size: inp.size, names: [] }); else report.skipped.push({ name: inp.name, why: `Demasiado grande (${(inp.size / 1048576).toFixed(1)} MB) para ser un archivo de patches` }); continue; }
        if (/\.circuittrackspack$/i.test(inp.name)) {
          // Pack de Components (ZIP). Solo se leen patches/*.syx e index.json; samples y proyectos se ignoran.
          const z = await readZip(inp.bytes, (p) => /^patches\/[^/]+\.syx$/i.test(p) || p === 'index.json');
          report.errors.push(...z.errors.map((e) => `${inp.name}: ${e}`));
          let idx = null; const ie = z.entries.find((e) => e.path === 'index.json');
          if (ie) try { idx = JSON.parse(new TextDecoder().decode(ie.bytes)); } catch { report.warnings.push({ name: inp.name, items: ['index.json ilegible'] }); }
          const pack = { name: String(idx?.name || inp.name.replace(/\.circuittrackspack$/i, '')).slice(0, 80), product: idx?.product || null };
          const before = report.patches;
          const ents = z.entries.filter((e) => e !== ie).sort((a, b) => (parseInt(a.path.match(/\d+/)) || 0) - (parseInt(b.path.match(/\d+/)) || 0));
          for (const e of ents) await handleSyx(e.path.split('/').pop(), [inp.path, pack.name].filter(Boolean).join('/'), e.bytes, inp.name, pack);
          report.packs.push({ name: inp.name, pack: pack.name, product: pack.product, patches: report.patches - before, entries: ents.length });
        } else if (/\.circuitpack$/i.test(inp.name)) {
          report.foreign.push({ name: (inp.path ? inp.path + '/' : '') + inp.name, kind: 'components', why: 'Pack del Circuit original (.circuitpack): formato propio de Components. Para usar sus patches, ábrelo en Components y exporta cada patch como .syx', count: 1, names: [] });
        } else if (/\.zip$/i.test(inp.name)) {
          const z = await readZip(inp.bytes, (p) => /\.(syx|sysex)$/i.test(p) && !/(^|\/)(__MACOSX|\._)/.test(p));
          report.errors.push(...z.errors.map((e) => `${inp.name}: ${e}`));
          report.skipped.push(...z.skipped.filter((s) => !/no importable/.test(s.why)).map((s) => ({ name: `${inp.name}/${s.path}`, why: s.why })));
          const ignored = z.skipped.filter((s) => /no importable/.test(s.why)).length;
          if (ignored) report.skipped.push({ name: inp.name, why: `${ignored} archivo(s) que no son .syx ignorados` });
          for (const e of z.entries) { const parts = e.path.split('/'); const fname = parts.pop(); await handleSyx(fname, [inp.path, inp.name.replace(/\.zip$/i, ''), ...parts].filter(Boolean).join('/'), e.bytes, inp.name); }
        } else if (/\.(syx|sysex|bin)$/i.test(inp.name)) await handleSyx(inp.name, inp.path, inp.bytes);
        else report.skipped.push({ name: inp.name, why: 'Extensión no admitida' });
      } catch (e) { report.errors.push(`${inp.name}: ${e.message}`); }
    }
    report.groups = groupReport(report);
    // Propuesta de clasificación inicial (no se aplica: queda como «propuesta»).
    this.files.push(...newFiles); this.patches.push(...newPatches);
    await this.store.putMany('files', newFiles);
    await this.store.putMany('patches', [...newPatches, ...touched]);
    if (newPatches.length) await this.log('import', newPatches.map((p) => p.id), null, null, `${newPatches.length} patches importados`);
    this.emit();
    return report;
  }

  // ---------- Metadatos e historial ----------
  async log(op, ids, before, after, text, undoable = false) {
    const h = { id: uid(), at: now(), op, ids, before, after, text, undoable };
    this.history.push(h); await this.store.putMany('history', [h]); return h;
  }
  // changes: objeto parcial de meta; registra estado previo para poder deshacer.
  async updateMeta(ids, changes, text, extra = {}) {
    // v3.10: carpeta, etiquetas, valoración, notas… son del sonido: se escriben en el original y en todas sus variantes.
    // Los valores calculados (funciones) se calculan con el patch indicado y se copian a los demás de su sonido.
    const src = new Map();
    if (Object.keys(changes).some((k) => !VERSION_KEYS.has(k))) { for (const id of ids) for (const m of this.groupIds(id)) if (!src.has(m)) src.set(m, id); ids = [...src.keys()]; }
    const before = {}, after = {}; const list = ids.map((id) => this.byId(id)).filter(Boolean);
    const vals = new Map(); // id del patch indicado → valores calculados una vez
    for (const p of list) {
      before[p.id] = {}; after[p.id] = {};
      const base = (src.has(p.id) && this.byId(src.get(p.id))) || p;
      if (!vals.has(base.id)) vals.set(base.id, Object.fromEntries(Object.keys(changes).map((k) => [k, typeof changes[k] === 'function' ? changes[k](base) : changes[k]])));
      for (const k of Object.keys(changes)) { before[p.id][k] = structuredClone(p.meta[k]); const val = vals.get(base.id)[k]; p.meta[k] = structuredClone(val); after[p.id][k] = structuredClone(val); }
      p.modifiedAt = now();
    }
    await this.store.putMany('patches', list);
    const h = await this.log(extra.op || 'meta', list.map((p) => p.id), before, after, text || 'Metadatos actualizados', true);
    if (extra.predicted) { h.predicted = extra.predicted; h.action = extra.action; h.final = extra.final; await this.store.putMany('history', [h]); }
    this.emit(); return h;
  }
  async undo(historyId) {
    const h = this.history.find((x) => x.id === historyId);
    if (!h || !h.undoable || h.undone) throw new Error('Esta operación no se puede deshacer');
    if (h.op === 'variant') { await this.deletePatches(h.ids, true); }
    else if (h.op === 'delete') { if (!h.before?.patches) throw new Error('La papelera ya se vació'); await this.restoreDeleted(h); }
    else if (h.op === 'versions') {
      const back = h.before.patches.map((p) => structuredClone(p)), ids = new Set(back.map((p) => p.id));
      this.patches = [...this.patches.filter((p) => !ids.has(p.id)), ...back];
      this.banks = structuredClone(h.before.banks); this.collections = structuredClone(h.before.collections);
      await this.store.putMany('patches', back); await this.store.putMany('banks', this.banks); await this.store.putMany('collections', this.collections);
    }
    else if (h.op === 'edit') {
      const p = this.byId(h.ids[0]); if (!p) throw new Error('La variante ya no existe');
      const pl = new Uint8Array(p.payload); for (const [o, v] of Object.entries(h.before.bytes)) pl[+o] = v;
      if (p.diff) { const d = new Map(p.diff.map(([o, x]) => [+o, x])); for (const o of Object.keys(h.before.bytes)) d.set(+o, pl[+o]); p.diff = [...d].sort((a, b) => a[0] - b[0]); }
      p.payload = pl; p.fp = fingerprints(pl); p.modifiedAt = now(); await this.store.putMany('patches', [p]);
    }
    else {
      const list = h.ids.map((id) => this.byId(id)).filter(Boolean);
      for (const p of list) Object.assign(p.meta, structuredClone(h.before[p.id] || {}));
      await this.store.putMany('patches', list);
    }
    h.undone = true; await this.store.putMany('history', [h]);
    await this.log('revert', h.ids, null, null, 'Deshecho: ' + h.text);
    this.emit();
  }

  // ---------- Clasificación: aceptar / corregir / rechazar ----------
  async acceptClassification(ids) {
    const items = ids.map((id) => this.byId(id)).filter(Boolean).map((p) => ({ p, c: this.info(p).cls })).filter((x) => x.c.category);
    const chg = {}; const preds = {};
    for (const { p, c } of items) { chg[p.id] = c; preds[p.id] = { category: c.category, certainty: c.certainty }; }
    if (!items.length) return null;
    return this.updateMeta(items.map((x) => x.p.id), {
      category: (p) => chg[p.id].category, subtype: (p) => chg[p.id].subtype,
      usage: (p) => [...new Set([...(p.meta.usage || []), ...chg[p.id].usage])],
      descriptors: (p) => [...new Set([...(p.meta.descriptors || []), ...chg[p.id].descriptors.filter((d) => d.declared).map((d) => d.label)])],
      classStatus: 'accepted', classAt: now()
    }, `Clasificación aceptada en ${items.length} patch(es)`, { op: 'classify', predicted: preds, action: 'accept' });
  }
  // ---------- Carpetas y subcarpetas (taxonomía editable) ----------
  get tax() { return taxonomy(this.settings.subfolders || {}); }
  subLabel(cat, sub) { return subLabelOf(this.tax, cat, sub); }
  async saveTax(cat, list) { const all = { ...(this.settings.subfolders || {}) }; all[cat] = list; await this.setSetting('subfolders', all); }
  async addSubfolder(cat, label) {
    const name = String(label || '').trim().slice(0, 40); if (!cat || !name) return null;
    const list = this.tax[cat], hit = list.find((x) => x.label.toLowerCase() === name.toLowerCase()); if (hit) return hit.id;
    const base = name.toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'sub';
    let id = 'u-' + base, k = 2; while (list.some((x) => x.id === id)) id = `u-${base}-${k++}`;
    await this.saveTax(cat, [...list, { id, label: name }]); return id;
  }
  async renameSubfolder(cat, id, label) { const name = String(label || '').trim().slice(0, 40); if (!name) return; await this.saveTax(cat, this.tax[cat].map((x) => (x.id === id ? { ...x, label: name } : x))); }
  async moveSubfolder(cat, id, d) { const list = this.tax[cat], i = list.findIndex((x) => x.id === id), j = i + d; if (i < 0 || j < 0 || j >= list.length) return; [list[i], list[j]] = [list[j], list[i]]; await this.saveTax(cat, list); }
  async removeSubfolder(cat, id) {
    const users = this.patches.filter((p) => p.meta.category === cat && p.meta.subtype === id).map((p) => p.id);
    if (users.length) await this.updateMeta(users, { subtype: null }, `Subcarpeta «${this.subLabel(cat, id)}» quitada de ${users.length} patch(es)`);
    await this.saveTax(cat, this.tax[cat].filter((x) => x.id !== id));
    return users.length;
  }
  async resetTax(cat) { const all = { ...(this.settings.subfolders || {}) }; delete all[cat]; await this.setSetting('subfolders', all); }
  // Asigna subcarpeta sin tocar la categoría guardada; si el patch aún no tiene categoría, fija la propuesta (o la indicada).
  async setSubfolder(ids, cat, sub) {

  }

  // ---------- Variantes (nunca modifican el original) ----------

  async createVariant(parentId, payload, op, description, nameSuffix = '', opts = {}) {
    const parent = this.byId(parentId); if (!parent) throw new Error('Patch de origen no encontrado');

    if (nameSuffix) pl.set(encodeName((readName(pl).name + nameSuffix).slice(0, 16)), 0);
    const v = { ...structuredClone({ ...parent, payload: undefined, ops: undefined, diff: undefined, copyOf: undefined }), id: uid(), kind: 'variant', parentId, rootId: parent.rootId || parent.id, fileId: null, payload: pl, fp: fingerprints(pl), name: readName(pl).name || parent.name, importedAt: now(), modifiedAt: now(), variantOp: op, variantNote: description, alsoFoundIn: [] };

    v.origin = op; v.originText = description; v.ops = [description]; v.createdAt = now();

    if (!opts.adopted) { v.diff = []; for (let i = 0; i < 340; i++) if (parent.payload[i] !== pl[i]) v.diff.push([i, pl[i]]); }
    this.patches.push(v); await this.store.putMany('patches', [v]);

  async renameVariant(id, name) {

    const pl = new Uint8Array(p.payload); pl.set(encodeName(name), 0); p.payload = pl; p.fp = fingerprints(pl); p.name = readName(pl).name; p.modifiedAt = now();
    await this.store.putMany('patches', [p]); this.emit();

  async editVariantBytes(id, edits, text = 'Edición de parámetros') {

    p.payload = pl; p.fp = fingerprints(pl); p.modifiedAt = now();
    if (p.diff) { const d = new Map(p.diff.map(([o, x]) => [+o, x])); for (const o of Object.keys(before)) d.set(+o, pl[+o]); p.diff = [...d].sort((a, b) => a[0] - b[0]); }

  // Eliminar = a la papelera: el registro del historial guarda los patches enteros, sus huecos en los packs y sus

    const snap = { patches: gone.map((p) => structuredClone(p)), slots: [], colls: [], orphans: [] };
    for (const b of this.banks) b.slots.forEach((x, i) => { if (set.has(x)) snap.slots.push([b.id, i, x]); });

  // ---------- Exportación organizada a una carpeta del disco (File System Access API) ----------
  async exportToDirectory(dir, list, layout = 'category') {

    const sub = async (h, name) => h.getDirectoryHandle(safe(name), { create: true });
    let n = 0; const used = new Set();
    for (const p of list) {
      const cat = p.meta.category || 'Sin clasificar';
      let h = dir;
      if (layout === 'category') { h = await sub(h, cat); if (p.meta.subtype) h = await sub(h, this.subLabel(p.meta.category, p.meta.subtype) || p.meta.subtype); }
      if (layout === 'folder') for (const part of (p.folderPath || 'Sin carpeta').split('/')) h = await sub(h, part);
      let fname = safe(p.name) + '.syx', k = 2; const keyOf = (f) => (layout + cat + (p.meta.subtype || '') + p.folderPath + f).toLowerCase();
      while (used.has(keyOf(fname))) fname = `${safe(p.name)} (${k++}).syx`;
      used.add(keyOf(fname));
      const fh = await h.getFileHandle(fname, { create: true }), w = await fh.createWritable();
      await w.write(this.exportSyx(p)); await w.close(); n++;
    }
    return n;
  }

  csvReport(ids) {

    warn.length ? { level: 'warn', text: `${warn.length} valor(es) fuera del rango documentado` } : { level: 'ok', text: 'Parámetros dentro del rango documentado' },
    reserved.length ? { level: 'info', text: `${reserved.length} byte(s) reservados distintos de 0` } : { level: 'ok', text: 'Bytes reservados a 0' },
    macroBad.length ? { level: 'warn', text: `${macroBad.length} destino(s) de macro fuera de 0–70` } : { level: 'ok', text: 'Destinos de macro dentro de 0–70' },
    unknown70 ? { level: 'info', text: 'Alguna macro usa el código 70 (significado desconocido)' } : { level: 'ok', text: 'Sin códigos de macro desconocidos' },
    ...(p.repaired?.length ? [{ level: 'info', text: 'Recuperado de un archivo con cabecera no estándar (' + p.repaired.map((r) => r === 'location' ? 'número de patch 0xFF' : 'sin F7 final').join(', ') + '). Los 340 bytes del patch están intactos; al exportar se escribe una cabecera válida.' }] : []),
    inf.an.decoded.nameNonPrintable ? { level: 'info', text: 'Nombre con caracteres no imprimibles' } : { level: 'ok', text: 'Nombre ASCII legible' },

// Datos de la franja de análisis de la biblioteca.
function libraryAnalysis(lib, profileId = 'techno', k = 8) {
  const ps = lib.faces ? lib.faces() : lib.patches, N = ps.length;
  const fam = lib.families(); let dup = 0;
  const dupIdsTmp = []; for (const f of fam.list) for (const m of f.members) if (m.rel && (m.rel.level === 'payload' || m.rel.level === 'synth')) { dup++; dupIdsTmp.push(m.id); }

  const briBins = new Array(10).fill(0), envIds = [[], [], [], [], []], briIds = Array.from({ length: 10 }, () => []); let mono = 0, consistent = 0, measuredBri = 0;
  for (const p of ps) {
    const len = approxSeconds(p.payload[73]) + (p.payload[72] < 30 ? approxSeconds(p.payload[71]) : 0);
    const eb = envEdges.findIndex((e) => len < e) === -1 ? 4 : envEdges.findIndex((e) => len < e); envBins[eb]++; envIds[eb].push(p.id);
    let b = brightnessEstimate(p.payload);

    if (p.payload[32] <= 1) mono++;
    if (profileFit(p.payload, profileId).filter((f) => f.status === 'match' || f.status === 'group').length >= 6) consistent++;
  }
  let clusters = [];
  if (N >= 3) {
    const { assign } = kmeans(ps.map((p) => vectorize(p.payload)), Math.min(k, Math.max(2, Math.round(Math.sqrt(N / 2)))));
    const groups = new Map(); assign.forEach((c, i) => { if (!groups.has(c)) groups.set(c, []); groups.get(c).push(ps[i]); });

      return { id: c, ids: members.map((p) => p.id), size: members.length, label: top[0] === 'none' ? 'Sin categoría' : CAT_LABEL[top[0]], purity: top[1] / members.length };
    }).sort((a, b) => b.size - a.size);
  }
  return { dupIds: dupIdsTmp, envIds, briIds, N, dup, dupPct: N ? dup / N : 0, tracks, legacy: N - tracks, envBins, envLabels: ['<0,1 s', '0,1–0,3', '0,3–1', '1–3', '>3 s'], briBins, measuredBri, mono, poly: N - mono, consistent, consistentPct: N ? consistent / N : 0, clusters };
}

// ---- core/packbuilder.js ----
// Constructor automático de Packs de 128 patches.
// Circuit Tracks muestra los patches en Patch View como 4 páginas de 32 (rejilla 8×4):
// cada página se dedica a un grupo de categorías para encontrar los sonidos tocando.
const DEFAULT_LAYOUT = [
  { label: 'Bajos', cats: ['bass'] },
  { label: 'Leads · plucks · arps', cats: ['lead', 'pluck', 'arp', 'sequence', 'stab'] },
  { label: 'Pads · keys · acordes', cats: ['pad', 'keys', 'chords', 'strings', 'brass', 'bell'] },
  { label: 'FX · drones · perc', cats: ['fx', 'drone', 'transition', 'perc'] }

const RANK = { manual: 5, corroborated: 4, textual: 3, technical: 2, ambiguous: 0, none: 0 };

// candidates: patches; lib: Library. opts: { layout, allowProposals, minCertainty, excludeDiscarded, onePerFamily, fillGaps }
function buildPack(candidates, lib, opts = {}) {
  const o = { layout: DEFAULT_LAYOUT, allowProposals: true, minCertainty: 'textual', excludeDiscarded: true, onePerFamily: true, fillGaps: false, ...opts };
  const excluded = { discarded: 0, family: 0, uncategorized: 0, lowCertainty: 0, overflow: 0 };
  const score = (p) => (p.meta.fav ? 100 : 0) + (p.meta.rating || 0) * 10 + (['listened', 'keep'].includes(p.meta.review) ? 6 : 0) + (p.acoustic ? 2 : 0) + (p.kind === 'variant' ? 1 : 0);
  // 1) Filtrado y un representante por familia (el mejor valorado).
  let list = candidates.filter((p) => {
    if (o.excludeDiscarded && p.meta.review === 'discard') { excluded.discarded++; return false; }
    const st = lib.changeState ? lib.changeState(p) : 'original';
    if (st === 'superseded' || st === 'draft') { excluded.changes = (excluded.changes || 0) + 1; return false; } // va la variante aceptada, no el original ni los borradores
    return true;
  });
  if (o.onePerFamily) {
    const { of } = lib.families(), best = new Map();
    for (const p of list) { const f = of.get(p.id); const key = f ? f.id : p.id; const cur = best.get(key); if (!cur || score(p) > score(cur)) best.set(key, p); }
    excluded.family = list.length - best.size; list = [...best.values()];
  }
  // 2) Categoría efectiva.
  const withCat = [];
  for (const p of list) {
    let cat = p.meta.category, sub = p.meta.subtype, cert = 'manual';
    if (!cat && o.allowProposals) { const c = lib.info(p).cls; if (c.category && RANK[c.certainty] >= RANK[o.minCertainty]) { cat = c.category; sub = c.subtype; cert = c.certainty; } else if (c.category) excluded.lowCertainty++; }
    if (!cat) { excluded.uncategorized++; continue; }
    withCat.push({ p, cat, sub, cert, s: score(p) });
  }

  const slots = new Array(128).fill(null), pages = [], blocks = [], used = new Set();
  o.layout.forEach((pg, i) => {
    const pool = withCat.filter((x) => pg.cats.includes(x.cat) && !used.has(x.p.id)).sort((a, b) => pg.cats.indexOf(a.cat) - pg.cats.indexOf(b.cat) || String(a.sub || '').localeCompare(String(b.sub || '')) || b.s - a.s || RANK[b.cert] - RANK[a.cert] || a.p.name.localeCompare(b.p.name));
    const take = pool.slice(0, 32);
    take.forEach((x, j) => { slots[i * 32 + j] = x.p.id; used.add(x.p.id); });
    excluded.overflow += pool.length - take.length;
    pages.push({ label: pg.label, placed: take.length, available: pool.length, fromProposals: take.filter((x) => x.cert !== 'manual').length });
    blocks.push({ from: i * 32, to: i * 32 + 31, label: pg.label, category: pg.cats[0], cats: [...pg.cats] });
  });
  // 4) Relleno opcional de huecos con lo que sobró (de cualquier categoría).
  if (o.fillGaps) { const rest = withCat.filter((x) => !used.has(x.p.id)).sort((a, b) => b.s - a.s); for (let i = 0; i < 128 && rest.length; i++) if (!slots[i]) { const x = rest.shift(); slots[i] = x.p.id; used.add(x.p.id); excluded.overflow--; } }
  return { slots, blocks, pages, excluded, placed: used.size };
}

    env1: { on: true, title: 'Env 1 · amp', line: `A ${fmtSeconds(approxSeconds(v['env1.a']))} · S ${pct(v['env1.s'])}` },
    env2: { on: Math.abs(v['filter.env2'] - 64) > 0 || d.matrix.some((m) => m.active && (m.s1 === 11 || m.s2 === 11)), title: 'Env 2 · filtro', line: `A ${fmtSeconds(approxSeconds(v['env2.a']))} · D ${fmtSeconds(approxSeconds(v['env2.d']))}` },
    env3: { on: d.matrix.some((m) => m.active && (m.s1 === 12 || m.s2 === 12)), title: 'Env 3', line: `D ${fmtSeconds(approxSeconds(v['env3.d']))}` },
    lfo1: { on: d.matrix.some((m) => m.active && [6, 7].includes(m.s1) || m.active && [6, 7].includes(m.s2)), title: 'LFO 1', line: `${LFO_WAVES[v['lfo1.wave']]} · ${v['lfo1.ratesync'] ? 'sync ' + v['lfo1.ratesync'] : 'rate ' + v['lfo1.rate']}` },
    lfo2: { on: d.matrix.some((m) => m.active && [8, 9].includes(m.s1) || m.active && [8, 9].includes(m.s2)), title: 'LFO 2', line: `${LFO_WAVES[v['lfo2.wave']]} · ${v['lfo2.ratesync'] ? 'sync ' + v['lfo2.ratesync'] : 'rate ' + v['lfo2.rate']}` }

function recipe(payload, d) {

  if (v['voice.portamento']) voice += `, portamento ${v['voice.portamento']}`;
  if (v['voice.preglide'] !== 64) voice += `, pre-glide ${sgn(v['voice.preglide'] - 64)} st`;
  if (oct) voice += `, octava de teclado ${sgn(oct)}`;

    if (v[b + '.vsync']) parts.push(`vsync ${v[b + '.vsync']}`);
    if (v[b + '.wave'] >= 12 && v[b + '.pw'] !== 64) parts.push(`índice ${sgn(v[b + '.pw'] - 64)}`);

  };

  if (v['mix.ring']) oscs.push(`ring mod 1×2 al ${pct(v['mix.ring'])}`);
  out.push({ k: 'Fuentes', t: (oscs.join('; ') || 'Sin fuentes audibles (niveles a 0)') + '.' });

  if (v['filter.drive']) f += `, drive ${DRIVE_TYPES[v['filter.drivetype']].toLowerCase()} ${v['filter.drive']}`;
  if (env2) f += `. La envolvente 2 ${env2 > 0 ? 'lo abre' : 'lo cierra'} ${sgn(env2)} (ataque ${fmtSeconds(approxSeconds(v['env2.a']))}, decay ${fmtSeconds(approxSeconds(v['env2.d']))}, sustain ${pct(v['env2.s'])})`;
  if (v['filter.routing'] === 1) f += '. OSC 1 no pasa por el filtro';
  if (v['filter.routing'] === 2) f += '. Los osciladores no pasan por el filtro (solo el ruido)';
  if (v['filter.track'] < 127) f += `. Seguimiento de teclado ${v['filter.track']}`;

  out.push({ k: 'Amplitud', t: `Envolvente ${shape}: ataque ${fmtSeconds(approxSeconds(A))}, decay ${fmtSeconds(approxSeconds(D))}, sustain ${pct(S)}, release ${fmtSeconds(approxSeconds(R))}${v['env1.vel'] !== 64 ? `, velocidad ${sgn(v['env1.vel'] - 64)}` : ''}. Tiempos aproximados.` });

    let src = MOD_SOURCES[m.s1] ?? '?';

    if (lfoN) { const w = LFO_WAVES[v[`lfo${lfoN}.wave`]].toLowerCase(), sy = v[`lfo${lfoN}.ratesync`]; src += ` (${w}, ${sy ? 'sincronizado ' + sy : 'rate ' + v[`lfo${lfoN}.rate`]}${decodeLfoFlags(payload[lfoN === 1 ? 91 : 99]).keySync ? ', key sync' : ''})`; }
    return `${src}${m.s2 ? ' × ' + (MOD_SOURCES[m.s2] ?? '?') : ''} → ${MOD_DESTS[m.dest] ?? '?'} ${sgn(m.depth - 64)}`;
  });
  out.push({ k: 'Modulación', t: mods.length ? mods.join('; ') + '.' : 'Sin rutas activas en la matriz: el timbre solo se mueve con las envolventes y las macros.' });
  // Efectos
  const fx = [];
  if (v['fx.dist']) fx.push(`distorsión ${DRIVE_TYPES[v['fx.disttype']].toLowerCase()} ${v['fx.dist']}`);
  if (v['fx.chorus']) fx.push(`${v['fx.chorustype'] ? 'chorus' : 'phaser'} ${v['fx.chorus']} (rate ${v['fx.chorusrate']}, feedback ${sgn(v['fx.chorusfb'] - 64)})`);
  const eq = [[106, 'graves'], [108, 'medios'], [110, 'agudos']].filter(([o]) => payload[o] !== 64).map(([o, n]) => `${n} ${sgn(payload[o] - 64)}`);
  if (eq.length) fx.push('EQ ' + eq.join(', '));
  out.push({ k: 'Efectos', t: fx.length ? fx.join('; ') + '.' : 'Sin efectos de patch activos.' });
  // Macros

  out.push({ k: 'Macros', t: mac.length ? mac.join(' · ') + '.' : 'Ninguna macro tiene efecto.' });
  return out;
}

// ---- core/organize.js ----
// Orden de la colección: «mismo synth con otros ajustes», registro/octava y plan de carpetas para el disco.




// ---------- Arquitectura ----------
// Lo que define «qué synth es» y no «cómo está ajustado»: modo de voz, formas de onda y fuentes audibles,
// tipo y ruta de filtro, presencia de drive/distorsión/chorus, topología de la matriz (fuentes → destinos)

  const d = decodePatch(payload), v = d.v, on = (x) => (x > 0 ? 1 : 0);

    on(v['mix.osc1']) ? 'o1:' + v['osc1.wave'] : 'o1:-', on(v['mix.osc2']) ? 'o2:' + v['osc2.wave'] : 'o2:-',
    'n' + on(v['mix.noise']), 'r' + on(v['mix.ring']), 'f' + v['filter.type'] + '/' + v['filter.routing'],
    'dr' + on(v['filter.drive']), 'di' + on(v['fx.dist']), 'ch' + (v['fx.chorus'] ? v['fx.chorustype'] : '-'),
    'mx' + d.matrix.filter((m) => m.active).map((m) => `${m.s1}.${m.s2}>${m.dest}`).sort().join(','),
    'mc' + d.macros.map((k) => k.slots.filter((s) => s.state === 'active').map((s) => s.dest).sort((a, b) => a - b).join('.')).join('|')

function describeArchitecture(payload) {

// Grupos de la misma arquitectura con ajustes distintos. Devuelve qué parámetros varían y en qué rango.
// Precisión del agrupado «mismo synth». Con colecciones reales, las macros (mapeos de directo) separan
// patches que suenan a la misma receta; por defecto se ignoran.
const ARCH_LEVELS = [
  { id: 'strict', n: 11, label: 'Estricta: motor, efectos, matriz y macros' },
  { id: 'engine-fx', n: 10, label: 'Motor, efectos y matriz (ignora macros)' },
  { id: 'engine', n: 9, label: 'Motor y efectos (ignora matriz y macros)' },
  { id: 'base', n: 6, label: 'Misma base: voz, osciladores y filtro' }

function architectureGroups(patches, level = 'engine-fx') {

  for (const p of patches) { const a = n === 11 ? architecture(p.payload).key : level + ':' + architecture(p.payload).parts.slice(0, n).join(';'); (by.get(a) || by.set(a, []).get(a)).push(p); }

// Variación de un patrón: mismo carácter, algunos cambios. Para rellenar los 8 patrones de una pista.

// ---- core/song.js ----
// Canciones completas para el Circuit Tracks.
// Cada pista recibe 8 patrones con un papel fijo, como en la herramienta de la Rhythm. v3.4: más repetición, como en
// la pista: 1 intro/break · 2 A · 3 A (igual) · 4 A' (A con un remate sutil en el último tiempo de la batería; synths
// iguales) · 5 fill · 6 B · 7 build · 8 silencio. El groove encadena A A A' fill (2–5); con pista reloj, las escenas
// del medio de una sección tocan solo A (2–3) y el remate y el fill quedan para la última. Una estrategia de arreglo encadena secciones; cada sección es una escena del Circuit
// con la cadena de patrones de cada pista. Sale como escucha en el equipo, grabación guiada por patrones,
// .mid de la canción (una pista por pista del Circuit) y hoja de ruta para montar las escenas.

// Orden del Circuit Tracks (Patterns View y Mixer): Synth 1, Synth 2, MIDI 1, MIDI 2, Drum 1–4
const SONG_TRACKS = [
  { id: 'synth1', label: 'Synth 1', role: 'Bajo', kind: 'synth', dest: 'synth1' },
  { id: 'synth2', label: 'Synth 2', role: 'Lead / stabs', kind: 'synth', dest: 'synth2' },
  { id: 'midi1', label: 'MIDI 1', role: 'Pad / acordes', kind: 'synth', dest: 'midi1' },
  { id: 'midi2', label: 'MIDI 2', role: 'Drone / FX', kind: 'synth', dest: 'midi2' },
  { id: 'drum1', label: 'Drum 1', role: 'Bombo', kind: 'drum', lane: 0 },
  { id: 'drum2', label: 'Drum 2', role: 'Caja / palmas', kind: 'drum', lane: 1 },
  { id: 'drum3', label: 'Drum 3', role: 'Charles', kind: 'drum', lane: 2 },
  { id: 'drum4', label: 'Drum 4', role: 'Percusión', kind: 'drum', lane: 3 },
];
const SLOT_ROLES = ['Intro / break', 'Groove A', 'Groove A (copia)', "Groove A'", 'Fill', 'Groove B', 'Build', 'Silencio'];
// cadenas que puede tocar una pista en una escena (patrones 1–8 del Circuit = índices 0–7)
// groove = A A A' fill · groove2 = A A · fillbuild = A' fill · intro y break comparten el patrón 1
const SONG_RANGES = { light: [0, 0], groove: [1, 4], groove2: [1, 2], alt: [5, 5], fillbuild: [3, 4], build: [6, 6], break: [0, 0], off: [7, 7] };
const MID_RANGE = [1, 2]; // escenas del medio de una sección: solo A
const SG_MIX = { '-': 'off', l: 'light', g: 'groove', h: 'groove2', a: 'alt', f: 'fillbuild', b: 'build', k: 'break' };

// Estilo de cada synth según el estilo de batería (se puede cambiar)
const SONG_SYNTH_STYLES = {
  techno: ['offbeat', 'stab', 'pad', 'drone'], rumble: ['rolling', 'stab', 'pad', 'drone'], house: ['offbeat', 'chords', 'pad', 'drone'],
  minimal: ['offbeat', 'perc', 'pad', 'drone'], breakbeat: ['acid', 'lead', 'chords', 'drone'], electro: ['acid', 'arp', 'pad', 'drone'],
  industrial: ['rolling', 'stab', 'drone', 'drone'], halftime: ['sub', 'pad', 'pad', 'drone'], euclid: ['perc', 'arp', 'pad', 'drone'],

// ---------- utilidades ----------
const sgNotes = (pat) => (pat?.notes || []).map((e) => ({ ...e }));
const sgPat = (base, notes, extra = {}) => ({ ...base, notes: notes.sort((a, b) => a.t - b.t || a.n - b.n), cc: [], ...extra });
function sgDeg(root, scale, oct) {
  const iv = (SCALES[scale] || SCALES.minor).iv, L = iv.length;
  return (d) => oct + root + iv[((d % L) + L) % L] + 12 * Math.floor(d / L);
}
const sgVel = (v) => Math.max(1, Math.min(127, Math.round(v)));

// ---------- synths: los 8 papeles ----------
function synthSlots(t, o, R) {
  const N = o.steps, style = o.styles[t];
  const base = { v: 1, kind: undefined, root: o.root, scale: o.scale, steps: N, tempo: o.tempo, swing: 0, style };
  const gen = (st, seed, extra = {}) => generatePattern({ style: st, root: o.root, scale: o.scale, steps: N, tempo: o.tempo, seed, density: o.density === 0.5 ? null : o.density, ...extra });

  const altStyle = style === 'offbeat' ? 'rolling' : style === 'rolling' ? 'offbeat' : style === 'stab' ? 'chords' : style;
  const alt = gen(t === 0 ? altStyle : style, o.seed * 13 + t + 101);

  const sustained = ['pad', 'drone', 'chords', 'sub'].includes(style);
  const light = sgPat(base, sustained ? sgNotes(main).map((e) => ({ ...e, v: sgVel(e.v - 20) })) : sgNotes(main).filter((e, i) => i % 2 === 0 || e.t % 8 === 0).map((e) => ({ ...e, v: sgVel(e.v - 15), slide: false })));
  // fill: corta el final y mete un remate que sube
  const fillN = sgNotes(main).filter((e) => e.t < N - 4).map((e) => ({ ...e, d: Math.min(e.d, N - 4 - e.t) }));
  if (t === 0) { fillN.push({ t: N - 3, n: deg(7), d: 0.5, v: 118 }); fillN.push({ t: N - 1, n: deg(0) + 12, d: 0.5, v: 110 }); }
  else if (!sustained) [0, 1, 2, 3].forEach((k) => fillN.push({ t: N - 4 + k, n: deg(k * 2), d: 0.6, v: 90 + k * 10 }));
  else fillN.push({ t: N - 4, n: deg(4), d: 4, v: 96 });

  if (t === 0) for (let i = 0; i < N; i += i < N / 2 ? 2 : 1) bN.push({ t: i, n: deg(0) + (i >= (3 * N) / 4 && R() < 0.5 ? 12 : 0), d: 0.5, v: sgVel(ramp(i)) });

// ---------- batería: los 8 papeles, un patrón por pista Drum ----------
function drumSlots(o, R) {
  const N = o.steps;
  const g = (seed, d = o.density) => generateDrums({ style: o.style, seed, steps: N, density: d, fill: false, humanize: 0.12 });
  const main = g(o.seed), alt0 = g(o.seed + 101, Math.min(1, o.density + 0.15));
  const lane = (p, l) => p.notes.filter((e) => e.lane === l).map((e) => ({ ...e }));
  const H = (l, t, v) => ({ t, lane: l, n: DRUM_NOTES[l], d: 0.5, v: sgVel(v) });

  for (let l = 0; l < 4; l++) {
    const m = lane(main, l);
    const light = l === 0 ? m.filter((e) => e.t % 4 === 0) : l === 2 ? (m.filter((e) => e.t % 4 === 2).map((e) => ({ ...e, v: Math.min(e.v, 85) })).length ? m.filter((e) => e.t % 4 === 2).map((e) => ({ ...e, v: Math.min(e.v, 85) })) : Array.from({ length: N / 4 }, (_, k) => H(2, k * 4 + 2, 80))) : l === 3 ? m.filter((e) => e.t % 8 === 6) : [];
    const alt = l === 0 ? m.map((e) => ({ ...e })) : lane(alt0, l);
    let fill = m.filter((e) => e.t < N - 4);
    if (l === 0) fill = m.filter((e) => e.t < N - 2);
    if (l === 1) for (let i = N - 4; i < N; i++) fill.push(H(1, i, 55 + (i - N + 4) * 20));
    if (l === 2) for (let i = N - 4; i < N; i++) fill.push(H(2, i, 70 + (i - N + 4) * 12));
    if (l === 3) { fill = m.filter((e) => e.t < N - 3); fill.push(H(3, N - 3, 95), H(3, N - 1, 110)); }
    const ramp = (i) => 35 + (92 * i) / (N - 1), build = [];
    if (l === 0) for (let i = 0; i < N - 4; i += 4) build.push(H(0, i, 118));
    if (l === 1) for (let i = 0; i < N; i++) if (i < N / 2 ? i % 2 === 0 : true) build.push(H(1, i, ramp(i)));
    if (l === 2) for (let i = 0; i < N; i++) build.push(H(2, i, 50 + (70 * i) / (N - 1)));
    if (l === 3) for (let i = 2; i < N - 2; i += 4) build.push(H(3, i, 80 + (i / N) * 30));
    // A': A con un remate sutil en el último tiempo (charles, percusión, golpe fantasma de caja); el bombo no cambia
    const has = (x) => m.some((e) => Math.round(e.t) === x);
    const turn = m.map((e) => ({ ...e }));
    if (l === 1 && !has(N - 1)) turn.push(H(1, N - 1, 48));
    if (l === 2) { if (!has(N - 3)) turn.push(H(2, N - 3, 68)); if (!has(N - 1)) turn.push(H(2, N - 1, 76)); }
    if (l === 3) { for (let i = turn.length - 1; i >= 0; i--) if (Math.round(turn[i].t) === N - 4) turn.splice(i, 1); if (!has(N - 2)) turn.push(H(3, N - 2, 86)); }

  }
  return out;
}

// opts: { style, seed, steps (16|32), density, root (0–11), scale, tempo, styles[4], locked:Set, prev }
function songFamily(opts = {}) {
  const o = { style: 'techno', seed: 1, steps: 16, density: 0.5, root: 9, scale: 'minor', tempo: 128, locked: null, prev: null, ...opts };
  o.styles = opts.styles || SONG_SYNTH_STYLES[o.style] || SONG_SYNTH_STYLES.techno;
  const R = rng(o.seed * 97 + 13);
  const drums = drumSlots(o, R), tracks = [];
  for (let t = 0; t < 8; t++) {
    if (o.locked?.has(t) && o.prev?.[t]) { tracks.push(o.prev[t]); continue; }
    tracks.push(t < 4 ? synthSlots(t, o, R) : drums[t - 4]);
  }
  return { steps: o.steps, root: o.root, scale: o.scale, style: o.style, styles: o.styles, seed: o.seed, tempo: o.tempo, tracks };

// ---------- estrategias de arreglo (las mismas que en la herramienta de la Rhythm) ----------

// ---------- Plan de escenas: lo que el Circuit tocará de verdad ----------
// En el Circuit Tracks una escena dura lo que su cadena de patrones más larga y, dentro de una cadena de escenas, cada
// escena suena UNA vez (las pistas con cadenas más cortas dan vueltas dentro de ella). Las cadenas son de patrones
// consecutivos. Por eso:
//  · una sección larga se toca con varias escenas iguales seguidas (copias), como mucho 16 escenas en total;
//  · la duración de cada escena la fija una pista libre (MIDI 2 o MIDI 1 sin sinte) encadenando patrones vacíos de
//    16 pasos (los del proyecto vacío): la «pista reloj». Así una escena puede durar 1–8 compases aunque la batería

function scenePlan(sections, { steps = 16, off = new Set(), maxScenes = MAX_SCENES } = {}) {
  const pb = steps / 16, timer = off.has(3) ? 3 : off.has(2) ? 2 : null;
  const secs = sections.map((s0, i) => {

    let L = realMax;

      for (let k = Math.min(8, s0.bars); k >= realMax; k--) if (s0.bars % k === 0) { L = k; break; }
    }
    const copies = Math.max(1, Math.round(s0.bars / L));
    if (timer != null) tracks[timer] = { key: 'timer', from: 0, to: L - 1, bars: L };

    const mid = tracks.map((x) => (x.key === 'groove' ? { ...x, from: MID_RANGE[0], to: MID_RANGE[1], bars: 2 * pb, mid: true } : x));
    const midMax = Math.max(pb, ...mid.filter((x) => x.key !== 'off' && x.key !== 'timer').map((x) => x.bars));
    const midOK = mid.some((x) => x.mid) && (timer != null ? midMax <= L : midMax === L);

    }

}

// Notas de toda la canción tal como las tocará el Circuit: escena a escena, cada pista da vueltas a su cadena desde el
// principio de la escena. [{ t, n, d, v, track }]
function songNotes(fam, tl, { onlyTrack = null, fromBar = 0 } = {}) {
  const ev = [], N = fam.steps;

    const total = sc.bars * 16;
    sc.tracks.forEach((tr, t) => {
      if ((onlyTrack != null && t !== onlyTrack) || tr.key === 'off' || tr.key === 'timer') return;
      const chain = []; for (let k = tr.from; k <= tr.to; k++) chain.push(fam.tracks[t][k]);
      const len = chain.length * N;

// Eventos de un patrón (1–8) de todas las pistas activas, para grabarlo en el Circuit de una pasada

// ---- core/mapsel.js ----
// core/mapsel.js — v3.5: seleccionar en el mapa (los más parecidos y por zona), como en la herramienta de la Rhythm.
// El parecido se mide en los parámetros de síntesis normalizados (media 0, desviación 1 por parámetro), así ningún
// parámetro pesa más solo por su escala.

// entries: [[id, vector]] → Map id → vector normalizado
function zScoreMap(entries) {
  const out = new Map(); if (!entries.length) return out;
  const d = entries[0][1].length, n = entries.length, mean = new Float64Array(d), sd = new Float64Array(d);
  for (const [, v] of entries) for (let i = 0; i < d; i++) mean[i] += v[i] / n;
  for (const [, v] of entries) for (let i = 0; i < d; i++) sd[i] += (v[i] - mean[i]) ** 2 / n;
  for (let i = 0; i < d; i++) sd[i] = Math.sqrt(sd[i]) || 1;
  for (const [id, v] of entries) { const z = new Float64Array(d); for (let i = 0; i < d; i++) z[i] = (v[i] - mean[i]) / sd[i]; out.set(id, z); }

}

function nearestByZ(zmap, refIds, n = 25, skip = null) {
  const refs = [...refIds].map((id) => zmap.get(id)).filter(Boolean);
  if (!refs.length) return [];
  const out = [];
  for (const [id, v] of zmap) {
    if (refIds.has(id) || (skip && skip(id))) continue;
    let best = Infinity;
    for (const r of refs) { let s = 0; for (let i = 0; i < v.length; i++) s += (v[i] - r[i]) ** 2; if (s < best) best = s; }
    out.push({ id, d: Math.sqrt(best) });

function rectIds(points, x0, y0, x1, y1) {

  return points.filter((p) => p.X >= a && p.X <= b && p.Y >= c && p.Y <= d).map((p) => p.id);

// ---- core/lab.js ----
// core/lab.js — v3.8: laboratorio de sonido. Patches nuevos a partir de los que ya tienes:
//  · mutar:   variaciones de un patch, con la intensidad y las partes que elijas
//  · cruzar:  hijos de dos (o más) patches, bloque a bloque (osciladores, filtro, envolventes, LFO, efectos, matriz)
//  · mezclar: un punto intermedio entre A y B (los valores continuos se interpolan; los de tipo cambian a mitad)
// Nunca se tocan el nombre, la categoría ni los bytes reservados. Las macros son siempre las del patch de partida,
// para que los knobs sigan haciendo lo mismo. Los resultados pasan por un saneado que evita patches mudos.

const LAB_GROUPS = { osc: ['osc1', 'osc2', 'mixer'], filter: ['filter'], env: ['env1', 'env2', 'env3'], mod: ['lfo1', 'lfo2'], fx: ['fx', 'eq'] };

const LAB_AMOUNTS = { subtle: { sd: 0.06, flip: 0 }, medium: { sd: 0.14, flip: 0.1 }, wild: { sd: 0.3, flip: 0.35 } };
const LAB_BLOCKS = ['osc1', 'osc2', 'mixer', 'filter', 'env1', 'env2', 'env3', 'lfo1', 'lfo2', 'fx', 'eq', 'matrix'];

// Se conservan siempre: la afinación (semitonos, bend), la voz y los bits de las LFO
const KEEP = new Set(['osc1.semi', 'osc2.semi', 'osc1.bend', 'osc2.bend', 'lfo1.flags', 'lfo2.flags']);
const SYNC = new Set(['lfo1.delaysync', 'lfo1.ratesync', 'lfo2.delaysync', 'lfo2.ratesync', 'fx.chorussync']);

const clampP = (p, v) => Math.max(p.min, Math.min(p.max, Math.round(v)));

function labRng(seed) {
  let s = (seed >>> 0) || 1;

const groupsFor = (ids) => new Set(ids.flatMap((g) => LAB_GROUPS[g] || []));

// Que el resultado suene: algún oscilador audible, una envolvente de amplitud que deje oír la frase y un filtro
// paso bajo que no quede cerrado del todo. Lo que estaba así en el patch de partida se respeta.
function labSanitize(out, ref) {
  const lv = (b) => Math.max(b[54], b[55], b[56], b[57]);
  if (lv(out) < 40 && lv(ref) >= 40) { for (const o of [54, 55, 56, 57]) out[o] = Math.max(out[o], ref[o]); }
  if (out[70] > 110 && ref[70] <= 110) out[70] = Math.max(ref[70], 100);                  // ataque de amplitud eterno
  if (out[71] < 12 && out[72] < 12 && !(ref[71] < 12 && ref[72] < 12)) out[71] = Math.max(ref[71], 30); // un clic sin cuerpo
  const lp = out[63] <= 1, closed = out[64] < 18 && out[68] <= 66;
  if (lp && closed && !(ref[63] <= 1 && ref[64] < 18 && ref[68] <= 66)) out[64] = Math.max(18, ref[64]);
  for (const p of PARAMS) out[p.off] = clampP(p, out[p.off]);
  return out;
}

// Variación de un patch
function labMutate(payload, { amount = 'medium', groups = ['filter', 'env', 'mod', 'fx'], seed = 1 } = {}) {
  const A = LAB_AMOUNTS[amount] || LAB_AMOUNTS.medium, r = labRng(seed), gs = groupsFor(groups), out = new Uint8Array(payload);
  for (const p of PARAMS) {
    if (!gs.has(p.group) || KEEP.has(p.key)) continue;
    if (discrete(p)) { if (A.flip && r() < A.flip) out[p.off] = p.min + Math.floor(r() * (p.max - p.min + 1)); continue; }
    const span = p.key.endsWith('.cents') ? 24 : p.max - p.min;   // los cents, poco: desafinar no es variar
    out[p.off] = clampP(p, payload[p.off] + gauss(r) * A.sd * span);

}

// Hijo de varios padres, bloque a bloque. El primero es el patch de partida (nombre, categoría, voz y macros).
// Devuelve { payload, from: {bloque: índice del padre} }.
function labCross(parents, { seed = 1, mutate = 'subtle' } = {}) {
  const r = labRng(seed), base = parents[0], out = new Uint8Array(base), from = {};
  for (const bl of LAB_BLOCKS) from[bl] = Math.floor(r() * parents.length);
  // con dos padres, que haya algo de cada uno
  const used = new Set(Object.values(from));
  if (parents.length > 1 && used.size === 1) { const bl = LAB_BLOCKS[Math.floor(r() * LAB_BLOCKS.length)]; from[bl] = (from[bl] + 1) % parents.length; }
  for (const p of PARAMS) { if (from[p.group] != null) out[p.off] = parents[from[p.group]][p.off]; }
  out.set(parents[from.matrix].subarray(MATRIX[0], MATRIX[1]), MATRIX[0]);
  const child = mutate ? labMutate(out, { amount: mutate, groups: LAB_GROUP_IDS.filter((g) => g !== 'osc'), seed: seed * 7 + 3 }) : labSanitize(out, base);

// Punto intermedio entre A (t = 0) y B (t = 1)
function labMorph(a, b, t) {
  const out = new Uint8Array(a), k = Math.max(0, Math.min(1, t));

  for (let o = MATRIX[0]; o < MATRIX[1]; o += 4) {
    const same = a[o] === b[o] && a[o + 1] === b[o + 1] && a[o + 3] === b[o + 3];
    if (same) out[o + 2] = Math.round(a[o + 2] + (b[o + 2] - a[o + 2]) * k);
    else if (k >= 0.5) out.set(b.subarray(o, o + 4), o);

function labChanges(a, b, n = 3) {
  const out = [];
  for (const p of PARAMS) {
    const d = b[p.off] - a[p.off]; if (!d) continue;
    out.push({ key: p.key, label: p.label, group: p.group, d, rel: discrete(p) ? 0.5 : Math.abs(d) / Math.max(1, p.max - p.min), discrete: discrete(p), to: b[p.off], p });

function labCloseness(a, b) {

}

function drawMap() {
  const cv = $('#mapCanvas'); if (!cv) return;
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1; cv.width = r.width * dpr; cv.height = r.height * dpr;
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  const xy = lib.map(), pts = [];
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const [, [x, y]] of xy) { minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y); }
  // Escala común en ambos ejes: no se exagera la componente con menos varianza.
  const pad = 18, W = r.width - 2 * pad, H = r.height - 2 * pad, k = Math.min(W / (maxX - minX || 1), H / (maxY - minY || 1));
  const ox = pad + (W - (maxX - minX) * k) / 2, oy = pad + (H - (maxY - minY) * k) / 2, sx = (x) => ox + (x - minX) * k, sy = (y) => oy + (y - minY) * k;
  g.strokeStyle = '#34373b'; g.lineWidth = 1; for (let i = 1; i < 4; i++) { g.beginPath(); g.moveTo(pad + W * i / 4, pad); g.lineTo(pad + W * i / 4, pad + H); g.moveTo(pad, pad + H * i / 4); g.lineTo(pad + W, pad + H * i / 4); g.stroke(); }
  const colorOf = (p) => {
    if (S.mapColor === 'category') return MAP_COLORS[effCat(p) || 'none'] || '#888';
    if (S.mapColor === 'certainty') { const c = p.meta.category ? 'manual' : lib.info(p).cls.certainty; return { manual: '#4fd18b', corroborated: '#a7c9a0', textual: '#b9b8b3', technical: '#8a8c8f', ambiguous: '#ffb340', none: '#4a4e54' }[c]; }
    if (S.mapColor === 'review') return { pending: '#5c5f64', reviewed: '#b9b8b3', listened: '#4fd18b', keep: '#a7c9a0', discard: '#ff5a5a' }[p.meta.review] || '#888';
    return p.acoustic ? '#4fd18b' : '#4a4e54';
  };
  const hl = mapHLSet();
  for (const p of lib.faces()) {
    const c = xy.get(p.id); if (!c) continue;
    if (S.mapColor === 'category' && S.mapHidden.has(effCat(p) || 'none')) continue;
    const X = sx(c[0]), Y = sy(c[1]); pts.push({ id: p.id, X, Y });
    const on = !hl || hl.has(p.id);
    g.beginPath(); g.arc(X, Y, (p.meta.fav ? 4.5 : 3.2) * (hl && on ? 1.25 : 1), 0, Math.PI * 2); g.fillStyle = colorOf(p); g.globalAlpha = hl ? (on ? 0.95 : 0.12) : 0.85; g.fill(); g.globalAlpha = 1;
  }
  // seleccionados (los mismos que en la biblioteca)
  if (S.multi.size) { g.strokeStyle = '#ebe8e3'; g.lineWidth = 1.2; for (const q of pts) if (S.multi.has(q.id)) { g.beginPath(); g.arc(q.X, q.Y, 6, 0, Math.PI * 2); g.stroke(); } }
  const sel = pts.find((q) => q.id === S.sel);
  if (sel) { g.beginPath(); g.arc(sel.X, sel.Y, 8, 0, Math.PI * 2); g.strokeStyle = '#ff6a2b'; g.lineWidth = 2; g.stroke(); }
  mapSelDraw(g);
  S.mapPts = pts;
  const near = (e) => { const b = cv.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top; let best = null, bd = 100; for (const q of S.mapPts) { const d = (q.X - x) ** 2 + (q.Y - y) ** 2; if (d < bd) { bd = d; best = q; } } return { best, x, y }; };
  mapSelInstall(cv);
  cv.onmousemove = (e) => { if (S._mdrag?.moved) { $('#mapTip').style.display = 'none'; return; } const { best, x, y } = near(e), tip = $('#mapTip'); if (!best) { tip.style.display = 'none'; return; } const p = lib.byId(best.id); tip.textContent = `${p.name} · ${catName(effCat(p)) || 'sin categoría'}`; tip.style.display = 'block'; tip.style.left = Math.min(x + 12, cv.clientWidth - 180) + 'px'; tip.style.top = y + 10 + 'px'; };
  cv.onmouseleave = () => { $('#mapTip').style.display = 'none'; };
  cv.onclick = (e) => { if (S._mdragDone) { S._mdragDone = false; return; } const { best } = near(e); if (best) { S.sel = best.id; rerender(); } };
}

// ===== AUDITORÍA (incluye reglas y calibración) =====
function statsOf() {
  const st = { cats: {}, user: 0, cert: {}, mono: 0, longEnv: 0, dist: 0, lfo: 0, inactive: 0, integrity: 0, contr: 0, pending: 0, seq: 0, variants: 0, measured: 0, mdark: 0, mlow: 0 };
  for (const p of lib.faces()) {
    const i = lib.info(p), c = i.cls, H = (id) => i.an.features.some((f) => f.id === id), HM = (id) => p.acoustic?.features?.some((f) => f.id === id);
    const cat = p.meta.category || c.category || (c.candidates ? 'ambiguous' : 'none');
    st.cats[cat] = (st.cats[cat] || 0) + 1; if (p.meta.category) st.user++;
    st.cert[c.certainty] = (st.cert[c.certainty] || 0) + 1;
    if (H('mono')) st.mono++; if (H('long-release') || H('slow-attack')) st.longEnv++; if (H('distortion') || H('filter-drive')) st.dist++; if (H('lfo-mod')) st.lfo++; if (H('fast-attack') && H('short-decay')) st.seq++;
    if (i.macros.knobs.some((k) => !k.activeCount)) st.inactive++; if (i.integrity.some((x) => x.level !== 'info')) st.integrity++; if (c.contradictions.length) st.contr++;
    if (p.meta.review === 'pending') st.pending++; if (p.kind === 'variant') st.variants++; if (p.acoustic) st.measured++; if (HM('m-dark')) st.mdark++; if (HM('m-low')) st.mlow++;
  }
  return st;
}

  const q = (label, n, query) => html`<button data-act="ask" data-q="${JSON.stringify(query)}"><span>${label}</span><b>${n}</b></button>`;

async function connectMidi(silent = false) {
  if (!navigator.requestMIDIAccess) { if (!silent) toast('Este navegador no ofrece Web MIDI (usa Chrome o Edge)'); return; }

  if (!S.dev.outId || !S.dev.access.outputs.get(S.dev.outId)) S.dev.outId = ports.out?.id || '';
  if (!S.dev.inId || !S.dev.access.inputs.get(S.dev.inId)) S.dev.inId = ports.in?.id || '';
  S.dev.access.onstatechange = () => { openSession(); rerender(); };
  openSession(); await saveSettings(); rerender();
  if (!silent) toast(S.dev.session ? 'Conectado a ' + S.dev.session.name : 'No se encontró Circuit Tracks; elige la salida en Equipo');
}
function openSession() {
  S.dev.session?.dispose?.(); S.dev.session = null;

  if (!out) return;

  s.onMacro = (synth) => { if (S.view === 'device' && synth === S.dev.synth) { const box = $('#liveMacros'); if (box) box.innerHTML = s.macroPos[synth].map((v, i) => `<div class="btn" style="cursor:default">M${i + 1}<small>${v ?? '—'}</small></div>`).join(''); } };
  S.dev.session = s;
  clearInterval(S.clockTimer); S.clockTimer = setInterval(() => { const el = $('#clockBpm'); if (el) { const t = s.clockTempo(); el.textContent = t ? t + ' BPM' : 'no llega (activa Clock Tx en Setup View o pon el equipo en marcha)'; } }, 1000);
}
async function getStream() {
  if (S.dev.stream && S.dev.streamId === S.dev.audioId) return S.dev.stream;
  S.dev.stream?.getTracks().forEach((t) => t.stop());
  S.dev.stream = await navigator.mediaDevices.getUserMedia({ audio: { deviceId: S.dev.audioId ? { exact: S.dev.audioId } : undefined, echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 } });

}
const WORKLET = `class R extends AudioWorkletProcessor{process(i){const c=i[0]&&i[0][0];if(c)this.port.postMessage(c.slice(0));return true}}registerProcessor('ctpl-rec',R);`;
async function record(ms, during) {
  const stream = await getStream();
  if (!S.dev.ctx) { S.dev.ctx = new AudioContext({ latencyHint: 'interactive' }); await S.dev.ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: 'application/javascript' }))); }
  const ctx = S.dev.ctx; await ctx.resume();
  const src = ctx.createMediaStreamSource(stream), node = new AudioWorkletNode(ctx, 'ctpl-rec'), chunks = [];
  node.port.onmessage = (e) => { chunks.push(e.data); const lv = $('#lvl'); if (lv) { let m = 0; for (const v of e.data) m = Math.max(m, Math.abs(v)); lv.style.width = Math.min(100, m * 100) + '%'; } };
  src.connect(node); node.connect(ctx.destination);
  const t0 = performance.now(); during?.(t0);
  await new Promise((r) => setTimeout(r, ms));
  src.disconnect(); node.disconnect();
  const n = chunks.reduce((a, c) => a + c.length, 0), x = new Float32Array(n); let o = 0; for (const c of chunks) { x.set(c, o); o += c.length; }
  // Silenciar la salida del nodo grabador (conectado solo para que procese)
  return { x, sr: ctx.sampleRate, t0 };
}
async function measure(p) {
  const s = S.dev.session; if (!s || !S.dev.audioId) { toast('Conecta el equipo y elige una entrada de audio en Equipo'); return; }
  toast('Midiendo… (3 s)', 3000);
  s.stopAll(); const note = S.dev.measureNote;
  try {
    const { x, sr } = await record(3400, (t0) => { const t = s.sendPatch(p.payload, S.dev.synth); s.note(S.dev.synth, note, 100, Math.max(t + (S.dev.patchDelay ?? 80), t0 + 250), 1500); });
    const desc = analyzeRecording(x, sr, { noteOn: 0.25, noteOff: 1.75, playedNote: note });
    await lib.setAcoustic(p.id, desc, { note, tempo: S.dev.tempo, input: S.dev.audioId, synth: S.dev.synth });
    rerender(); toast(desc.silent ? 'No llegó señal: revisa la entrada de audio' : 'Medición guardada');
  } catch (e) { toast('Error al medir: ' + e.message, 6000); }
}

// ---------- importación ----------
async function readInputs(fileList) {
  const out = []; let ignored = 0, big = 0; const packed = [];
  for (const f of fileList) {
    const rel = f.webkitRelativePath || f._path || '', full = rel || f.name;
    if (/\.(rar|7z|tar|gz|tgz)$/i.test(f.name) && !/(^|\/)(__MACOSX|\._)/.test(full)) { packed.push(full); continue; }
    if (!/\.(syx|sysex|bin|zip|json|circuittrackspack|circuitpack)$/i.test(f.name) || /(^|\/)(__MACOSX|\._)/.test(full)) { ignored++; continue; }
    const path = rel ? rel.split('/').slice(0, -1).join('/') : '';
    // Archivos SysEx grandes (packs de samples, transferencias de Components): solo se leen 16 bytes para identificarlos.
    if (/\.(syx|sysex|bin|circuitpack)$/i.test(f.name) && f.size > 2 * 1024 * 1024) { big++; out.push({ name: f.name, path, bytes: new Uint8Array(await f.slice(0, 16).arrayBuffer()), size: f.size, headOnly: true }); continue; }
    if (f.size > 300 * 1024 * 1024) { toast('Demasiado grande: ' + f.name); continue; }
    out.push({ name: f.name, path, bytes: new Uint8Array(await f.arrayBuffer()), size: f.size });
  }
  if (ignored) toast(`${ignored} archivo(s) que no son de patches (audio, PDF, AppleDouble…) se han ignorado sin leerlos`);
  if (packed.length) toast(`${packed.length} archivo(s) comprimido(s) que la herramienta no abre (.rar / .7z): ${packed.slice(0, 3).join(' · ')}${packed.length > 3 ? ' …' : ''}. Descomprímelos e importa la carpeta.`, 12000);
  return out;
}
async function doImport(fileList) {
  const inputs = await readInputs(fileList), json = inputs.filter((x) => /\.json$/i.test(x.name)), rest = inputs.filter((x) => !/\.json$/i.test(x.name));
  for (const j of json) await restoreFrom(j.bytes, j.name);
  if (!rest.length) return;
  let rep;
  try { rep = await lib.importInputs(rest); } catch (e) { toast('No se pudo guardar la importación: ' + (/quota/i.test(e.message) ? 'el navegador no tiene más espacio. Libera espacio o exporta y vacía la biblioteca.' : e.message), 9000); await lib.load(); rerender(); return; }
  S.rowsKey = ''; buildQueue(); rerender();
  if (!S.persisted && navigator.storage?.persist) navigator.storage.persist().then((ok) => { S.persisted = ok; });
  await importReport(rep);
}
