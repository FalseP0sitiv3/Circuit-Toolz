    if (r.type === 'token') { const tk = tokenize(r.pattern).join(' '); hit = texts.some((t) => (' ' + t.key + ' ').includes(' ' + tk + ' ')); why = `rule: word «${r.pattern}»`; }
    if (r.type === 'folder') { hit = folders.some((f) => f.toLowerCase() === String(r.pattern).toLowerCase()); why = `rule: folder «${r.pattern}»`; }
    if (r.type === 'nvcat' && ctx.payload) { hit = ctx.payload[16] === Number(r.pattern); why = `rule: Novation category code ${r.pattern}`; }
    if (hit) { add(r.category, r.type === 'nvcat' ? SOURCE_WEIGHTS.nvcat : SOURCE_WEIGHTS.rule, 'Learned rule', why, r.subtype); (textSupport[r.category] ||= new Set()).add('Rule ' + r.id); if (r.subtype) { subVotes[r.category + ':' + r.subtype] = (subVotes[r.category + ':' + r.subtype] || 0) + 4; (textSub[r.category + ':' + r.subtype] ||= []).push(why); } }
  }
  // 3) Hipótesis de síntesis (pesos bajos: apoyan, no deciden frente a un nombre claro).
  const synth = {};
  if (an) {
    const H = (id) => hasFeature(an, id);
    out.techTags = an.features.map((f) => f.label);
    const hyp = (cat, pts, why, sub) => { add(cat, pts, 'Synthesis', why, sub); synth[cat] = true; if (sub) subVotes[cat + ':' + sub] = (subVotes[cat + ':' + sub] || 0) + pts; };
    if (H('deep-register')) hyp('bass', 2, 'Transposed two or more octaves down');
    else if (H('low-register')) hyp('bass', 0.75, 'Transposed one octave down (also common in leads and arps)');
    if (H('low-register') && H('pure-waves') && !H('distortion') && !H('high-res')) hyp('bass', 0.5, 'Simple waveforms in a low register', 'sub');
    if (H('acid-like') && H('mono')) hyp('bass', 1, 'Resonance + short filter envelope in a mono voice', 'acid');
    if (H('wobble-like') && H('low-register')) hyp('bass', 0.5, 'Rhythmic LFO to the filter in a low register', 'wobble');
    if ((H('detuned') || H('density')) && H('low-register') && !H('percussive')) hyp('bass', 0.5, 'Detuned oscillators in a low register', 'reese');
    if (H('poly') && H('slow-attack') && H('long-release')) hyp('pad', 2, 'Polyphonic, slow attack and long release');
    else if (H('poly') && H('sustained') && H('long-release')) hyp('pad', 1, 'Sustained polyphonic with long release');
    if (H('percussive') && !H('low-register')) hyp('pluck', 1.5, 'Percussive amplitude envelope');
    const v = an.decoded.v;
    if (v['env1.a'] <= 2 && v['env1.s'] === 0 && v['env1.d'] <= 35) hyp('perc', 1 + (H('pitch-env') ? 0.5 : 0) + (H('noise') ? 0.5 : 0), 'Very short envelope' + (H('pitch-env') ? ' + pitch env' : '') + (H('noise') ? ' + noise' : ''));
    if (H('sustained') && H('long-release') && (H('lfo-mod') || H('mod-rich')) && !H('percussive')) hyp('drone', 1, 'Sustained, long release and modulation');
    if (H('mono') && !H('low-register') && !H('percussive') && (H('glide') || H('vibrato'))) hyp('lead', 1, 'Mono, not low register, glide/vibrato');
    if (H('noise') && (H('pitch-env') || H('lfo-mod')) && !H('low-register')) hyp('fx', 1, 'Modulated noise');
  }
  // 3b) Medición acústica real (si existe). Cuenta como fuente independiente del texto.
  const M = ctx.acoustic?.desc ? measuredFeatures(ctx.acoustic.desc) : [];
  out.measured = M;
  const HM = (id) => M.some((f) => f.id === id);
  const mAdd = (cat, k, why, sub) => { add(cat, SOURCE_WEIGHTS.measured * k, 'Acoustic measurement', why, sub); (textSupport[cat] ||= new Set()).add('Measurement'); if (sub) subVotes[cat + ':' + sub] = (subVotes[cat + ':' + sub] || 0) + 2; };
  if (M.length && !HM('m-silent')) {
    const d = ctx.acoustic.desc;
    if (HM('m-low')) mAdd('bass', 1, `measured f0 ${d.f0.toFixed(0)} Hz with the test note`, HM('m-dark') && !HM('m-noisy') ? 'sub' : undefined);
    if (HM('m-slow-attack') && HM('m-long-release')) mAdd('pad', 1, 'Slow attack and long tail measured');
    else if (HM('m-sustained') && HM('m-long-release') && HM('m-moving')) mAdd('drone', 0.6, 'Sustained with movement and long tail');
    if (HM('m-percussive') && !HM('m-low')) mAdd(HM('m-noisy') ? 'perc' : 'pluck', 0.8, 'Percussive envelope measured');
    if (HM('m-noisy') && !d.f0) mAdd('fx', 0.8, 'No clear pitch and noisy spectrum');
  }
  // 4) Decisión. Las categorías de uso (arp/sequence) solo son principales si no hay tímbrica.
  const ranked = Object.entries(out.scores).sort((a, b) => b[1] - a[1]);
  const timbre = ranked.filter(([c]) => CATEGORIES.find((x) => x.id === c)?.kind === 'timbre');
  for (const [c] of ranked) if ((c === 'arp' || c === 'sequence') && timbre.length && !out.usage.includes(c)) out.usage.push(c);
  // Si el nombre o la carpeta declaran un uso (ARP, SEQ) y la tímbrica solo viene de indicios débiles de síntesis,
  // manda el uso declarado: «12.5% ARP» una octava abajo es un arpegio, no un bajo.
  const usageDeclared = ranked.filter(([c]) => CATEGORIES.find((x) => x.id === c)?.kind !== 'timbre' && textSupport[c]?.size);
  // con un uso declarado en el texto, solo cuenta la tímbrica que también tiene apoyo textual
  const timbreSolid = timbre.filter(([c]) => textSupport[c]?.size);
  const pool = usageDeclared.length && !timbreSolid.length ? ranked.filter(([c]) => !timbre.some(([t]) => t === c)) : timbre.length ? timbre : ranked;
  const [top, second] = pool;
  if (top) {
    const textCount = textSupport[top[0]]?.size || 0;
    if (second && second[1] >= top[1] - 1 && (textSupport[second[0]]?.size || 0) > 0) {
      out.certainty = 'ambiguous';
      out.contradictions.push({ text: `Similar hints of ${CAT_LABEL[top[0]]} (${top[1]}) y ${CAT_LABEL[second[0]]} (${second[1]})`, kind: 'text' });
      out.candidates = [top[0], second[0]];
    } else {
      // Un único indicio débil de síntesis (p. ej. solo «una octava abajo») no basta para poner categoría:
      // queda como pista visible y el patch sigue «sin categoría».
      if (!textCount && top[1] < 1.5) { out.hint = { cat: top[0], pts: top[1] }; out.pending.push(`Weak hint of ${CAT_LABEL[top[0]]} from parameters: listen to decide`); }
      else {
        out.category = top[0];
        out.certainty = textCount >= 2 ? 'corroborated' : textCount === 1 ? 'textual' : 'technical';
        out.basis = [...new Set([...(textSupport[top[0]] || [])].map(BASIS_WORD))];
      }
    }
  }
  if (out.category && an) {
    // Subcarpeta deducida de cómo está programado (apoya o decide cuando el nombre no dice nada)
    for (const r of paramSubtypes(out.category, an)) {
      subVotes[out.category + ':' + r.sub] = (subVotes[out.category + ':' + r.sub] || 0) + r.pts;
      out.evidence.push({ cat: out.category, sub: r.sub, pts: 0, source: 'Settings → subfolder', why: r.why, subPts: r.pts });
    }
  }
  if (out.category) {
    const subs = Object.entries(subVotes).filter(([k]) => k.startsWith(out.category + ':')).sort((a, b) => b[1] - a[1]);
    if (subs.length && subs[0][1] >= 0.75) {
      out.subtype = subs[0][0].split(':')[1];
      const key = out.category + ':' + out.subtype, fromText = !!textSub[key];
      const why = fromText ? textSub[key] : out.evidence.filter((e) => e.cat === out.category && e.sub === out.subtype).map((e) => e.why);
      out.subBasis = { from: fromText ? 'text' : 'params', why: [...new Set(why)].slice(0, 3), pts: Math.round(subs[0][1] * 10) / 10 };
      if (subs[1] && subs[1][1] >= subs[0][1] - 0.5) out.subAlt = subs[1][0].split(':')[1];
    }
  }
  // Carácter deducido de los ajustes (se distingue del declarado en el nombre)
  if (an) for (const d of paramDescriptors(an)) if (!out.descriptors.some((x) => x.label === d.label)) out.descriptors.push({ label: d.label, source: 'Settings', term: d.why, declared: false });
  // 5) Contradicciones entre el nombre y la configuración (avisos; nunca cambian la propuesta).
  if (an && out.category) {
    const H = (id) => hasFeature(an, id), c = out.category, X = (t) => out.contradictions.push({ text: t, kind: 'synth' });
    if (c === 'pad' && H('percussive')) X('Pad is proposed but the amplitude envelope is percussive');
    if (c === 'bass' && H('high-register')) X('Bass is proposed but the patch is transposed up');
    if (c === 'bass' && H('poly') && H('slow-attack')) X('Bass is proposed but it\'s polyphonic with a slow attack');
    if (c === 'bass' && out.subtype === 'sub' && (H('high-res') || H('distortion') || H('wavetable'))) X('Sub Bass with resonance, distortion or digital waveforms: check whether it\'s really a sub');
    if (c === 'pluck' && (H('slow-attack') || (an.decoded.v['env1.s'] >= 90 && H('long-release')))) X('Pluck is proposed but the envelope is slow or sustained');
    if (c === 'lead' && H('low-register')) X('Lead is proposed but the register is low (Lead Bass?)');
    if ((c === 'perc' || c === 'stab') && H('slow-attack')) X(`Proposed: ${CAT_LABEL[c]} but the attack is slow`);
    if (c === 'drone' && H('percussive')) X('Drone is proposed but the envelope is percussive');
    for (const d of out.descriptors.filter((x) => x.declared)) {
      if (d.label === 'Dark' && H('open-filter')) X('The name says «Dark» but the LP filter is open (that doesn\'t prove it doesn\'t sound dark)');
      if (d.label === 'Bright' && H('low-cutoff')) X('The name says «Bright» but the LP cutoff is low');
      if (d.label === 'Distorted' && !H('distortion') && !H('filter-drive')) X('The name says distortion but no high drive/distortion is set (it may come from the macros)');
    }
    if (M.length && !HM('m-silent')) {
      const X2 = (t) => out.contradictions.push({ text: t, kind: 'measured' });
      if (c === 'bass' && ctx.acoustic.desc.f0 && ctx.acoustic.desc.f0 > 260) X2(`Bass is proposed but the measured f0 is ${ctx.acoustic.desc.f0.toFixed(0)} Hz`);
      if (c === 'pad' && HM('m-percussive')) X2('Pad is proposed but the measurement is percussive');
    }
    if (out.contradictions.some((x) => x.kind !== 'text') && out.certainty === 'corroborated') out.certainty = 'textual';
  }
  if (M.length && !HM('m-silent')) for (const d of out.descriptors.filter((x) => x.declared)) {
    if (d.label === 'Dark' && HM('m-bright')) out.contradictions.push({ text: 'The name says «Dark» and the measurement shows high brightness', kind: 'measured' });
    if (d.label === 'Bright' && HM('m-dark')) out.contradictions.push({ text: 'The name says «Bright» and the measurement shows a dark sound', kind: 'measured' });
  }
  // 6) Aspectos pendientes de escucha.
  if (!M.length) out.pending.push('Real timbre: no listening or measurement recorded');
  else if (HM('m-silent')) out.pending.push('The measurement captured no signal: check the audio input');
  if (an) {
    if (an.activeMacros) out.pending.push(`${an.activeMacros} active macro(s) may change the character a lot depending on their position`);
    if (hasFeature(an, 'lfo-mod')) out.pending.push('Check whether the LFO modulation is audible and at what speed');
    const decl = out.descriptors.filter((d) => d.declared);
    if (decl.length) out.pending.push('The descriptors (' + decl.map((d) => d.label).join(', ') + ') come from the name, not from listening');
    if (out.category === 'bass' || out.category === 'lead') out.pending.push('Effective register depends on the pattern\'s notes');
  }
  out.unknownTokens = [...new Set(out.unknownTokens)];
  out.analysis = an;
  return out;
}

// ---------- Subcarpeta por ajustes ----------
// Reglas sencillas y explicables por categoría. pts: fuerza del indicio (el nombre pesa 3 por fuente).
function paramSubtypes(cat, an) {
  const H = (id) => hasFeature(an, id), v = an.decoded.v, out = [], R = (sub, pts, why) => out.push({ sub, pts, why });
  const shortEnv = H('percussive') || H('short-decay'), sustained = !H('percussive') && (H('sustained') || v['env1.s'] >= 70);
  const bright = H('open-filter') || !(v['filter.type'] <= 1), harsh = H('distortion') || H('filter-drive');
  const metallic = H('ringmod') || H('vsync') || H('wavetable');
  if (cat === 'bass') {
    if (H('acid-like')) R('acid', 2, 'High resonance and a short envelope on the filter');
    if (H('wobble-like')) R('wobble', 2, 'Rhythmic LFO on the filter');
    if ((H('detuned') || H('density')) && sustained) R('reese', 1.5, 'Detuned oscillators or density on a sustained note');
    if (H('pure-waves') && !harsh && !H('high-res') && !metallic) R('sub', 1.5 + (H('deep-register') ? 0.5 : 0), 'Simple waves, closed filter and no saturation');
    if (harsh && !H('acid-like')) R('dist', 1.25, 'High distortion or filter drive');
    if (metallic && !H('pure-waves')) R('fm', 1.25, H('ringmod') ? 'Ring mod' : H('vsync') ? 'Virtual sync' : 'Digital wavetable waves');
    if ((H('slow-attack') || H('long-release')) && sustained && !H('filter-env')) R('drone', 1.25, 'Slow attack or long release with no filter envelope');
    if (shortEnv && H('filter-env') && !H('acid-like')) {
      if (H('deep-register') || v['filter.freq'] <= 60) R('rolling', 1.25, 'Short notes with a filter envelope, very low or dark');
      else R('groovy', 1.25, 'Short notes with a filter envelope in the low-mid register');
    }
    if (H('glide') && H('filter-env') && !H('acid-like')) R('groovy', 0.75, 'Glide and filter envelope');
    if (H('percussive') && bright && !H('filter-env')) R('pluck', 1, 'Percussive envelope with an open filter');
    if (H('pitch-env') && H('deep-register') && H('long-decay')) R('b808', 1.5, 'Pitch envelope with a long decay in a very low register');
  } else if (cat === 'lead') {
    if (H('acid-like')) R('acid', 2, 'Acid-style setup');
    if (H('vsync')) R('sync', 1.5, 'Virtual sync');
    if ((H('density') || H('detuned')) && (bright || H('chorus'))) R('saw', 1.25, 'Density or detune with an open filter');
    if (H('slow-attack') || (H('low-cutoff') && !H('high-res'))) R('soft', 1, 'Slow attack or closed filter');
    if (H('mono')) R('mono', 0.75, 'Monophonic voice'); else if (H('poly')) R('poly', 0.75, 'Polyphonic voice');
  } else if (cat === 'pad') {
    if (H('lfo-mod') || H('mod-rich')) R('evolving', 1.25, 'LFO modulation or a dense matrix');
    if (H('low-cutoff')) R('dark', 1.25, 'Closed LP filter');
    if (H('noise') || (bright && H('long-release'))) R('airy', 1, H('noise') ? 'Noise in the mix' : 'Open filter and long tail');
    if (!bright && (H('chorus') || H('detuned')) && !H('low-cutoff')) R('warm', 1, 'Half-open LP filter with chorus or detune');
  } else if (cat === 'pluck') {
    if (metallic || H('high-register')) R('bell', 1.25, metallic ? 'Ring mod, sync or wavetable waves' : 'High register');
    if (H('low-cutoff')) R('soft', 1, 'Closed filter');
    if (H('short-decay')) R('short', 1, 'Very short decay');
  } else if (cat === 'stab') {
    if ((H('density') || H('detuned')) && (harsh || H('pitch-env'))) R('rave', 1.5, 'Detuned with saturation or a pitch envelope');
    if (H('chorus') && H('long-release')) R('dub', 1.25, 'Chorus and long tail');
    if (H('poly')) R('chord', 0.75, 'Polyphonic');
  } else if (cat === 'chords') {
    if (H('chorus') && H('long-release')) R('dub', 1.25, 'Chorus and long tail');
    if (shortEnv) R('stab', 1, 'Short envelope');
    if (H('slow-attack')) R('pad', 1, 'Slow attack');
  } else if (cat === 'keys') {
    if (sustained && !H('filter-env') && H('pure-waves')) R('organ', 1, 'Sustained, simple waves and no filter envelope');
    if (H('long-decay') && H('chorus')) R('epiano', 1, 'Long decay with chorus');
    if (H('percussive') && H('high-res')) R('clav', 1, 'Percussive with resonance');
  } else if (cat === 'fx') {
    if (H('noise') && !H('pitch-env')) R('noise', 1.25, 'Prominent noise');
    if (H('pitch-env') && H('percussive')) R('zap', 1.5, 'Pitch envelope on a short hit');
    if (H('filter-lfo') || (H('filter-env') && H('slow-attack'))) R('sweep', 1, 'Filter sweep');
    if (H('percussive') && (H('noise') || harsh) && !H('pitch-env')) R('impact', 1, 'Short hit with noise or saturation');
    if (H('slow-attack') && (H('pitch-env') || H('filter-env'))) R('riser', 1, 'Slow attack with a pitch or filter envelope');
  } else if (cat === 'drone') {
    if (H('noise')) R('noise', 1.25, 'Prominent noise');
    if (H('low-cutoff')) R('dark', 1.25, 'Closed LP filter');
    if (H('mod-rich') || metallic) R('texture', 1, 'Dense matrix or digital waves');
    if (H('long-release') && (H('chorus') || H('lfo-mod'))) R('atmos', 1, 'Long tail with chorus or LFO');
  } else if (cat === 'perc') {
    if (H('pitch-env') && (H('low-register') || H('pure-waves'))) R('kick', 1.5, 'Pitch envelope on a low or simple tone');
    if (H('noise') && (v['filter.type'] >= 4)) R('hat', 1.5, 'Noise through a high-pass filter');
    else if (H('noise')) R('snare', 1.25, 'Noise in a short hit');
    if (metallic) R('metal', 1.25, 'Ring mod, sync or wavetable waves');
    if (H('pitch-env') && !H('low-register') && !H('noise')) R('tom', 1, 'Pitch envelope in the mid register');
  } else if (cat === 'transition') {
    if (H('slow-attack')) R('riser', 0.75, 'Slow attack');
  }
  return out;
}
// Carácter que se puede leer en los ajustes. Son indicios, no escucha: la ficha los marca «de los ajustes».
function paramDescriptors(an) {
  const H = (id) => hasFeature(an, id), out = [], D = (label, why) => out.push({ label, why });
  if (H('low-cutoff') && !H('high-res') && !H('distortion')) D('Dark', 'Closed LP filter');
  if (H('open-filter') && !H('pure-waves')) D('Bright', 'Open LP filter with rich waves');
  if (H('distortion') || H('filter-drive')) D('Distorted', 'High distortion or drive');
  if (H('acid-like')) D('Acidic', 'Resonance and a short filter envelope');
  if (H('ringmod') || H('vsync')) D('Metallic', H('ringmod') ? 'Ring mod' : 'Virtual sync');
  if (H('wavetable')) D('Digital', 'Wavetable waves');
  if (H('detuned') || H('density') || H('chorus')) D('Wide', 'Detune, density or chorus');
  if (H('fast-attack') && H('filter-env') && !H('long-release')) D('Punchy', 'Fast attack with a filter envelope');
  if (H('slow-attack') && !H('high-res')) D('Soft', 'Slow attack');
  if (H('lfo-mod') && !H('percussive')) D('Hypnotic', 'Sustained LFO modulation');
  return out;
}

// ---------- Etiquetas rápidas (paleta) y efectos ----------
const TAG_PALETTE = [
  { name: 'Effects', tags: ['Delay', 'Reverb', 'Chorus', 'Phaser', 'Distortion', 'EQ'] },
  { name: 'Character', tags: ['Dark', 'Warm', 'Bright', 'Deep', 'Punchy', 'Soft', 'Metallic', 'Hypnotic', 'Aggressive', 'Wide'] },
  { name: 'Use', tags: ['Intro', 'Groove', 'Break', 'Build', 'Drop', 'Live', 'Layer'] }
];
const FX_WORDS = { delay: 'Delay', dly: 'Delay', echo: 'Delay', echoes: 'Delay', dub: 'Delay', reverb: 'Reverb', verb: 'Reverb', rev: 'Reverb', hall: 'Reverb', room: 'Reverb', space: 'Reverb', spacey: 'Reverb', spacy: 'Reverb', plate: 'Reverb', chorus: 'Chorus', phaser: 'Phaser', phase: 'Phaser', flanger: 'Phaser', dist: 'Distortion', distortion: 'Distortion', distorted: 'Distortion', fuzz: 'Distortion', crush: 'Distortion', bitcrush: 'Distortion', eq: 'EQ' };
// Efectos que se pueden leer en el nombre (delay, reverb…) o en el patch (chorus, phaser, distorsión, EQ).
// Delay y reverb son efectos del proyecto en el Circuit Tracks: en un patch solo pueden venir del nombre.
function fxTags(texts, an) {
  const out = new Map();
  for (const t of texts) for (const w of tokenize(t)) if (FX_WORDS[w] && !out.has(FX_WORDS[w])) out.set(FX_WORDS[w], { t: FX_WORDS[w], k: 'name', why: `«${w}” in the name` });
  if (an) {
    const v = an.decoded.v;
    if (v['fx.chorus'] >= 40 && !out.has(v['fx.chorustype'] === 0 ? 'Phaser' : 'Chorus')) out.set(v['fx.chorustype'] === 0 ? 'Phaser' : 'Chorus', { t: v['fx.chorustype'] === 0 ? 'Phaser' : 'Chorus', k: 'par', why: 'Level ' + v['fx.chorus'] });
    if ((v['fx.dist'] >= 40 || v['filter.drive'] >= 50) && !out.has('Distortion')) out.set('Distortion', { t: 'Distortion', k: 'par', why: 'High distortion or drive' });
    if ((Math.abs(v['eq.bassl'] - 64) >= 20 || Math.abs(v['eq.midl'] - 64) >= 20 || Math.abs(v['eq.trebl'] - 64) >= 20) && !out.has('EQ')) out.set('EQ', { t: 'EQ', k: 'par', why: 'Strong EQ' });
  }
  return [...out.values()];
}
// Palabras del nombre (interno y de archivo) para filtrar: sin palabras vacías ni números sueltos.
const WORD_STOP = new Set([...STOP, 'v', 'b', 'mk', 'ii', 'iii', 'pt', 'no', 'de', 'la', 'el', 'y', 'en', 'un', 'una']);
function nameWords(...texts) { const s = new Set(); for (const t of texts) for (const w of tokenize(String(t || '').replace(/\.[a-z0-9]{2,6}$/i, ''))) if (w.length >= 2 && !WORD_STOP.has(w)) s.add(w); return [...s]; }

// Cuánto apoyo tiene una propuesta, dicho en llano. «rank» ordena de más a menos segura.
const CERTAINTY = {
  manual: { label: 'Decided by you', rank: 5, help: 'You set or accepted the category.' },
  corroborated: { label: 'Confirmed', rank: 4, help: 'Two different clues say the same thing (for example, the name and the folder, or the name and the measurement) and nothing contradicts it.' },
  textual: { label: 'One clue', rank: 3, help: 'Only one clue points to it (usually the name or the folder). It\'s usually right, but it\'s worth listening.' },
  technical: { label: 'From its settings', rank: 2, help: 'Neither the name nor the folder says anything; it\'s deduced from how it\'s programmed (for example, transposed two octaves down → bass). Listen to confirm it.' },
  ambiguous: { label: 'Doubtful', rank: 1, help: 'There are clues of two kinds with similar strength. Decide when you listen to it.' },
  none: { label: 'No clues', rank: 0, help: 'Nothing indicates what it is (a single weak hint from its settings isn\'t enough). Listen and classify it.' }
};
// De qué pistas sale la propuesta, en palabras cortas («nombre», «carpeta», «medición»…).
const BASIS_WORD = (src) => /^Nombre interno/.test(src) ? 'name' : /^Nombre de archivo/.test(src) ? 'name' : /^Carpeta/.test(src) ? 'carpeta' : /^Banco/.test(src) ? 'banco' : /^Regla/.test(src) ? 'your rule' : /^Medici/.test(src) ? 'measurement' : src.toLowerCase();

// Propuestas de reglas tras una corrección manual (el usuario decide si las guarda).
function suggestRules(cls, finalCat, ctx) {
  const out = [];
  for (const tok of cls.unknownTokens.slice(0, 3)) out.push({ type: 'token', pattern: tok, category: finalCat, why: `The word «${tok}» isn't in the lexicon` });
  const folder = String(ctx.folderPath || '').split(/[\\/]/).filter(Boolean).pop();
  if (folder && !matchText(folder).hits.some((h) => h.cat)) out.push({ type: 'folder', pattern: folder, category: finalCat, why: `The folder «${folder}» doesn't indicate a category` });
  return out;
}

// Calibración: compara propuestas con decisiones del usuario por nivel de certeza.
function calibration(decisions) {
  const by = {};
  for (const d of decisions) {
    if (!d.predicted || d.action === 'revert') continue;
    const k = d.predicted.certainty || 'none';
    const row = (by[k] ||= { total: 0, accepted: 0, corrected: 0, rejected: 0 });
    row.total++;
    if (d.action === 'accept' || (d.action === 'correct' && d.final === d.predicted.category)) row.accepted++;
    else if (d.action === 'reject') row.rejected++;
    else row.corrected++;
  }
  return by;
}

// ---- core/compare.js ----
// Huellas, niveles de duplicado, similitud técnica y diferencias parámetro a parámetro.


// Hash rápido (dos FNV-1a de 32 bits) para indexar; la igualdad se confirma byte a byte.
function quickHash(bytes, from = 0, to = bytes.length) {
  let h1 = 0x811c9dc5, h2 = 0x01000193 ^ 0x9e3779b9;
  for (let i = from; i < to; i++) { h1 = Math.imul(h1 ^ bytes[i], 0x01000193); h2 = Math.imul(h2 ^ bytes[i], 0x5bd1e995); h2 ^= h2 >>> 15; }
  return ((h1 >>> 0).toString(16).padStart(8, '0') + (h2 >>> 0).toString(16).padStart(8, '0'));
}
async function sha256(bytes) {
  const d = await crypto.subtle.digest('SHA-256', bytes);
  return [...new Uint8Array(d)].map((x) => x.toString(16).padStart(2, '0')).join('');
}

// Zonas de comparación:
//  payload → 0–339 completo; synth → 32–339 (sin nombre/metadatos); core → 32–203 (sin macros);
//  macros → 204–339; macroRoutes → macros sin las 8 posiciones guardadas.
function fingerprints(payload) {
  const routes = new Uint8Array(128);
  for (let k = 0; k < 8; k++) routes.set(payload.slice(205 + 17 * k, 221 + 17 * k), 16 * k);
  return { payload: quickHash(payload), synth: quickHash(payload, 32, 340), core: quickHash(payload, 32, 204), macros: quickHash(payload, 204, 340), macroRoutes: quickHash(routes) };
}

const eqRange = (a, b, from, to) => { for (let i = from; i < to; i++) if (a[i] !== b[i]) return false; return true; };

function relation(a, b) {
  if (eqRange(a, b, 0, 340)) return { level: 'payload', label: 'Binary duplicate (identical payload)' };
  if (eqRange(a, b, 32, 340)) return { level: 'synth', label: 'Synthesis duplicate (only name/metadata change)' };
  if (eqRange(a, b, 32, 204)) {
    let routesEq = true;
    for (let k = 0; k < 8; k++) if (!eqRange(a, b, 205 + 17 * k, 221 + 17 * k)) routesEq = false;
    return routesEq ? { level: 'macro-position', label: 'Macro position variant' } : { level: 'macro', label: 'Macro variant' };
  }
  const n = diffParams(a, b).filter((d) => d.off >= 32 && d.off < 204).length;
  if (n <= 6) return { level: 'param', label: `Parameter variant (${n} diferencia${n === 1 ? '' : 's'} in the core)`, count: n };
  return { level: 'different', label: 'Different patches', count: n };
}

// Similitud técnica 0–1 sobre parámetros normalizados. NO equivale a similitud sonora.
function similarity(a, b) {
  const va = featureVector(a), vb = featureVector(b);
  let num = 0, den = 0;
  for (let i = 0; i < va.length; i++) {
    const w = va[i].w; den += w;
    if ('cat' in va[i]) num += w * (va[i].cat === vb[i].cat ? 1 : 0);
    else num += w * (1 - Math.abs(va[i].x - vb[i].x));
  }
  return den ? num / den : 0;
}

function diffParams(a, b) {
  const out = [];
  for (let o = 0; o < 340; o++) {
    if (a[o] === b[o]) continue;
    const d = describeOffset(o);
    out.push({ off: o, group: d.group, label: d.label, a: a[o], b: b[o], fa: fmt(o, d, a[o]), fb: fmt(o, d, b[o]), ev: d.ev, hint: influence(d, a[o], b[o]) });
  }
  return out;
}
function fmt(o, d, v) {
  if (d.param) return formatValue(d.param, v);
  if (o >= 204 && (o - 205) % 17 % 4 === 0 && (o - 204) % 17 !== 0) return macroDestInfo(v).label;
  return String(v);
}
// Posible influencia (orientativa) del cambio A→B.
function influence(d, a, b) {
  const k = d.param?.key || '';
  const up = b > a;
  if (k === 'filter.freq') return up ? 'More open filter: probably brighter' : 'More closed filter: probably less bright';
  if (k === 'filter.res') return up ? 'More resonance: more pronounced peak' : 'Less resonance';
  if (k === 'env1.a') return up ? 'Slower onset' : 'More immediate attack';
  if (k === 'env1.d' || k === 'env1.r') return up ? 'Notes with a longer tail' : 'Shorter notes';
  if (k === 'env1.s') return up ? 'More sustained' : 'More percussive';
  if (k === 'filter.drive' || k === 'fx.dist') return up ? 'More saturation' : 'Cleaner';
  if (k === 'voice.poly') return 'Changes polyphony and glide behaviour';
  if (k.endsWith('.wave')) return 'Changes the base waveform';
  if (k.endsWith('.semi') || k === 'voice.octave') return 'Changes tuning / register';
  if (d.group === 'macros') return 'Changes what the macros do, not the resting sound (except position)';
  if (d.group === 'matrix') return 'Changes a modulation route';
  if (d.group === 'meta') return 'Metadata only';
  return '';
}

function groupDiff(diffs) {
  const g = {};
  for (const d of diffs) (g[d.group] ||= []).push(d);
  return Object.entries(g).map(([group, items]) => ({ group, label: GROUP_LABELS[group] || group, items }));
}

// Agrupa una colección por nivel. records: [{id, payload, fp}]
function groupDuplicates(records) {
  const by = (key) => { const m = new Map(); for (const r of records) { const k = r.fp[key]; if (!m.has(k)) m.set(k, []); m.get(k).push(r.id); } return [...m.values()].filter((x) => x.length > 1); };
  const payload = by('payload'), synth = by('synth'), core = by('core');
  // Variantes de macros: mismo núcleo pero distinta huella de síntesis.
  const macroVariants = core.filter((ids) => new Set(ids.map((id) => records.find((r) => r.id === id).fp.synth)).size > 1);
  return { payload, synth, macroVariants };
}

function nearest(target, records, k = 8) {
  return records.filter((r) => r.payload !== target).map((r) => ({ id: r.id, s: similarity(target, r.payload) })).sort((a, b) => b.s - a.s).slice(0, k);
}

// ---- core/families.js ----
// Familias de patches (duplicados y variantes agrupados) y mapa 2D de similitud técnica.



// items: [{id, payload, fp, name, fileName, importedAt}]
// Une: misma síntesis (32–339), mismo núcleo (32–203: variantes de macros), y mismo nombre base con
// similitud técnica ≥ simNamed (variantes de parámetros con nombre emparentado).
function buildFamilies(items, { simNamed = 0.9 } = {}) {
  const parent = new Map(items.map((x) => [x.id, x.id]));
  const find = (a) => { while (parent.get(a) !== a) { parent.set(a, parent.get(parent.get(a))); a = parent.get(a); } return a; };
  const union = (a, b) => { const ra = find(a), rb = find(b); if (ra !== rb) parent.set(rb, ra); };
  const byKey = (fn) => { const m = new Map(); for (const x of items) { const k = fn(x); if (!k) continue; if (m.has(k)) union(m.get(k), x.id); else m.set(k, x.id); } };
  byKey((x) => x.fp.synth); byKey((x) => x.fp.core);
  const byName = new Map();
  // Nombres genéricos («Bass 01», «Pad 2») no indican parentesco: solo se agrupan nombres con alguna palabra propia.
  for (const x of items) { const k = baseName(x.name) || baseName(x.fileName); if (!k || k.length < 3 || !matchText(k).unknown.length) continue; (byName.get(k) || byName.set(k, []).get(k)).push(x); }
  for (const group of byName.values()) {
    if (group.length < 2 || group.length > 60) continue;
    for (let i = 0; i < group.length; i++) for (let j = i + 1; j < group.length; j++) if (find(group[i].id) !== find(group[j].id) && similarity(group[i].payload, group[j].payload) >= simNamed) union(group[i].id, group[j].id);
  }
  const fams = new Map();
  for (const x of items) { const r = find(x.id); (fams.get(r) || fams.set(r, []).get(r)).push(x); }
  return [...fams.values()].filter((m) => m.length > 1).map((members) => {
    members.sort((a, b) => (a.kind === 'variant') - (b.kind === 'variant') || (a.importedAt < b.importedAt ? -1 : 1));
    const head = members[0];
    return { id: head.id, head: head.id, members: members.map((m) => ({ id: m.id, rel: m === head ? null : relation(head.payload, m.payload) })) };
  });
}

// PCA a 2 componentes sobre vectores de parámetros (one-hot para listas).
function vectorize(payload) {
  const out = [];
  for (const v of featureVector(payload)) {
    if ('cat' in v) {
      const isWave = v.k.startsWith('osc') && v.k.endsWith('.wave');
      const k = v.k === 'voice.poly' ? 3 : v.k === 'filter.type' ? 6 : isWave ? 4 : 2;
      const bucket = isWave ? (v.cat <= 1 ? 0 : v.cat <= 11 ? 1 : (v.cat <= 13 || v.cat === 15) ? 2 : 3) : v.cat % k;
      for (let i = 0; i < k; i++) out.push(i === bucket ? v.w * 0.7 : 0);
    }
    else out.push(v.x * v.w);
  }
  return out;
}
function pca2(rows) {
  const n = rows.length; if (n < 3) return rows.map((_, i) => [i, 0]);
  const d = rows[0].length, mean = new Float64Array(d);
  for (const r of rows) for (let j = 0; j < d; j++) mean[j] += r[j] / n;
  const X = rows.map((r) => r.map((v, j) => v - mean[j]));
  const cov = Array.from({ length: d }, () => new Float64Array(d));
  for (const r of X) for (let a = 0; a < d; a++) { const ra = r[a]; if (!ra) continue; for (let b = a; b < d; b++) cov[a][b] += ra * r[b]; }
  for (let a = 0; a < d; a++) for (let b = 0; b < a; b++) cov[a][b] = cov[b][a];
  const comps = [];
  for (let c = 0; c < 2; c++) {
    let v = Array.from({ length: d }, (_, i) => Math.sin(i * 1.7 + c + 1));
    for (let it = 0; it < 120; it++) {
      const w = new Float64Array(d);
      for (let a = 0; a < d; a++) { let s = 0; for (let b = 0; b < d; b++) s += cov[a][b] * v[b]; w[a] = s; }
      for (const p of comps) { const dot = w.reduce((s, x, i) => s + x * p[i], 0); for (let i = 0; i < d; i++) w[i] -= dot * p[i]; }
      const norm = Math.hypot(...w) || 1; v = Array.from(w, (x) => x / norm);
    }
    comps.push(v);
  }
  return X.map((r) => comps.map((p) => r.reduce((s, x, i) => s + x * p[i], 0)));
}

// Afinidad con «lo que sueles usar»: media de las 3 mayores similitudes con el conjunto de referencia.
function affinity(target, refs) {
  if (!refs.length) return 0;
  const s = refs.map((r) => similarity(target, r)).sort((a, b) => b - a).slice(0, 3);
  return s.reduce((a, b) => a + b, 0) / s.length;
}

// ---- core/macros.js ----
// Auditoría y edición de las 8 macros (8 × 17 bytes desde el offset 204).
// Estructura documentada oficialmente; el significado de los códigos de destino es comunitario.


function auditMacros(payload) {
  const d = decodePatch(payload);
  const integrity = [], observations = [];
  const destUse = new Map();
  for (const m of d.macros) {
    const seenInKnob = new Set();
    for (const s of m.slots) {
      if (s.dest > 70) integrity.push({ knob: m.index, slot: s.slot, text: `M${m.index + 1}${'ABCD'[s.slot]}: destination ${s.dest} outside the documented range 0–70` });
      if (s.state !== 'active') continue;
      if (s.dest === 70) observations.push({ knob: m.index, text: `M${m.index + 1}${'ABCD'[s.slot]}: code 70 with no known meaning` });
      if (seenInKnob.has(s.dest)) observations.push({ knob: m.index, text: `M${m.index + 1}: the same destination (${s.info.label}) appears in two routes` });
      seenInKnob.add(s.dest);
      if (!destUse.has(s.dest)) destUse.set(s.dest, new Set());
      destUse.get(s.dest).add(m.index);
      if (s.info.group === 'matrix') {
        const mi = s.dest - 50, route = d.matrix[mi];
        if (route && route.s1 === 0 && route.s2 === 0) observations.push({ knob: m.index, text: `M${m.index + 1}: controls the matrix depth ${mi + 1}, whose source is «Direct» (fixed offset)` });
      }
    }
    if (!m.active) observations.push({ knob: m.index, text: `M${m.index + 1}: no routes with effect (depth 0 or zero range)`, inactive: true });
  }
  const shared = [...destUse.entries()].filter(([, ks]) => ks.size > 1).map(([dest, ks]) => ({ dest, label: macroDestInfo(dest).label, knobs: [...ks] }));
  for (const s of shared) observations.push({ text: `Shared destination: ${s.label} en ${s.knobs.map((k) => 'M' + (k + 1)).join(', ')}`, shared: true });
  const knobs = d.macros.map((m) => {
    const act = m.slots.filter((s) => s.state === 'active');
    const groups = [...new Set(act.map((s) => s.info.group))];
    return { ...m, activeCount: act.length, groups, mainGroup: groups[0] || null, summary: act.length ? act.map((s) => s.info.label).join(' · ') : 'No effect' };
  });
  return { knobs, integrity, observations, shared };
}

// --- Operaciones (siempre devuelven una copia nueva) ---
function swapKnobs(payload, a, b) {
  const out = new Uint8Array(payload);
  const A = payload.slice(204 + 17 * a, 221 + 17 * a), B = payload.slice(204 + 17 * b, 221 + 17 * b);
  out.set(B, 204 + 17 * a); out.set(A, 204 + 17 * b);
  return out;
}
function permuteKnobs(payload, perm) { // perm[newIndex] = oldIndex
  if (perm.length !== 8 || new Set(perm).size !== 8) throw new Error('Invalid permutation');
  const out = new Uint8Array(payload);
  for (let k = 0; k < 8; k++) out.set(payload.slice(204 + 17 * perm[k], 221 + 17 * perm[k]), 204 + 17 * k);
  return out;
}
function setSlot(payload, knob, slot, { dest, start, end, depth }) {
  const out = new Uint8Array(payload), o = 205 + 17 * knob + 4 * slot;
  const clamp = (x, lo, hi) => Math.max(lo, Math.min(hi, x | 0));
  if (dest !== undefined) out[o] = clamp(dest, 0, 70);
  if (start !== undefined) out[o + 1] = clamp(start, 0, 127);
  if (end !== undefined) out[o + 2] = clamp(end, 0, 127);
  if (depth !== undefined) out[o + 3] = clamp(depth, 0, 127);
  return out;
}
function clearKnob(payload, knob) {
  const out = new Uint8Array(payload), base = 204 + 17 * knob;
  out[base] = 0;
  for (let j = 0; j < 4; j++) out.set([0, 0, 127, 64], base + 1 + 4 * j);
  return out;
}

// Compatibilidad de un patch con un perfil (diferencia de preferencia, NO error de integridad).
function profileFit(payload, profileId) {
  const prof = PROFILES[profileId], a = auditMacros(payload);
  return prof.knobs.map((want, k) => {
    const knob = a.knobs[k];
    const exact = knob.slots.some((s) => s.state === 'active' && want.dests.includes(s.dest));
    const group = knob.groups.includes(want.group);
    return { knob: k, want, have: knob.summary, status: exact ? 'match' : group ? 'group' : knob.activeCount ? 'differs' : 'empty' };
  });
}

// Reordena macros completas (con todas sus rutas) para acercarse al perfil. Conserva todas las rutas.
function reorderToProfile(payload, profileId) {

// ---- core/midi.js ----
// Sesión con Circuit Tracks por Web MIDI.
// Protocolo según la Programmer's Reference Guide v3:
//  · Synth 1 canal 1, Synth 2 canal 2 · macros CC 80–87 · patch por Program Change 0–63.
//  · SysEx: ≥ 20 ms entre mensajes · respuestas solo por USB · PGM → esperar ~10 ms → Dump Request.
// Las salidas/entradas se inyectan (MIDIOutput/MIDIInput o simulacros) para poder probarlo sin hardware.


class CircuitSession {

  constructor(output, input, clock = () => performance.now(), channels = MIDI_MAP.synthChannels) {

  // No hay forma documentada de enviar patrones por SysEx; lo que sí está documentado es que el equipo sigue
  // Start/Stop/Clock/Song Position externos (con Clock Rx activo) y graba las notas que recibe con REC activado.
  // Secuencia: Stop → posición 0 → Start + 6 pulsos de reloj por paso → notas en el canal de destino → Stop exacto.
  // events: [{ t (paso), n, d (pasos), v, ch (0-15) }] · ccs: [{ t, num, v, ch }]

  // Reanálisis de toda la biblioteca: vuelve a clasificar con tus reglas y subcarpetas actuales y prepara cambios para revisar.

  // ---------- Variantes (nunca modifican el original) ----------
  async createVariant(parentId, payload, op, description, nameSuffix = '') {

    let pl = new Uint8Array(payload);
    if (nameSuffix) pl.set(encodeName((readName(pl).name + nameSuffix).slice(0, 16)), 0);
    const v = { ...structuredClone({ ...parent, payload: undefined }), id: uid(), kind: 'variant', parentId, rootId: parent.rootId || parent.id, fileId: null, payload: pl, fp: fingerprints(pl), name: readName(pl).name || parent.name, importedAt: now(), modifiedAt: now(), variantOp: op, variantNote: description, alsoFoundIn: [] };

    v.origin = op; v.originText = description; v.createdAt = now();
    this.patches.push(v); await this.store.putMany('patches', [v]);
    await this.log('variant', [v.id], null, { parentId, op }, `Variant created: ${description}`, true);
    this.emit(); return v;
  }
  async renameVariant(id, name) {

    const pl = new Uint8Array(p.payload); pl.set(encodeName(name), 0); p.payload = pl; p.fp = fingerprints(pl); p.name = readName(pl).name; p.modifiedAt = now();
    await this.store.putMany('patches', [p]); this.emit();

    for (const [o, v] of edits) { if (o < 0 || o > 339) throw new Error('Invalid offset'); const nv = Math.max(0, Math.min(127, v | 0)); if (pl[o] !== nv) { before[o] = pl[o]; pl[o] = nv; } }

  // Eliminar = a la papelera: el registro del historial guarda los patches enteros, sus huecos en los packs y sus

  async deletePatches(ids, silent = false) {
    const set = new Set(ids);
    const gone = this.patches.filter((p) => set.has(p.id));
    const snap = { patches: gone.map((p) => structuredClone(p)), slots: [], colls: [], orphans: [] };
    for (const b of this.banks) b.slots.forEach((x, i) => { if (set.has(x)) snap.slots.push([b.id, i, x]); });
    for (const c of this.collections) for (const x of c.ids || []) if (set.has(x)) snap.colls.push([c.id, x]);
    const orphans = this.patches.filter((p) => set.has(p.parentId) && !set.has(p.id));
    snap.orphans = orphans.map((o) => [o.id, o.parentId]);
    for (const o of orphans) { o.parentId = null; } // las variantes sobreviven
    this.patches = this.patches.filter((p) => !set.has(p.id));
    for (const b of this.banks) b.slots = b.slots.map((s) => (set.has(s) ? null : s));
    for (const c of this.collections) if (c.ids) c.ids = c.ids.filter((x) => !set.has(x));

// Estado de compatibilidad para la lista: native · legacy · converted · duplicate.

function compatibility(p, lib) {
  const inf = lib.info(p), fam = lib.families().of.get(p.id);

  if (dupOf) status = 'duplicate';
  const warn = inf.integrity.filter((x) => x.level !== 'info'), reserved = inf.integrity.filter((x) => /reservado/i.test(x.text));
  const macroBad = inf.macros.integrity, unknown70 = inf.macros.knobs.some((k) => k.slots.some((s) => s.state === 'active' && s.dest === 70));
  const checks = [
    p.header.product === 0x64 ? { level: 'ok', text: 'Circuit Tracks header (0x64)' } : { level: 'info', text: 'Original Circuit header (0x60): Components accepts it; it\'s exported with a Circuit Tracks header.' },
    warn.length ? { level: 'warn', text: `${warn.length} value(s) outside the documented range` } : { level: 'ok', text: 'Parameters within the documented range' },
    reserved.length ? { level: 'info', text: `${reserved.length} reserved byte(s) other than 0` } : { level: 'ok', text: 'Reserved bytes at 0' },
    macroBad.length ? { level: 'warn', text: `${macroBad.length} macro destination(s) outside 0–70` } : { level: 'ok', text: 'Macro destinations within 0–70' },
    unknown70 ? { level: 'info', text: 'Some macro uses code 70 (unknown meaning)' } : { level: 'ok', text: 'No unknown macro codes' },
    ...(p.repaired?.length ? [{ level: 'info', text: 'Recovered from a file with a non-standard header (' + p.repaired.map((r) => r === 'location' ? 'patch number 0xFF' : 'no final F7').join(', ') + '). The patch\'s 340 bytes are intact; a valid header is written on export.' }] : []),
    inf.an.decoded.nameNonPrintable ? { level: 'info', text: 'Name with non-printable characters' } : { level: 'ok', text: 'Readable ASCII name' },
    dupOf ? { level: 'warn', text: `Duplicate of «${lib.byId(dupOf)?.name}»` } : { level: 'ok', text: fam ? 'Belongs to a family, no exact duplicate' : 'No duplicates' }
  ];
  return { status, checks, dupOf };
}
const COMPAT_LABEL = { native: 'Tracks', legacy: 'Circuit OG', converted: 'Converted', duplicate: 'Duplicate' };

    { group: 'Data', level: compat.checks.some((c) => c.level === 'warn' && !/Duplicado/.test(c.text)) ? 'warn' : 'ok', text: compat.checks.some((c) => c.level === 'warn' && !/Duplicado/.test(c.text)) ? 'There are out-of-range values' : 'Parameters and macros within range' },
    { group: 'Duplicate', level: compat.dupOf ? 'warn' : 'ok', text: compat.dupOf ? 'Duplicate of another patch' : 'No exact duplicate' },
    { group: 'Macros', level: inf.macros.knobs.every((k) => k.activeCount) ? 'ok' : 'info', text: `${inf.macros.knobs.filter((k) => k.activeCount).length}/8 macros with effect · ${fitN}/8 fit your profile` },
    { group: 'Classification', level: m.category ? 'ok' : 'warn', text: m.category ? 'Saved category' : 'No saved category (proposal only)' },
    { group: 'Consistency', level: inf.cls.contradictions.length ? 'warn' : 'ok', text: inf.cls.contradictions.length ? `${inf.cls.contradictions.length} contradiction(s)` : 'No contradictions' },

    if (H('m-bright')) return { label: 'Bright', source: 'measured' };

    if (H('m-moving')) return { label: 'Moving', source: 'measured' };
  }
  if (p.meta.descriptors?.length) return { label: p.meta.descriptors[0], source: 'user' };
  const d = lib.info(p).cls.descriptors.find((x) => x.declared); if (d) return { label: d.label, source: 'name' };
  const f = lib.info(p).an.features, F = (id) => f.some((x) => x.id === id);
  if (F('acid-like')) return { label: 'Acid', source: 'params' };
  if (F('distortion') || F('filter-drive')) return { label: 'Driven', source: 'params' };
  if (F('low-cutoff')) return { label: 'Closed', source: 'params' };
  if (F('open-filter')) return { label: 'Open', source: 'params' };
  if (F('lfo-mod')) return { label: 'Moving', source: 'params' };
  return null;
}
const MOOD_SOURCE = { measured: 'measured', user: 'your tag', name: 'from the name', params: 'parameter hint' };

// Brillo estimado por parámetros (0–10): filtro LP + cutoff + envolvente, ondas, ruido. Es una ESTIMACIÓN.
function brightnessEstimate(payload) {
  const ft = payload[63], fq = payload[64], env = Math.max(0, payload[68] - 64), res = payload[66], routing = payload[60];
  let b = ft <= 1 ? fq / 127 * 7 + env / 63 * 1.5 : ft <= 3 ? 6 : 8;
  if (routing === 2) b = 8;
  if (payload[36] >= 14 || payload[45] >= 14) b += 0.5;
  if (payload[36] <= 1 && (payload[55] < 10 || payload[45] <= 1)) b -= 1.5;
  b += res / 127 * 0.8 + payload[57] / 127 * 1.2 + payload[100] / 127 * 1;
  return Math.max(0, Math.min(10, b));
}

// k-means (k-means++ determinista) sobre vectores de parámetros.
function kmeans(rows, k = 8, iters = 25) {
  const n = rows.length; if (!n) return { assign: [], centers: [] };
  k = Math.min(k, n);
  const d2 = (a, b) => { let s = 0; for (let i = 0; i < a.length; i++) s += (a[i] - b[i]) ** 2; return s; };
  const centers = [rows[0].slice()];
  while (centers.length < k) {
    let best = -1, bi = 0;
    for (let i = 0; i < n; i++) { const d = Math.min(...centers.map((c) => d2(rows[i], c))); if (d > best) { best = d; bi = i; } }
    centers.push(rows[bi].slice());
  }
  const assign = new Array(n).fill(0);
  for (let it = 0; it < iters; it++) {
    let moved = false;
    for (let i = 0; i < n; i++) { let bj = 0, bd = Infinity; for (let j = 0; j < k; j++) { const d = d2(rows[i], centers[j]); if (d < bd) { bd = d; bj = j; } } if (assign[i] !== bj) { assign[i] = bj; moved = true; } }
    for (let j = 0; j < k; j++) { const mem = rows.filter((_, i) => assign[i] === j); if (!mem.length) continue; centers[j] = centers[j].map((_, d) => mem.reduce((s, r) => s + r[d], 0) / mem.length); }
    if (!moved && it) break;
  }
  return { assign, centers };
}

// Datos de la franja de análisis de la biblioteca.
function libraryAnalysis(lib, profileId = 'techno', k = 8) {
  const ps = lib.patches, N = ps.length;
  const fam = lib.families(); let dup = 0;
  const dupIdsTmp = []; for (const f of fam.list) for (const m of f.members) if (m.rel && (m.rel.level === 'payload' || m.rel.level === 'synth')) { dup++; dupIdsTmp.push(m.id); }
  const tracks = ps.filter((p) => p.header.product === 0x64).length;
  const envBins = [0, 0, 0, 0, 0], envEdges = [0.1, 0.3, 1, 3];
  const briBins = new Array(10).fill(0), envIds = [[], [], [], [], []], briIds = Array.from({ length: 10 }, () => []); let mono = 0, consistent = 0, measuredBri = 0;
  for (const p of ps) {
    const len = approxSeconds(p.payload[73]) + (p.payload[72] < 30 ? approxSeconds(p.payload[71]) : 0);
    const eb = envEdges.findIndex((e) => len < e) === -1 ? 4 : envEdges.findIndex((e) => len < e); envBins[eb]++; envIds[eb].push(p.id);
    let b = brightnessEstimate(p.payload);
    const d = p.acoustic?.desc; if (d && !d.silent && d.f0 && d.centroid) { b = Math.max(0, Math.min(10, Math.log2(d.centroid / d.f0) * 2.5)); measuredBri++; }
    briBins[Math.min(9, Math.floor(b))]++; briIds[Math.min(9, Math.floor(b))].push(p.id);
    if (p.payload[32] <= 1) mono++;
    if (profileFit(p.payload, profileId).filter((f) => f.status === 'match' || f.status === 'group').length >= 6) consistent++;
  }
  let clusters = [];
  if (N >= 3) {
    const { assign } = kmeans(ps.map((p) => vectorize(p.payload)), Math.min(k, Math.max(2, Math.round(Math.sqrt(N / 2)))));
    const groups = new Map(); assign.forEach((c, i) => { if (!groups.has(c)) groups.set(c, []); groups.get(c).push(ps[i]); });
    clusters = [...groups.entries()].map(([c, members]) => {
      const counts = {}; for (const p of members) { const cat = p.meta.category || lib.info(p).cls.category || 'none'; counts[cat] = (counts[cat] || 0) + 1; }
      const top = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
      return { id: c, ids: members.map((p) => p.id), size: members.length, label: top[0] === 'none' ? 'Uncategorised' : CAT_LABEL[top[0]], purity: top[1] / members.length };
    }).sort((a, b) => b.size - a.size);
  }
  return { dupIds: dupIdsTmp, envIds, briIds, N, dup, dupPct: N ? dup / N : 0, tracks, legacy: N - tracks, envBins, envLabels: ['<0,1 s', '0,1–0,3', '0,3–1', '1–3', '>3 s'], briBins, measuredBri, mono, poly: N - mono, consistent, consistentPct: N ? consistent / N : 0, clusters };
}

// ---- core/packbuilder.js ----
// Constructor automático de Packs de 128 patches.
// Circuit Tracks muestra los patches en Patch View como 4 páginas de 32 (rejilla 8×4):
// cada página se dedica a un grupo de categorías para encontrar los sonidos tocando.
const DEFAULT_LAYOUT = [
  { label: 'Basses', cats: ['bass'] },
  { label: 'Leads · plucks · arps', cats: ['lead', 'pluck', 'arp', 'sequence', 'stab'] },
  { label: 'Pads · keys · chords', cats: ['pad', 'keys', 'chords', 'strings', 'brass', 'bell'] },
  { label: 'FX · drones · perc', cats: ['fx', 'drone', 'transition', 'perc'] }
];
const RANK = { manual: 5, corroborated: 4, textual: 3, technical: 2, ambiguous: 0, none: 0 };

// candidates: patches; lib: Library. opts: { layout, allowProposals, minCertainty, excludeDiscarded, onePerFamily, fillGaps }
function buildPack(candidates, lib, opts = {}) {
  const o = { layout: DEFAULT_LAYOUT, allowProposals: true, minCertainty: 'textual', excludeDiscarded: true, onePerFamily: true, fillGaps: false, ...opts };
  const excluded = { discarded: 0, family: 0, uncategorized: 0, lowCertainty: 0, overflow: 0 };
  const score = (p) => (p.meta.fav ? 100 : 0) + (p.meta.rating || 0) * 10 + (['listened', 'keep'].includes(p.meta.review) ? 6 : 0) + (p.acoustic ? 2 : 0) + (p.kind === 'variant' ? 1 : 0);
  // 1) Filtrado y un representante por familia (el mejor valorado).
  let list = candidates.filter((p) => {
    if (o.excludeDiscarded && p.meta.review === 'discard') { excluded.discarded++; return false; }
    const st = lib.changeState ? lib.changeState(p) : 'original';
    if (st === 'superseded' || st === 'draft') { excluded.changes = (excluded.changes || 0) + 1; return false; } // va la variante aceptada, no el original ni los borradores
    return true;
  });
  if (o.onePerFamily) {
    const { of } = lib.families(), best = new Map();
    for (const p of list) { const f = of.get(p.id); const key = f ? f.id : p.id; const cur = best.get(key); if (!cur || score(p) > score(cur)) best.set(key, p); }
    excluded.family = list.length - best.size; list = [...best.values()];
  }
  // 2) Categoría efectiva.
  const withCat = [];
  for (const p of list) {
    let cat = p.meta.category, sub = p.meta.subtype, cert = 'manual';
    if (!cat && o.allowProposals) { const c = lib.info(p).cls; if (c.category && RANK[c.certainty] >= RANK[o.minCertainty]) { cat = c.category; sub = c.subtype; cert = c.certainty; } else if (c.category) excluded.lowCertainty++; }
    if (!cat) { excluded.uncategorized++; continue; }
    withCat.push({ p, cat, sub, cert, s: score(p) });
  }
  // 3) Reparto por páginas de 32, ordenado por subtipo y valoración.
  const slots = new Array(128).fill(null), pages = [], blocks = [], used = new Set();
  o.layout.forEach((pg, i) => {
    const pool = withCat.filter((x) => pg.cats.includes(x.cat) && !used.has(x.p.id)).sort((a, b) => pg.cats.indexOf(a.cat) - pg.cats.indexOf(b.cat) || String(a.sub || '').localeCompare(String(b.sub || '')) || b.s - a.s || RANK[b.cert] - RANK[a.cert] || a.p.name.localeCompare(b.p.name));
    const take = pool.slice(0, 32);
    take.forEach((x, j) => { slots[i * 32 + j] = x.p.id; used.add(x.p.id); });
    excluded.overflow += pool.length - take.length;
    pages.push({ label: pg.label, placed: take.length, available: pool.length, fromProposals: take.filter((x) => x.cert !== 'manual').length });
    blocks.push({ from: i * 32, to: i * 32 + 31, label: pg.label, category: pg.cats[0], cats: [...pg.cats] });
  });
  // 4) Relleno opcional de huecos con lo que sobró (de cualquier categoría).
  if (o.fillGaps) { const rest = withCat.filter((x) => !used.has(x.p.id)).sort((a, b) => b.s - a.s); for (let i = 0; i < 128 && rest.length; i++) if (!slots[i]) { const x = rest.shift(); slots[i] = x.p.id; used.add(x.p.id); excluded.overflow--; } }
  return { slots, blocks, pages, excluded, placed: used.size };
}

// ---- core/anatomy.js ----
// Anatomía de un patch: bloques del flujo de señal, rutas de modulación (matriz y macros) y una
// «receta» en lenguaje llano. Flujo según Novation («Synth Engine Explained»):
// OSC 1/2 + ruido + ring → mezcla → pre-FX → drive → filtro → distorsión → chorus/phaser → EQ → post-FX.


const sgn = (v) => (v > 0 ? '+' : '') + v;
const pct = (v) => Math.round(v / 127 * 100) + ' %';
// Bloque del flujo al que afecta cada destino de la matriz.
const MOD_TARGET_BLOCK = ['osc1', 'osc1', 'osc2', 'osc1', 'osc2', 'osc1', 'osc2', 'osc1', 'osc2', 'noise', 'ring', 'drive', 'filter', 'filter', 'lfo1', 'lfo2', 'env1', 'env2'];
const SRC_BLOCK = { 4: 'vel', 5: 'key', 6: 'lfo1', 7: 'lfo1', 8: 'lfo2', 9: 'lfo2', 10: 'env1', 11: 'env2', 12: 'env3', 0: 'direct' };
const MACRO_GROUP_BLOCK = { osc: 'osc', mixer: 'mix', filter: 'filter', env: 'env', lfo: 'lfo', fx: 'fx', matrix: 'matrix', voice: 'voice' };

function macroTargetBlock(code) {
  const d = macroDestInfo(code), o = d.off;
  if (o === null || o === undefined) return 'unknown';
  if (o === 33) return 'voice'; if (o === 59) return 'out';
  if (o >= 37 && o <= 43) return 'osc1'; if (o >= 46 && o <= 52) return 'osc2';
  if (o === 54 || o === 55) return o === 54 ? 'osc1' : 'osc2'; if (o === 56) return 'ring'; if (o === 57) return 'noise';
  if (o === 61) return 'drive'; if (o >= 64 && o <= 68) return 'filter';
  if (o >= 70 && o <= 73) return 'env1'; if (o >= 75 && o <= 78) return 'env2'; if (o >= 79 && o <= 83) return 'env3';
  if (o >= 86 && o <= 90) return 'lfo1'; if (o >= 94 && o <= 98) return 'lfo2';
  if (o === 100) return 'dist'; if (o >= 102 && o <= 123) return 'chorus';
  if (o >= 126 && o <= 203) return 'matrix';

function anatomy(payload) {
  const d = decodePatch(payload), v = d.v;
  const lvl1 = v['mix.osc1'], lvl2 = v['mix.osc2'];
  const blocks = {
    osc1: { on: lvl1 > 0, title: 'OSC 1', line: `${OSC_WAVES[v['osc1.wave']]} · ${pct(lvl1)}` },
    osc2: { on: lvl2 > 0, title: 'OSC 2', line: `${OSC_WAVES[v['osc2.wave']]} · ${pct(lvl2)}` },
    noise: { on: v['mix.noise'] > 0, title: 'Noise', line: pct(v['mix.noise']) },
    ring: { on: v['mix.ring'] > 0, title: 'Ring', line: pct(v['mix.ring']) },
    drive: { on: v['filter.drive'] > 0, title: 'Drive', line: `${DRIVE_TYPES[v['filter.drivetype']]} · ${v['filter.drive']}` },
    filter: { on: true, title: 'Filter', line: `${FILTER_TYPES[v['filter.type']]} · ${v['filter.freq']} / Q ${v['filter.res']}` },
    dist: { on: v['fx.dist'] > 0, title: 'Distortion', line: `${DRIVE_TYPES[v['fx.disttype']]} · ${v['fx.dist']}` },
    chorus: { on: v['fx.chorus'] > 0, title: v['fx.chorustype'] ? 'Chorus' : 'Phaser', line: pct(v['fx.chorus']) },
    eq: { on: [106, 108, 110].some((o) => payload[o] !== 64), title: 'EQ', line: [106, 108, 110].map((o) => sgn(payload[o] - 64)).join(' / ') },
    out: { on: true, title: 'Output', line: `post ${sgn(v['mix.postfx'] - 64)}` },
    env1: { on: true, title: 'Env 1 · amp', line: `A ${fmtSeconds(approxSeconds(v['env1.a']))} · S ${pct(v['env1.s'])}` },
    env2: { on: Math.abs(v['filter.env2'] - 64) > 0 || d.matrix.some((m) => m.active && (m.s1 === 11 || m.s2 === 11)), title: 'Env 2 · filter', line: `A ${fmtSeconds(approxSeconds(v['env2.a']))} · D ${fmtSeconds(approxSeconds(v['env2.d']))}` },
    env3: { on: d.matrix.some((m) => m.active && (m.s1 === 12 || m.s2 === 12)), title: 'Env 3', line: `D ${fmtSeconds(approxSeconds(v['env3.d']))}` },
    lfo1: { on: d.matrix.some((m) => m.active && [6, 7].includes(m.s1) || m.active && [6, 7].includes(m.s2)), title: 'LFO 1', line: `${LFO_WAVES[v['lfo1.wave']]} · ${v['lfo1.ratesync'] ? 'sync ' + v['lfo1.ratesync'] : 'rate ' + v['lfo1.rate']}` },
    lfo2: { on: d.matrix.some((m) => m.active && [8, 9].includes(m.s1) || m.active && [8, 9].includes(m.s2)), title: 'LFO 2', line: `${LFO_WAVES[v['lfo2.wave']]} · ${v['lfo2.ratesync'] ? 'sync ' + v['lfo2.ratesync'] : 'rate ' + v['lfo2.rate']}` }
  };

  const routes = [];
  if (v['filter.env2'] !== 64) routes.push({ from: 'env2', to: 'filter', via: 'fixed', depth: v['filter.env2'] - 64, label: `Env 2 → frequency ${sgn(v['filter.env2'] - 64)}` });
  for (const m of d.matrix) if (m.active) {
    const from = SRC_BLOCK[m.s1] ?? 'direct', from2 = m.s2 ? SRC_BLOCK[m.s2] : null;
    routes.push({ from, from2, to: MOD_TARGET_BLOCK[m.dest] || 'unknown', via: 'matrix', slot: m.index, depth: m.depth - 64, label: `${MOD_SOURCES[m.s1] ?? '?'}${m.s2 ? ' × ' + (MOD_SOURCES[m.s2] ?? '?') : ''} → ${MOD_DESTS[m.dest] ?? '?'} ${sgn(m.depth - 64)}` });
  }
  for (const k of d.macros) for (const s of k.slots) if (s.state === 'active') routes.push({ from: 'm' + (k.index + 1), to: macroTargetBlock(s.dest), via: 'macro', knob: k.index, depth: s.depthSigned, label: `M${k.index + 1} → ${s.info.label} ${sgn(s.depthSigned)} (${s.start}–${s.end})` });
  for (const r of routes) if (blocks[r.to]) blocks[r.to].modulated = true;
  return { blocks, routes, recipe: recipe(payload, d), decoded: d };
}

function recipe(payload, d) {
  const v = d.v, out = [];
  // Voz
  const oct = v['voice.octave'] - 64;
  let voice = POLY_MODES[v['voice.poly']] === 'Poly' ? 'Polyphonic (up to 6 voices)' : v['voice.poly'] === 1 ? 'Monophonic with glide only in legato' : 'Monophonic';
  if (v['voice.portamento']) voice += `, portamento ${v['voice.portamento']}`;
  if (v['voice.preglide'] !== 64) voice += `, pre-glide ${sgn(v['voice.preglide'] - 64)} st`;
  if (oct) voice += `, keyboard octave ${sgn(oct)}`;
  out.push({ k: 'Voice', t: voice + '.' });
  // Osciladores
  const oscTxt = (n) => {
    const b = 'osc' + n, parts = [OSC_WAVES[v[b + '.wave']].toLowerCase()];
    const semi = v[b + '.semi'] - 64, cents = v[b + '.cents'] - 64;
    if (semi) parts.push(semi % 12 === 0 ? `${sgn(semi / 12)} oct` : `${sgn(semi)} st`);
    if (cents) parts.push(`${sgn(cents)} cents`);
    if (v[b + '.density']) parts.push(`density ${v[b + '.density']}${v[b + '.detune'] ? ' with detune ' + v[b + '.detune'] : ''}`);
    if (v[b + '.vsync']) parts.push(`vsync ${v[b + '.vsync']}`);
    if (v[b + '.wave'] >= 12 && v[b + '.pw'] !== 64) parts.push(`index ${sgn(v[b + '.pw'] - 64)}`);
    return `OSC ${n}: ${parts.join(', ')} at ${pct(v['mix.osc' + n])}`;
  };
  const oscs = [v['mix.osc1'] > 0 && oscTxt(1), v['mix.osc2'] > 0 && oscTxt(2)].filter(Boolean);
  if (v['mix.noise']) oscs.push(`noise at ${pct(v['mix.noise'])}`);
  if (v['mix.ring']) oscs.push(`ring mod 1×2 at ${pct(v['mix.ring'])}`);
  out.push({ k: 'Sources', t: (oscs.join('; ') || 'No audible sources (levels at 0)') + '.' });
  // Filtro
  const ft = FILTER_TYPES[v['filter.type']], env2 = v['filter.env2'] - 64;
  let f = `${ft}, frequency ${v['filter.freq']}, resonance ${v['filter.res']}`;
  if (v['filter.drive']) f += `, drive ${DRIVE_TYPES[v['filter.drivetype']].toLowerCase()} ${v['filter.drive']}`;
  if (env2) f += `. Envelope 2 ${env2 > 0 ? 'opens it' : 'closes it'} ${sgn(env2)} (ataque ${fmtSeconds(approxSeconds(v['env2.a']))}, decay ${fmtSeconds(approxSeconds(v['env2.d']))}, sustain ${pct(v['env2.s'])})`;
  if (v['filter.routing'] === 1) f += '. OSC 1 bypasses the filter';
  if (v['filter.routing'] === 2) f += '. The oscillators bypass the filter (only the noise goes through)';
  if (v['filter.track'] < 127) f += `. Keyboard tracking ${v['filter.track']}`;
  out.push({ k: 'Filter', t: f + '.' });
  // Amplitud
  const A = v['env1.a'], D = v['env1.d'], S = v['env1.s'], R = v['env1.r'];
  const shape = S <= 24 && A <= 8 ? 'percussive' : A >= 48 ? 'slow-onset' : S >= 100 ? 'sustained' : 'medium';
  out.push({ k: 'Amplitude', t: `Envelope ${shape}: attack ${fmtSeconds(approxSeconds(A))}, decay ${fmtSeconds(approxSeconds(D))}, sustain ${pct(S)}, release ${fmtSeconds(approxSeconds(R))}${v['env1.vel'] !== 64 ? `, velocity ${sgn(v['env1.vel'] - 64)}` : ''}. Approximate times.` });
  // Modulación
  const mods = d.matrix.filter((m) => m.active).map((m) => {
    let src = MOD_SOURCES[m.s1] ?? '?';
    const lfoN = [6, 7].includes(m.s1) ? 1 : [8, 9].includes(m.s1) ? 2 : 0;
    if (lfoN) { const w = LFO_WAVES[v[`lfo${lfoN}.wave`]].toLowerCase(), sy = v[`lfo${lfoN}.ratesync`]; src += ` (${w}, ${sy ? 'synced ' + sy : 'rate ' + v[`lfo${lfoN}.rate`]}${decodeLfoFlags(payload[lfoN === 1 ? 91 : 99]).keySync ? ', key sync' : ''})`; }
    return `${src}${m.s2 ? ' × ' + (MOD_SOURCES[m.s2] ?? '?') : ''} → ${MOD_DESTS[m.dest] ?? '?'} ${sgn(m.depth - 64)}`;
  });
  out.push({ k: 'Modulation', t: mods.length ? mods.join('; ') + '.' : 'No active routes in the matrix: the timbre only moves with the envelopes and macros.' });
  // Efectos
  const fx = [];
  if (v['fx.dist']) fx.push(`distortion ${DRIVE_TYPES[v['fx.disttype']].toLowerCase()} ${v['fx.dist']}`);
  if (v['fx.chorus']) fx.push(`${v['fx.chorustype'] ? 'chorus' : 'phaser'} ${v['fx.chorus']} (rate ${v['fx.chorusrate']}, feedback ${sgn(v['fx.chorusfb'] - 64)})`);
  const eq = [[106, 'low'], [108, 'mid'], [110, 'high']].filter(([o]) => payload[o] !== 64).map(([o, n]) => `${n} ${sgn(payload[o] - 64)}`);
  if (eq.length) fx.push('EQ ' + eq.join(', '));
  out.push({ k: 'Effects', t: fx.length ? fx.join('; ') + '.' : 'No active patch effects.' });
  // Macros
  const mac = d.macros.filter((k) => k.active).map((k) => `M${k.index + 1}: ${k.slots.filter((s) => s.state === 'active').map((s) => `${s.info.label} ${sgn(s.depthSigned)}`).join(' + ')}`);
  out.push({ k: 'Macros', t: mac.length ? mac.join(' · ') + '.' : 'No macro has any effect.' });
  return out;
}

// ---- core/organize.js ----
// Orden de la colección: «mismo synth con otros ajustes», registro/octava y plan de carpetas para el disco.




// ---------- Arquitectura ----------
// Lo que define «qué synth es» y no «cómo está ajustado»: modo de voz, formas de onda y fuentes audibles,
// tipo y ruta de filtro, presencia de drive/distorsión/chorus, topología de la matriz (fuentes → destinos)
// y destinos de las macros. Los valores continuos (cutoff, tiempos, profundidades…) se ignoran.
function architecture(payload) {
  const d = decodePatch(payload), v = d.v, on = (x) => (x > 0 ? 1 : 0);
  const parts = [
    v['voice.poly'] === 2 ? 'poly' : 'mono',
    on(v['mix.osc1']) ? 'o1:' + v['osc1.wave'] : 'o1:-', on(v['mix.osc2']) ? 'o2:' + v['osc2.wave'] : 'o2:-',
    'n' + on(v['mix.noise']), 'r' + on(v['mix.ring']), 'f' + v['filter.type'] + '/' + v['filter.routing'],
    'dr' + on(v['filter.drive']), 'di' + on(v['fx.dist']), 'ch' + (v['fx.chorus'] ? v['fx.chorustype'] : '-'),
    'mx' + d.matrix.filter((m) => m.active).map((m) => `${m.s1}.${m.s2}>${m.dest}`).sort().join(','),

// ---- core/song.js ----
// Canciones completas para el Circuit Tracks.
// Cada pista recibe 8 patrones con un papel fijo, como en la herramienta de la Rhythm. v3.4: más repetición, como en
// la pista: 1 intro/break · 2 A · 3 A (igual) · 4 A' (A con un remate sutil en el último tiempo de la batería; synths
// iguales) · 5 fill · 6 B · 7 build · 8 silencio. El groove encadena A A A' fill (2–5); con pista reloj, las escenas
// del medio de una sección tocan solo A (2–3) y el remate y el fill quedan para la última. Una estrategia de arreglo encadena secciones; cada sección es una escena del Circuit
// con la cadena de patrones de cada pista. Sale como escucha en el equipo, grabación guiada por patrones,
// .mid de la canción (una pista por pista del Circuit) y hoja de ruta para montar las escenas.

// Orden del Circuit Tracks (Patterns View y Mixer): Synth 1, Synth 2, MIDI 1, MIDI 2, Drum 1–4
const SONG_TRACKS = [
  { id: 'synth1', label: 'Synth 1', role: 'Bass', kind: 'synth', dest: 'synth1' },
  { id: 'synth2', label: 'Synth 2', role: 'Lead / stabs', kind: 'synth', dest: 'synth2' },
  { id: 'midi1', label: 'MIDI 1', role: 'Pad / chords', kind: 'synth', dest: 'midi1' },
  { id: 'midi2', label: 'MIDI 2', role: 'Drone / FX', kind: 'synth', dest: 'midi2' },
  { id: 'drum1', label: 'Drum 1', role: 'Kick', kind: 'drum', lane: 0 },
  { id: 'drum2', label: 'Drum 2', role: 'Snare / clap', kind: 'drum', lane: 1 },
  { id: 'drum3', label: 'Drum 3', role: 'Hats', kind: 'drum', lane: 2 },
  { id: 'drum4', label: 'Drum 4', role: 'Percussion', kind: 'drum', lane: 3 },

const SLOT_ROLES = ['Intro / break', 'Groove A', 'Groove A (copy)', "Groove A'", 'Fill', 'Groove B', 'Build', 'Silence'];
// cadenas que puede tocar una pista en una escena (patrones 1–8 del Circuit = índices 0–7)
// groove = A A A' fill · groove2 = A A · fillbuild = A' fill · intro y break comparten el patrón 1
const SONG_RANGES = { light: [0, 0], groove: [1, 4], groove2: [1, 2], alt: [5, 5], fillbuild: [3, 4], build: [6, 6], break: [0, 0], off: [7, 7] };
const MID_RANGE = [1, 2]; // escenas del medio de una sección: solo A
const SG_MIX = { '-': 'off', l: 'light', g: 'groove', h: 'groove2', a: 'alt', f: 'fillbuild', b: 'build', k: 'break' };

// Estilo de cada synth según el estilo de batería (se puede cambiar)
const SONG_SYNTH_STYLES = {
  techno: ['offbeat', 'stab', 'pad', 'drone'], rumble: ['rolling', 'stab', 'pad', 'drone'], house: ['offbeat', 'chords', 'pad', 'drone'],
  minimal: ['offbeat', 'perc', 'pad', 'drone'], breakbeat: ['acid', 'lead', 'chords', 'drone'], electro: ['acid', 'arp', 'pad', 'drone'],
  industrial: ['rolling', 'stab', 'drone', 'drone'], halftime: ['sub', 'pad', 'pad', 'drone'], euclid: ['perc', 'arp', 'pad', 'drone'],

// ---------- utilidades ----------
const sgNotes = (pat) => (pat?.notes || []).map((e) => ({ ...e }));

  const iv = (SCALES[scale] || SCALES.minor).iv, L = iv.length;
  return (d) => oct + root + iv[((d % L) + L) % L] + 12 * Math.floor(d / L);
}
const sgVel = (v) => Math.max(1, Math.min(127, Math.round(v)));

// ---------- synths: los 8 papeles ----------
function synthSlots(t, o, R) {
  const N = o.steps, style = o.styles[t];
  const base = { v: 1, kind: undefined, root: o.root, scale: o.scale, steps: N, tempo: o.tempo, swing: 0, style };
  const gen = (st, seed, extra = {}) => generatePattern({ style: st, root: o.root, scale: o.scale, steps: N, tempo: o.tempo, seed, density: o.density === 0.5 ? null : o.density, ...extra });

  const alt = gen(t === 0 ? altStyle : style, o.seed * 13 + t + 101);

  const sustained = ['pad', 'drone', 'chords', 'sub'].includes(style);

  const fillN = sgNotes(main).filter((e) => e.t < N - 4).map((e) => ({ ...e, d: Math.min(e.d, N - 4 - e.t) }));
  if (t === 0) { fillN.push({ t: N - 3, n: deg(7), d: 0.5, v: 118 }); fillN.push({ t: N - 1, n: deg(0) + 12, d: 0.5, v: 110 }); }

// ---------- batería: los 8 papeles, un patrón por pista Drum ----------
function drumSlots(o, R) {
  const N = o.steps;

  const main = g(o.seed), alt0 = g(o.seed + 101, Math.min(1, o.density + 0.15));

    const alt = l === 0 ? m.map((e) => ({ ...e })) : lane(alt0, l);
    let fill = m.filter((e) => e.t < N - 4);
    if (l === 0) fill = m.filter((e) => e.t < N - 2);
    if (l === 1) for (let i = N - 4; i < N; i++) fill.push(H(1, i, 55 + (i - N + 4) * 20));
    if (l === 2) for (let i = N - 4; i < N; i++) fill.push(H(2, i, 70 + (i - N + 4) * 12));

    if (l === 0) for (let i = 0; i < N - 4; i += 4) build.push(H(0, i, 118));
    if (l === 1) for (let i = 0; i < N; i++) if (i < N / 2 ? i % 2 === 0 : true) build.push(H(1, i, ramp(i)));
    if (l === 2) for (let i = 0; i < N; i++) build.push(H(2, i, 50 + (70 * i) / (N - 1)));
    if (l === 3) for (let i = 2; i < N - 2; i += 4) build.push(H(3, i, 80 + (i / N) * 30));

    const has = (x) => m.some((e) => Math.round(e.t) === x);

    if (l === 2) { if (!has(N - 3)) turn.push(H(2, N - 3, 68)); if (!has(N - 1)) turn.push(H(2, N - 1, 76)); }
    if (l === 3) { for (let i = turn.length - 1; i >= 0; i--) if (Math.round(turn[i].t) === N - 4) turn.splice(i, 1); if (!has(N - 2)) turn.push(H(3, N - 2, 86)); }

}

// opts: { style, seed, steps (16|32), density, root (0–11), scale, tempo, styles[4], locked:Set, prev }
function songFamily(opts = {}) {
  const o = { style: 'techno', seed: 1, steps: 16, density: 0.5, root: 9, scale: 'minor', tempo: 128, locked: null, prev: null, ...opts };
  o.styles = opts.styles || SONG_SYNTH_STYLES[o.style] || SONG_SYNTH_STYLES.techno;

// En el Circuit Tracks una escena dura lo que su cadena de patrones más larga y, dentro de una cadena de escenas, cada
// escena suena UNA vez (las pistas con cadenas más cortas dan vueltas dentro de ella). Las cadenas son de patrones

//  · una sección larga se toca con varias escenas iguales seguidas (copias), como mucho 16 escenas en total;
//  · la duración de cada escena la fija una pista libre (MIDI 2 o MIDI 1 sin sinte) encadenando patrones vacíos de

// Notas de toda la canción tal como las tocará el Circuit: escena a escena, cada pista da vueltas a su cadena desde el

function songNotes(fam, tl, { onlyTrack = null, fromBar = 0 } = {}) {
  const ev = [], N = fam.steps;

      const chain = []; for (let k = tr.from; k <= tr.to; k++) chain.push(fam.tracks[t][k]);

// core/mapsel.js — v3.5: seleccionar en el mapa (los más parecidos y por zona), como en la herramienta de la Rhythm.
// El parecido se mide en los parámetros de síntesis normalizados (media 0, desviación 1 por parámetro), así ningún
// parámetro pesa más solo por su escala.

// entries: [[id, vector]] → Map id → vector normalizado

  const d = entries[0][1].length, n = entries.length, mean = new Float64Array(d), sd = new Float64Array(d);
  for (const [, v] of entries) for (let i = 0; i < d; i++) mean[i] += v[i] / n;
  for (const [, v] of entries) for (let i = 0; i < d; i++) sd[i] += (v[i] - mean[i]) ** 2 / n;
  for (let i = 0; i < d; i++) sd[i] = Math.sqrt(sd[i]) || 1;

// ---- core/lab.js ----
// core/lab.js — v3.8: laboratorio de sonido. Patches nuevos a partir de los que ya tienes:
//  · mutar:   variaciones de un patch, con la intensidad y las partes que elijas
//  · cruzar:  hijos de dos (o más) patches, bloque a bloque (osciladores, filtro, envolventes, LFO, efectos, matriz)
//  · mezclar: un punto intermedio entre A y B (los valores continuos se interpolan; los de tipo cambian a mitad)

// para que los knobs sigan haciendo lo mismo. Los resultados pasan por un saneado que evita patches mudos.

const LAB_GROUPS = { osc: ['osc1', 'osc2', 'mixer'], filter: ['filter'], env: ['env1', 'env2', 'env3'], mod: ['lfo1', 'lfo2'], fx: ['fx', 'eq'] };

const LAB_AMOUNTS = { subtle: { sd: 0.06, flip: 0 }, medium: { sd: 0.14, flip: 0.1 }, wild: { sd: 0.3, flip: 0.35 } };
const LAB_BLOCKS = ['osc1', 'osc2', 'mixer', 'filter', 'env1', 'env2', 'env3', 'lfo1', 'lfo2', 'fx', 'eq', 'matrix'];

// Se conservan siempre: la afinación (semitonos, bend), la voz y los bits de las LFO
const KEEP = new Set(['osc1.semi', 'osc2.semi', 'osc1.bend', 'osc2.bend', 'lfo1.flags', 'lfo2.flags']);

// paso bajo que no quede cerrado del todo. Lo que estaba así en el patch de partida se respeta.
function labSanitize(out, ref) {
  const lv = (b) => Math.max(b[54], b[55], b[56], b[57]);

  if (out[71] < 12 && out[72] < 12 && !(ref[71] < 12 && ref[72] < 12)) out[71] = Math.max(ref[71], 30); // un clic sin cuerpo

// Hijo de varios padres, bloque a bloque. El primero es el patch de partida (nombre, categoría, voz y macros).
// Devuelve { payload, from: {bloque: índice del padre} }.

  for (const p of PARAMS) { if (from[p.group] != null) out[p.off] = parents[from[p.group]][p.off]; }

  for (let o = MATRIX[0]; o < MATRIX[1]; o += 4) {

function buildQueue(src = S.qsrc) {
  S.qsrc = src; let list;
  if (src === 'pending') list = lib.patches.filter((p) => p.meta.review === 'pending');
  else if (src === 'uncategorized') list = lib.patches.filter((p) => !p.meta.category);
  else if (src === 'filter') list = lib.patches.filter((p) => lib.matches(p, { ...S.q, features: S.q.features?.length ? S.q.features : undefined }));
  else if (src === 'selection') list = [...S.multi].map((id) => lib.byId(id)).filter(Boolean);
  else if (src === 'unmeasured') list = lib.patches.filter((p) => !p.acoustic);
  else if (src.startsWith('col:')) { const c = lib.collections.find((x) => x.id === src.slice(4)); list = c ? lib.patches.filter((p) => c.kind === 'manual' ? c.ids.includes(p.id) : lib.matches(p, c.query)) : []; }
  else list = lib.patches;
  // Una sola escucha por familia: el resto se revisa desde Comparar.
  const { of } = lib.families(), seen = new Set();
  list = list.filter((p) => { const f = of.get(p.id); if (!f) return true; if (seen.has(f.id)) return false; seen.add(f.id); return true; });
  const cur = S.queue[S.qi];
  S.queue = list.map((p) => p.id); S.qi = Math.max(0, cur ? S.queue.indexOf(cur) : 0);
}

async function trashIds(ids) {
  ids = ids.filter((id) => lib.byId(id)); if (!ids.length) return;
  const set = new Set(ids), name = ids.length === 1 ? lib.byId(ids[0]).name : `${ids.length} patches`;
  if (S.sel && set.has(S.sel)) { const rows = (S.rows || []).filter((r) => !r.header && r.p); const i = rows.findIndex((r) => r.p.id === S.sel); const nx = rows.slice(i + 1).find((r) => !set.has(r.p.id)) || rows.slice(0, Math.max(0, i)).reverse().find((r) => !set.has(r.p.id)); S.sel = nx ? nx.p.id : null; }
  const atQ = S.queue.indexOf(S.queue[S.qi]);
  await lib.deletePatches(ids);
  for (const id of ids) S.multi.delete(id);
  S.queue = S.queue.filter((id) => !set.has(id)); S.qi = Math.max(0, Math.min(atQ, S.queue.length - 1));
  S.rowsKey = ''; rerender();
  toastAct(`${name} to the bin`, 'Undo · Ctrl Z', undoLast);
  if (S.view === 'audition' && S.autoPlay && S.queue.length) audPlay();
}
async function undoLast() {

  S.rowsKey = ''; toast('Undone: ' + h.text); rerender();
}

function drawMap() {
  const cv = $('#mapCanvas'); if (!cv) return;
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1; cv.width = r.width * dpr; cv.height = r.height * dpr;
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  const xy = lib.map(), pts = [];
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const [, [x, y]] of xy) { minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y); }
  // Escala común en ambos ejes: no se exagera la componente con menos varianza.
  const pad = 18, W = r.width - 2 * pad, H = r.height - 2 * pad, k = Math.min(W / (maxX - minX || 1), H / (maxY - minY || 1));
  const ox = pad + (W - (maxX - minX) * k) / 2, oy = pad + (H - (maxY - minY) * k) / 2, sx = (x) => ox + (x - minX) * k, sy = (y) => oy + (y - minY) * k;
  g.strokeStyle = '#34373b'; g.lineWidth = 1; for (let i = 1; i < 4; i++) { g.beginPath(); g.moveTo(pad + W * i / 4, pad); g.lineTo(pad + W * i / 4, pad + H); g.moveTo(pad, pad + H * i / 4); g.lineTo(pad + W, pad + H * i / 4); g.stroke(); }
  const colorOf = (p) => {
    if (S.mapColor === 'category') return MAP_COLORS[effCat(p) || 'none'] || '#888';
    if (S.mapColor === 'certainty') { const c = p.meta.category ? 'manual' : lib.info(p).cls.certainty; return { manual: '#4fd18b', corroborated: '#a7c9a0', textual: '#b9b8b3', technical: '#8a8c8f', ambiguous: '#ffb340', none: '#4a4e54' }[c]; }
    if (S.mapColor === 'review') return { pending: '#5c5f64', reviewed: '#b9b8b3', listened: '#4fd18b', keep: '#a7c9a0', discard: '#ff5a5a' }[p.meta.review] || '#888';
    return p.acoustic ? '#4fd18b' : '#4a4e54';
  };
  const hl = mapHLSet();
  for (const p of lib.patches) {
    const c = xy.get(p.id); if (!c) continue;
    if (S.mapColor === 'category' && S.mapHidden.has(effCat(p) || 'none')) continue;
    const X = sx(c[0]), Y = sy(c[1]); pts.push({ id: p.id, X, Y });
    const on = !hl || hl.has(p.id);
    g.beginPath(); g.arc(X, Y, (p.meta.fav ? 4.5 : 3.2) * (hl && on ? 1.25 : 1), 0, Math.PI * 2); g.fillStyle = colorOf(p); g.globalAlpha = hl ? (on ? 0.95 : 0.12) : 0.85; g.fill(); g.globalAlpha = 1;
  }
  // seleccionados (los mismos que en la biblioteca)
  if (S.multi.size) { g.strokeStyle = '#ebe8e3'; g.lineWidth = 1.2; for (const q of pts) if (S.multi.has(q.id)) { g.beginPath(); g.arc(q.X, q.Y, 6, 0, Math.PI * 2); g.stroke(); } }
  const sel = pts.find((q) => q.id === S.sel);
  if (sel) { g.beginPath(); g.arc(sel.X, sel.Y, 8, 0, Math.PI * 2); g.strokeStyle = '#ff6a2b'; g.lineWidth = 2; g.stroke(); }
  mapSelDraw(g);
  S.mapPts = pts;
  const near = (e) => { const b = cv.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top; let best = null, bd = 100; for (const q of S.mapPts) { const d = (q.X - x) ** 2 + (q.Y - y) ** 2; if (d < bd) { bd = d; best = q; } } return { best, x, y }; };
  mapSelInstall(cv);
  cv.onmousemove = (e) => { if (S._mdrag?.moved) { $('#mapTip').style.display = 'none'; return; } const { best, x, y } = near(e), tip = $('#mapTip'); if (!best) { tip.style.display = 'none'; return; } const p = lib.byId(best.id); tip.textContent = `${p.name} · ${catName(effCat(p)) || 'uncategorised'}`; tip.style.display = 'block'; tip.style.left = Math.min(x + 12, cv.clientWidth - 180) + 'px'; tip.style.top = y + 10 + 'px'; };
  cv.onmouseleave = () => { $('#mapTip').style.display = 'none'; };
  cv.onclick = (e) => { if (S._mdragDone) { S._mdragDone = false; return; } const { best } = near(e); if (best) { S.sel = best.id; rerender(); } };
}

function statsOf() {
  const st = { cats: {}, user: 0, cert: {}, mono: 0, longEnv: 0, dist: 0, lfo: 0, inactive: 0, integrity: 0, contr: 0, pending: 0, seq: 0, variants: 0, measured: 0, mdark: 0, mlow: 0 };
  for (const p of lib.patches) {
    const i = lib.info(p), c = i.cls, H = (id) => i.an.features.some((f) => f.id === id), HM = (id) => p.acoustic?.features?.some((f) => f.id === id);
    const cat = p.meta.category || c.category || (c.candidates ? 'ambiguous' : 'none');
    st.cats[cat] = (st.cats[cat] || 0) + 1; if (p.meta.category) st.user++;
    st.cert[c.certainty] = (st.cert[c.certainty] || 0) + 1;
    if (H('mono')) st.mono++; if (H('long-release') || H('slow-attack')) st.longEnv++; if (H('distortion') || H('filter-drive')) st.dist++; if (H('lfo-mod')) st.lfo++; if (H('fast-attack') && H('short-decay')) st.seq++;
    if (i.macros.knobs.some((k) => !k.activeCount)) st.inactive++; if (i.integrity.some((x) => x.level !== 'info')) st.integrity++; if (c.contradictions.length) st.contr++;
    if (p.meta.review === 'pending') st.pending++; if (p.kind === 'variant') st.variants++; if (p.acoustic) st.measured++; if (HM('m-dark')) st.mdark++; if (HM('m-low')) st.mlow++;
  }
  return st;
}

}
function openSession() {

}
async function getStream() {
  if (S.dev.stream && S.dev.streamId === S.dev.audioId) return S.dev.stream;
  S.dev.stream?.getTracks().forEach((t) => t.stop());
  S.dev.stream = await navigator.mediaDevices.getUserMedia({ audio: { deviceId: S.dev.audioId ? { exact: S.dev.audioId } : undefined, echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 } });

}
const WORKLET = `class R extends AudioWorkletProcessor{process(i){const c=i[0]&&i[0][0];if(c)this.port.postMessage(c.slice(0));return true}}registerProcessor('ctpl-rec',R);`;
