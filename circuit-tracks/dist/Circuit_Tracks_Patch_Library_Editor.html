// ---------- escucha en el equipo ----------
let sgTimer = 0, sgRaf = 0;
async function sgLoadPatches() {
  const s = sgState(), ss = S.dev.session; let wait = 0;
  for (const t of [0, 1]) { const p = s.patches[t] && lib.byId(s.patches[t]); if (p && ss) { const v = lib.replacementOf?.(p) || p; ss.sendPatch(v.payload, t); wait = (S.dev.patchDelay ?? 80) + 60; } }
  if (wait) await waitMs(wait);
}
function sgStopNow() {
  clearInterval(sgTimer); cancelAnimationFrame(sgRaf); S.sgPlaying = false;
  const ss = S.dev.session; if (ss) ss.stopChannels([...new Set([...sgChannels(), S.dev.chDrum ?? 9])]);
  const ln = $('#sgLine'); if (ln) ln.hidden = true;
}
async function sgPlay(fromSection = 0) {
  const ss = S.dev.session; if (!ss) return;
  sgStopNow();
  const s = sgState(), tl = sgTl(), sec = tl.sections.find((x) => x.index === +fromSection) || tl.sections[0], fromBar = sec.start;
  const ch = sgChannels(), dch = S.dev.chDrum ?? 9, step = 60000 / s.tempo / 4;
  await sgLoadPatches();
  const notes = songNotes(s.fam, tl, { fromBar }), t0 = ss.clock() + 150, base = fromBar * 16;
  const msgs = notes.map((e, i) => {
    const tr = SONG_TRACKS[e.track], c = tr.kind === 'drum' ? dch : ch[e.track], n = tr.kind === 'drum' ? DRUM_NOTES[tr.lane] : e.n;
    const on = t0 + (e.t - base) * step; let offT = on + Math.max(15, Math.min(e.d, 16) * step - 3);
    for (let j = i + 1; j < notes.length && notes[j].t < e.t + e.d; j++) if (notes[j].track === e.track && notes[j].n === e.n) { offT = Math.min(offT, t0 + (notes[j].t - base) * step - 1); break; }
    return { on, off: Math.max(on + 5, offT), c, n, v: Math.max(1, Math.min(127, e.v)) };
  });
  let k = 0; S.sgPlaying = true;
  const pump = () => { const until = ss.clock() + 1500; while (k < msgs.length && msgs[k].on < until) { const m = msgs[k++]; ss.raw([0x90 | m.c, m.n, m.v], m.on); ss.raw([0x80 | m.c, m.n, 0], m.off); } };
  pump(); sgTimer = setInterval(pump, 400);
  const total = tl.bars * 16;
  const tick = () => {
    if (!S.sgPlaying) return;
    const pos = base + (ss.clock() - t0) / step;
    if (pos >= total) { sgStopNow(); rerender(); return; }
    const ln = $('#sgLine'), lbl = $('#sgPos');
    if (ln) { ln.hidden = false; ln.style.left = `calc(132px + (100% - 132px) * ${Math.max(0, pos) / total})`; }
    if (lbl) lbl.textContent = `compás ${Math.max(1, Math.floor(pos / 16) + 1)} de ${tl.bars}`;
    sgRaf = requestAnimationFrame(tick);
  };
  rerender(); tick();
}

// ---------- grabación guiada ----------
async function sgRecord() {
  const ss = S.dev.session; if (!ss || S.recording) return;
  const s = sgState(), tl = sgTl(), off = sgOff(), slots = usedSlots(tl), on = SONG_TRACKS.filter((_, t) => !off.has(t)).map((x) => x.label);
  const ok = await modal('Grabar la canción en el Circuit Tracks', html`<ol class="steps">
    <li>Abre un <b>proyecto vacío</b> en el Circuit: la grabación se suma a lo que haya.</li>
    <li>Pon la escala del proyecto en <b>${songKeyName(s.root, s.scale)}</b> (Scale View) o en <b>Chromatic</b>, y el tempo en <b>${s.tempo} BPM</b>.</li>
    ${s.steps === 32 ? html`<li><b>32 pasos:</b> en cada pasada la herramienta te recordará alargar el patrón a 32 pasos en cada pista antes de grabar. Si no, el Circuit lo toca de 16 y la segunda mitad se graba encima de la primera.</li>` : html`<li>Patrones de <b>16 pasos</b>: no hay que preparar nada (es la longitud del proyecto vacío).</li>`}
    <li>Deja las pistas sin cadenas (un solo patrón elegido en cada una) mientras grabas.</li>
    <li>Comprueba que <b>Clock Rx</b> está activado (Setup View; viene activado de fábrica).</li>
    <li>Después, para cada patrón, la herramienta te pedirá que lo elijas en todas las pistas (${on.join(', ')}) en Patterns View y que pulses <b>REC</b> (sin Play).</li>
    ${s.patches.some(Boolean) ? html`<li>Antes de empezar se cargan los patches elegidos en Synth 1 y 2 (solo RAM: guarda el proyecto con Save al acabar).</li>` : ''}</ol>`,
  [{ label: 'Cancelar', value: false }, { label: 'Empezar', primary: true, value: true }]);
  if (!ok) return;
  sgStopNow(); patStopNow();
  await sgLoadPatches();
  const chans = sgChannels(), dch = S.dev.chDrum ?? 9;
  for (let i = 0; i < slots.length; i++) {
    const k = slots[i];
    const go = await modal(`Patrón ${k + 1} · ${SLOT_ROLES[k]}`, html`<p class="note">Pasada ${i + 1} de ${slots.length}.</p><ol class="steps">
      <li>En Patterns View, elige el <b>patrón ${k + 1}</b> en cada pista: ${on.join(', ')}.</li>
      ${s.steps === 32 ? html`<li>En cada una de esas pistas (con su patrón ${k + 1} a la vista), mantén <b>Duplicate</b> y pulsa <b>Step Page</b>: el patrón pasa a 32 pasos (está vacío, no copia nada). Si Step Page ya alterna azul y naranja, ya mide 32.</li>` : ''}
      <li>Pulsa <b>REC</b> en el Circuit (sin Play).</li>
      <li>Pulsa «Grabar patrón ${k + 1}».</li></ol>
      ${k === 2 ? html`<p class="note">El patrón 3 es igual que el 2 (así el groove repite A). Puedes grabarlo igual o, más rápido, copiarlo en el Circuit: en Patterns View, mantén <b>Duplicate</b>, pulsa el patrón 2 y después el 3 en cada pista, y salta esta pasada.</p>` : ''}`,
    [{ label: 'Terminar aquí', value: 'stop' }, { label: 'Saltar', value: 'skip' }, { label: `● Grabar patrón ${k + 1}`, primary: true, value: 'rec' }]);
    if (!go || go === 'stop') break;
    if (go === 'skip') continue;
    const events = slotEvents(s.fam, k, { channels: chans, drumChannel: dch, off });
    const r = ss.recordPattern(events, { tempo: s.tempo, steps: s.steps, swing: 0, lead: 250 });
    S.recording = true; rerender();
    toast(`● Grabando el patrón ${k + 1} (${s.steps} pasos)…`, Math.max(1500, r.end - performance.now()));
    await waitMs(Math.max(0, r.end - performance.now() + 150));
    S.recording = false; s.recorded[k] = true; sgSave(); rerender();
  }
  const done = slots.filter((k) => s.recorded[k]).length;
  if (done) await modal('Patrones grabados', html`<p>${done} de ${slots.length} patrones grabados. Ahora monta las escenas con la hoja de ruta (la tienes en la sección y en «Descargar hoja de ruta») y guarda el proyecto con <b>Save</b>.</p>`);
}

// ---------- hoja de ruta y .mid ----------
function sgSheet() {
  const s = sgState(), tl = sgTl(), L = SG_SEC(), off = sgOff(), st = SG_STRAT[s.strategy];
  const cols = SONG_TRACKS.map((tr, t) => (off.has(t) ? null : tr.label)), w = 9;
  const keep = (t) => !off.has(t) || t === tl.timer;
  const rows = songRoadmap(s.fam, tl, s.tempo).map((r) => [String(r.scene).padStart(3), ((L[r.id] || r.id) + (r.of > 1 ? ` ${r.copy + 1}/${r.of}` : '') + (r.end ? ' ' + '· remate' : '')).padEnd(18), String(r.bars).padStart(4), ...(r.same ? [`= escena ${r.same} (Duplicate)`] : r.chains.map((c, t) => (keep(t) ? (c || '8').padEnd(w) : null)))].filter((x) => x != null).join('  '));
  const head = ['Esc.', 'Sección'.padEnd(18), 'Comp.', ...SONG_TRACKS.map((tr, t) => (keep(t) ? tr.label.padEnd(w) : null)).filter(Boolean)].join('  ');

    'Patrones de cada pista (los graba la herramienta):', ...slots, '  8  Silencio (vacío)', '',
    'Escenas (cadena de patrones de cada pista; 8 = silencio; ⏱ = patrones vacíos que marcan la duración):', head, ...rows, '',
    `Encadena las escenas 1–${tl.scenes.length}: mantén la 1 y pulsa la ${tl.scenes.length}. Cada escena suena una vez.`, '', 'Consejos', ...st.tips.map((x) => '- ' + x), ...SG_TIPS.map((x) => '- ' + x)].join('\n');
  download(`Hoja de ruta - ${safeFile(st.name + ' ' + s.seed)}.txt`, txt, 'text/plain');
}
function sgMidi() {
  const s = sgState(), tl = sgTl(), st = SG_STRAT[s.strategy];

Object.assign(A, {
  sgStrat: (el) => { const s = sgState(); s.strategy = el.dataset.v; s.reshuffle = 0; sgRegen({ keepFam: true }); if (S.sgPlaying) sgStopNow(); rerender(); },
  sgNew: () => { const s = sgState(); s.seed++; s.reshuffle = 0; sgRegen(); rerender(); },
  sgPats: () => { const s = sgState(); s.seed++; sgRegen({ keepSections: true }); rerender(); },
  sgStruct: () => { const s = sgState(); s.reshuffle++; sgRegen({ keepFam: true }); rerender(); },
  sgLock: (el) => { const s = sgState(), i = +el.dataset.i; s.locked = s.locked.includes(i) ? s.locked.filter((x) => x !== i) : [...s.locked, i]; sgSave(); rerender(); },
  sgPlay: (el) => sgPlay(+(el.dataset.from || 0)),
  sgStop: () => { sgStopNow(); rerender(); },
  sgRec: () => sgRecord(),
  sgSheet: () => sgSheet(),
  sgMidi: () => sgMidi(),
  sgMore: () => { S.sgMore = !S.sgMore; rerender(); },
});
// Teclado en Canciones: Espacio escucha/para, N/P/E variantes, 1–5 estrategia
document.addEventListener('keydown', (e) => {
  if (S.view !== 'songs' || e.ctrlKey || e.metaKey || e.altKey || e.target.matches?.('input,textarea,select') || document.querySelector('.modal')) return;
  const k = e.key.toLowerCase();
  if (e.code === 'Space') { e.preventDefault(); if (S.sgPlaying) { sgStopNow(); rerender(); } else if (S.dev.session) sgPlay(0); return; }
  if (k === 'n') A.sgNew(); else if (k === 'p') A.sgPats(); else if (k === 'e') A.sgStruct();
  else if (/^[1-5]$/.test(k) && STRATEGY_IDS[+k - 1]) A.sgStrat({ dataset: { v: STRATEGY_IDS[+k - 1] } });
});
document.addEventListener('change', (e) => {
  const el = e.target; if (el.dataset.act !== 'sgSet') return;
  const s = sgState(), k = el.dataset.k, v = el.value;
  if (k === 'style') { s.style = v; s.styles = [...(SONG_SYNTH_STYLES[v] || s.styles)]; if (!s.tempoTouched) s.tempo = DRUM_STYLES[v]?.tempo || s.tempo; sgRegen(); }
  else if (k === 'tempo') { s.tempo = Math.max(40, Math.min(240, +v || 128)); s.tempoTouched = true; if (s.fam) s.fam.tempo = s.tempo; sgSave(); }
  else if (k === 'root' || k === 'scale') { s[k] = k === 'root' ? +v : v; sgRegen(); }
  else if (k === 'steps') { s.steps = +v; s.locked = []; sgRegen(); }
  else if (k === 'density') { s.density = +v; sgRegen(); }
  else if (/^st\d$/.test(k)) { s.styles = [...s.styles]; s.styles[+k[2]] = v; s.locked = s.locked.filter((x) => x !== +k[2]); sgRegen({ keepSections: true }); }
  else if (/^midi\d$/.test(k)) { s.midi = [...s.midi]; s.midi[+k[4]] = el.checked; s.recorded = {}; sgSave(); }
  else if (/^patch\d$/.test(k)) { s.patches = [...s.patches]; s.patches[+k[5]] = v; sgSave(); }
  else if (k === 'drumMap') { s.drumMap = v; sgSave(); return; }
  else return;
  if (S.sgPlaying) sgStopNow();
  rerender();
});

function labName(p, suffix) {

// Guardar como patch nuevo: entra por la importación (huella, clasificación, duplicados) en «Laboratorio/<patch>»
async function labSavePayload(p, payload, name, lab) {

  const before = new Set(lib.patches.map((x) => x.id));
  const rep = await lib.importInputs([{ name: name.replace(/[\\/:*?"<>|]/g, '_') + '.syx', path: 'Laboratorio/' + (p.name || 'Patch').replace(/[\\/:*?"<>|]/g, '_'), bytes: lib.exportSyx({ payload: pl }) }]);

  S.rowsKey = ''; buildQueue();
  toastAct(`Guardado como patch nuevo «${np.name}» en Laboratorio/${p.name}`, 'Abrirlo', () => { S.sel = np.id; S.view = 'library'; S.ctab = 'lab'; rerender(); });
  return np;
}
const LAB_AMOUNT_TEXT = { subtle: 'sutil', medium: 'media', wild: 'salvaje' };

document.addEventListener('change', (e) => {

      : { op: 'cross', from: c.parents, text: c.parents.length > 2 ? `cruce de «${p.name}» con ${c.parents.length - 1} patches de su categoría` : `cruce de «${p.name}» y «${lib.byId(c.parents[1])?.name || '?'}»` };

// ---- ui/quick_ui.js ----
// ui/quick_ui.js — v3.9: lo que se hace mientras se escucha, sin ir a otra sección.
//  · Octava rápida: −8va / +8va (Alt ↓ / Alt ↑) en Escucha, en la ficha y en el patch acoplado. Crea una versión
//    aceptada (la que se exporta y la que suena en el equipo) y las pulsaciones siguientes se suman en esa misma
//    versión. Si vuelve a quedar como el original, la versión se quita. Suena otra vez al momento.
//  · Portapapeles de etiquetas: copiar las de un patch (Mayús V), pegarlas en el que escuchas (V) o en la
//    selección, y guardar conjuntos como grupos («Wobble + Dark») para cargarlos con un clic.

// ---------- octava rápida ----------
// v3.10: se suma a la versión del sonido (una sola versión, con lo demás que hayas cambiado). meta.quickOct lleva la
// cuenta de las octavas movidas a mano; si el sonido vuelve a quedar como el original, la versión se quita.
function quickOctOf(p) { const v = p && faceOf(p); return v && v.kind === 'variant' && v.meta.quickOct ? v.meta.quickOct : 0; }
function octBtnsHTML(p) {
  if (!p) return '';
  const n = quickOctOf(p), lbl = n ? `${n > 0 ? '+' : '−'}${Math.abs(n / 12)} oct` : 'Octava';
  return html`<span class="octq" title="Bajar o subir una octava el patch (Alt ↓ / Alt ↑). Se suma a su versión: suena y se exporta así; el original sigue guardado.">
    <button class="btn small" data-act="qOct" data-n="-12" data-id="${p.id}">−8va</button><b class="mono ${n ? 'on' : ''}">${lbl}</b><button class="btn small" data-act="qOct" data-n="12" data-id="${p.id}">+8va</button></span>`;
}
async function quickOctave(p0, n) {
  if (!p0) return;
  const cv = faceOf(p0), root = lib.rootOf(p0);
  const t = transposeSemitones(cv.payload, n, regMethod(), {});
  if (!t || !t.payload) { toast('No se puede transponer este patch', 5000); return; }
  const total = (cv.kind === 'variant' ? cv.meta.quickOct || 0 : 0) + n;
  const now = await lib.editSound(cv, t.payload, 'register', `Octava ${fmtSemis(total / 12)} (a mano)`);
  if (now.kind === 'variant') await lib.updateMeta([now.id], { quickOct: total }, `Octava a mano: ${fmtSemis(total / 12)} oct`);
  if (S.sel) S.sel = faceOf(lib.byId(S.sel))?.id || now.id;
  S.rowsKey = ''; rerender();
  if (S.dev.session) quickPlay(root, faceOf(root).payload);
  toast(now.id === root.id && root.kind !== 'variant' ? `«${root.name}» vuelve a sonar como el original` : `«${root.name}»: ${fmtSemis(total / 12)} oct respecto al original${t.problems?.length ? ' · ' + t.problems[0] : ''}`, 4000);
}
function quickPlay(p, payload) { playTest(p, payload); }

// ---------- portapapeles de etiquetas ----------

function clipTargets() {
  if (S.view === 'library' && S.multi.size > 1) return [...S.multi];
  const p = cur(); return p ? [p.id] : [];
}
function tagClipHTML() {
  const c = clipTags(), g = tagGroups(), p = cur(), has = p ? (p.meta.tags || []) : [], multi = S.view === 'library' && S.multi.size > 1;

    <div class="tagbox">${c.map((t) => html`<span class="tagp clip">${t}<button data-act="clipDel" data-t="${t}" aria-label="Quitar ${t}">×</button></span>`)}<input class="tagin" id="clipIn" list="tagList" placeholder="${c.length ? 'Añadir…' : 'Escribe una etiqueta, o copia las de un patch'}"></div>
    <div class="row2" style="gap:5px;flex-wrap:wrap;margin-top:5px">
      <button class="btn small" data-act="clipCopy" ${p && has.length ? '' : 'disabled'} title="Las etiquetas de este patch al portapapeles (Mayús V)">Copiar de este</button>
      <button class="btn small ${c.length && (pending || multi) ? 'primary' : ''}" data-act="clipPaste" ${c.length && p ? '' : 'disabled'} title="Añadir las del portapapeles (V)">${multi ? `Pegar en ${S.multi.size}` : pending || !c.length ? 'Pegar en este' : '✓ Ya las tiene'}</button>
      ${c.length ? html`<button class="btn small" data-act="clipGroup" title="Guardar este conjunto para cargarlo con un clic">Guardar como grupo</button><button class="btn small" data-act="clipClear">Vaciar</button>` : ''}</div>
    ${g.length ? html`<div class="chips" style="margin-top:6px">${g.map((x, i) => html`<span class="tgrp"><button class="tq" data-act="clipLoad" data-i="${i}" title="Cargar en el portapapeles: ${x.join(', ')}">${x.join(' + ')}</button><button class="lk" data-act="clipGroupDel" data-i="${i}" aria-label="Quitar el grupo">×</button></span>`)}</div>` : ''}</div>`;

async function clipPaste() {

  rerender(); toast(`${c.join(', ')} → ${ids.length === 1 ? '«' + lib.byId(ids[0]).name + '»' : ids.length + ' patches'}`, 2500);
}

  await setClip(t); rerender(); toast('Copiadas: ' + t.join(', '), 2500);
}

document.addEventListener('keydown', (e) => {
  if (e.target.matches('input,textarea,select') || document.querySelector('.modal') || e.ctrlKey || e.metaKey) return;
  if (!['audition', 'library'].includes(S.view)) return;
  if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) { e.preventDefault(); e.stopImmediatePropagation(); quickOctave(cur(), e.key === 'ArrowUp' ? 12 : -12); return; }
  if (!e.altKey && e.key.toLowerCase() === 'v') { e.preventDefault(); e.stopImmediatePropagation(); if (e.shiftKey) clipCopy(); else clipPaste(); }
}, true);

  await setClip([...clipTags(), ...v.split(',')]); rerender(); setTimeout(() => document.getElementById('clipIn')?.focus(), 0);
});
Object.assign(A, {
  qOct: (el) => quickOctave(lib.byId(el.dataset.id) || cur(), +el.dataset.n),
  clipCopy: () => clipCopy(),
  clipPaste: () => clipPaste(),
  clipDel: async (el) => { await setClip(clipTags().filter((x) => x !== el.dataset.t)); rerender(); },
  clipClear: async () => { await setClip([]); rerender(); },
  clipGroup: async () => { const c = clipTags(); if (!c.length) return; const g = tagGroups().filter((x) => x.join('|') !== c.join('|')); await lib.setSetting('tagGroups', [c, ...g].slice(0, 12)); rerender(); },
  clipLoad: async (el) => { const g = tagGroups()[+el.dataset.i]; if (g) { await setClip(g); rerender(); } },

// ---- ui/listen_ui.js ----
// ui/listen_ui.js — v3.10: lo que se escucha es lo mismo en toda la herramienta, y se ve qué notas suenan.
//  · Una sola regla para la frase de prueba (testPlan): el patrón adjunto al sonido; si no tiene, el patrón generado
//    para él (estilo según su subcarpeta o categoría). La tocan Escucha, la ficha, el patch acoplado, Cambios (A/B),
//    la revisión de octavas, la octava rápida y el Laboratorio. En Escucha se puede elegir otra frase a mano.
//  · Se ve qué se toca («Tónica Do1 · notas Do1–Do2») y cómo suena con la transposición del propio patch
//    (octava de teclado y osciladores): «suena Do0, el patch baja 12 st».
//  · La octava de la frase se cambia ahí mismo (◀ ▶, teclas < y >) sin tocar el patch y se recuerda por
//    categoría / subcarpeta. Con un patrón adjunto, ◀ ▶ mueven el propio patrón (es lo que se exporta como .mid).

// Grupo (categoría / subcarpeta, la tuya o la propuesta) cuya octava de frase se recuerda.
function phraseGroupOf(p) {
  // tu carpeta; si no tienes subcarpeta y la propuesta es de tu misma categoría, su subcarpeta (afina el estilo de la frase)
  const r = lib.rootOf(p), inf = lib.info(r), saved = !!r.meta.category, cat = r.meta.category || inf.cls.category || null;
  const sub = (saved ? r.meta.subtype || (inf.cls.category === cat ? inf.cls.subtype : null) : inf.cls.subtype) || null;
  return { cat, sub, key: cat ? cat + (sub ? '/' + sub : '') : '', label: cat ? catName(cat, sub) : 'los patches sin categoría' };
}
function phraseShiftOf(g) { const m = lib.settings.phraseOct || {}; return m[g.key] ?? (g.sub ? m[g.cat] : undefined) ?? 0; }
async function setPhraseShift(g, v) { const m = { ...(lib.settings.phraseOct || {}) }; m[g.key] = Math.max(-36, Math.min(36, v)); await lib.setSetting('phraseOct', m); }
// Cuánto mueve el patch la nota que recibe (octava de teclado × 12 + semitonos del oscilador que manda).
function heardOffset(payload) { const r = register(payload); return kbdMode() === 'no' ? r.lowestSemis : r.effective; }
const LETTERS = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const letterName = (n) => `${LETTERS[((n % 12) + 12) % 12]}${Math.floor(n / 12) - 2}`;
const noteLbl = (n) => (n === null || n === undefined ? '—' : noteName(n));
// Nota como en Ableton (Do1 = C1 = MIDI 36). En español, también con letra, que es como la muestra Ableton.
const noteHTML = (n) => (n === null || n === undefined ? '—' : html`${noteName(n)}${noteName(n) !== letterName(n) ? html`<span class="lt">${letterName(n)}</span>` : ''}`);

// Qué se va a tocar para este patch y en qué notas.
function testPlan(p, sel = S.phrase) {
  const r = lib.rootOf(p), g = phraseGroupOf(r), shift = phraseShiftOf(g);
  let ph, root = 0, src, label, tonic = null, pat = null;
  if (!sel || sel === 'auto') {
    const att = patternOf(r);
    if (att) { ph = patternToPhrase(att); pat = att; src = 'att'; label = att.name; }
    else { pat = autoPat(r); ph = patternToPhrase(pat); src = 'gen'; label = STYLES[pat.style]?.label || pat.style; tonic = pat.octave + pat.root; }
  } else if (sel.startsWith('pat:')) { pat = findPattern(sel.slice(4)); ph = pat ? patternToPhrase(pat) : PHRASES.test; src = pat ? 'pat' : 'fixed'; label = pat?.name || PHRASES.test.label; }
  else {
    const f = PHRASES[sel] || S.customPhrases[sel] || PHRASES.test;
    if (f.custom) { ph = f; src = 'cap'; label = f.label; }
    else { ph = { ...f, base: (f.base || 0) + shift }; root = S.dev.root || 0; src = 'fixed'; label = f.label; tonic = ph.base + root; }
  }
  const rg = phraseRange(ph, root);
  if (tonic === null && pat && pat.octave !== undefined && pat.octave !== null) tonic = pat.octave + (pat.root || 0);
  if (tonic === null) tonic = rg.lo;
  const v = lib.currentVersion(r), off = heardOffset(v.payload);
  return { ph, root, src, label, tonic, lo: rg.lo, hi: rg.hi, off, shift, group: g, sound: r, pat, steps: ph.steps || Math.max(16, ...ph.notes.map((x) => Math.ceil(x.t + x.d))) };
}
// Envía el patch a la RAM (o la carga que se indique, p. ej. una propuesta o un resultado del Laboratorio) y toca su frase.
function playTest(p, payload) {
  const s = S.dev.session; if (!s || !p) return null;
  s.stopAll();
  const tp = testPlan(p), t = s.sendPatch(payload || lib.currentVersion(lib.rootOf(p)).payload, S.dev.synth);
  return s.playPhrase(tp.ph, S.dev.synth, { tempo: tempoNow(), root: tp.root, start: t + (S.dev.patchDelay ?? 80) });
}
// ◀ ▶: la frase una octava abajo o arriba (sin tocar el patch). Con patrón adjunto, se mueve el patrón.
async function shiftPhrase(p, d) {
  if (!p) return;
  const tp = testPlan(p);
  if (tp.src === 'cap') { toast('Frase capturada del equipo: se toca tal cual la tocaste'); return; }
  if (tp.lo + d < 0 || tp.hi + d > 127) { toast('No cabe más ' + (d < 0 ? 'abajo' : 'arriba')); return; }
  if (tp.src === 'att' || tp.src === 'pat') {
    const moved = transposePattern(tp.pat, d); if (!moved) return;
    await lib.setSetting('patterns', (lib.settings.patterns || []).map((x) => (x.id === tp.pat.id ? { ...moved, opts: { ...(x.opts || {}), octave: moved.octave } } : x)));
    toast(`Patrón «${tp.pat.name}»: ${noteLbl(tp.tonic + d)}${tp.src === 'att' ? ' (también su .mid)' : ''}`);
  } else { await setPhraseShift(tp.group, tp.shift + d); toast(`Frase de ${tp.group.label}: tónica en ${noteLbl(tp.tonic + d)}`, 2600); }
  rerender(); if (S.dev.session) audPlay(p);
}
// Recuadro de la frase de prueba: rejilla, de dónde sale, qué notas se tocan, cómo suenan y la octava.
function testBox(p, where = 'aud') {
  const tp = testPlan(p, where === 'aud' ? S.phrase : 'auto'), live = !!S.dev.session, auto = where !== 'aud' || S.phrase === 'auto';
  const roll = { steps: tp.steps, notes: tp.ph.notes.map((x) => ({ ...x, n: x.n + (tp.ph.base || 0) + tp.root })) };
  const why = tp.src === 'att' ? (lib.rootOf(p).meta.patternId ? 'patrón adjunto' : 'patrón del original') : tp.src === 'gen' ? `generado para ${tp.group.cat ? tp.group.label : 'un patch sin categoría'}` : tp.src === 'pat' ? 'tu patrón' : tp.src === 'cap' ? 'frase capturada' : 'frase fija';
  const heard = tp.tonic + tp.off, att = tp.src === 'att';
  const range = tp.lo === tp.hi ? noteLbl(tp.lo) : `${noteLbl(tp.lo)}–${noteLbl(tp.hi)}`;
  return html`<div class="tbox"><div class="mlabel"><span>Frase de prueba</span><span>${why}</span></div>
    <button class="mroll-w ${att ? 'att' : ''}" data-act="${att ? 'patOpenFor' : tp.src === 'gen' ? 'autoOpen' : 'noop'}" data-id="${p.id}" title="${tp.src === 'gen' || att ? 'Abrir en Patrones para editarlo' : ''}">${miniRoll(roll)}</button>
    <p class="note tlabel"><b>${tp.label}</b>${tp.src === 'gen' ? html` · ${NOTE_NAMES_ES[tp.pat.root]} menor · ${tp.pat.steps} pasos` : ''}</p>
    <div class="tnotes"><span class="tn" title="MIDI ${tp.tonic}"><i>Tónica</i><b class="mono">${noteHTML(tp.tonic)}</b></span>
      ${tp.src === 'cap' ? '' : html`<span class="octq"><button class="btn small" data-act="phOct" data-d="-12" data-id="${p.id}" title="Toca la frase una octava más abajo (tecla ${LT}). No cambia el patch.">◀ 8va</button><button class="btn small" data-act="phOct" data-d="12" data-id="${p.id}" title="Toca la frase una octava más arriba (Mayús ${LT}). No cambia el patch.">8va ▶</button></span>`}
      <span class="tn" title="MIDI ${tp.lo}–${tp.hi}"><i>Notas</i><b class="mono">${range}</b></span>
      <span class="tn ${tp.off ? 'moved' : ''}" title="La nota que suena al tocar la tónica, con la octava de teclado y los semitonos de este patch"><i>Suena</i><b class="mono">${noteHTML(heard)}</b>${tp.off ? html`<small>el patch ${fmtSemis(tp.off)} st</small>` : ''}</span></div>
    <p class="note" style="margin-top:4px">${att ? 'Con un patrón adjunto se tocan sus notas: ◀ ▶ mueven el propio patrón (también su .mid).' : tp.src === 'cap' ? 'La frase capturada se toca tal cual.' : html`La octava de la frase se recuerda para <b>${tp.group.label}</b>; no cambia el patch${tp.off && Math.abs(tp.off) >= 12 ? html` (para cambiar el patch: −8va / +8va)` : ''}.`}</p>
    ${auto ? html`<div class="row2" style="margin-top:6px;flex-wrap:wrap;gap:5px"><button class="btn small" data-act="listenSel" ${live ? '' : 'disabled'} title="${live ? 'Espacio' : 'Conecta el equipo en Equipo'}">${raw(IC.play)}Escuchar</button>
      ${att ? html`${lib.rootOf(p).meta.patternId ? html`<button class="btn small" data-act="autoDetach">Quitar</button>` : ''}<button class="btn small" data-act="patOpenFor" data-id="${p.id}">Editar</button>` : tp.src === 'gen' ? html`<button class="btn small" data-act="autoNext" title="Otra variación${where === 'aud' ? '' : ' (G)'}">Otro</button><button class="btn small accent" data-act="autoAttach" title="${where === 'aud' ? '' : 'A'}">Adjuntar al patch</button>` : ''}</div>
    ${tp.src === 'gen' && where !== 'aud' ? html`<p class="note" style="margin-top:6px">Si te convence cómo suena, adjúntalo: se guarda en tus patrones, sonará siempre con este patch y «Ordenar en disco» pondrá su .mid al lado del .syx.</p>` : ''}` : ''}</div>`;
}
